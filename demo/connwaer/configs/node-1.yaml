license_dir: /srv/vigo/license
results_dir: /var/lib/connwaer/results
trends_db: /var/lib/connwaer/trends.db
log_level: debug

capabilities:
  time_sync:
    enabled: true
    schedule: "@every 2m"
    params:
      ntp_server: "ntp-server"
    thresholds:
      max_offset_ms: 200

  capacity_monitor:
    enabled: true
    schedule: "@every 5m"
    thresholds:
      disk_usage_max_pct: 90
      memory_usage_max_pct: 90

  worm_verify:
    enabled: true
    schedule: "@every 5m"
    params:
      worm_path: "/mnt/worm"

  snmp_collector:
    enabled: true
    schedule: "@every 3m"
    params:
      targets:
        - host: "snmp-target"
          port: 161
          community: "public"
          oids:
            - "1.3.6.1.2.1.1.1.0"     # sysDescr
            - "1.3.6.1.2.1.1.3.0"     # sysUpTime
            - "1.3.6.1.2.1.1.5.0"     # sysName

  network_segmentation:
    enabled: true
    schedule: "@every 5m"
    params:
      blocked_targets:
        - "snmp-target:22"
      allowed_targets:
        - "snmp-target:161"

  session_timeout:
    enabled: true
    schedule: "@every 10m"
    thresholds:
      max_idle_seconds: 900

  password_policy:
    enabled: true
    schedule: "@every 10m"
    thresholds:
      min_length: 8

  privilege_escalation:
    enabled: true
    schedule: "@every 10m"
