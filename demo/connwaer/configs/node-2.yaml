results_dir: /var/lib/connwaer/results
trends_db: /var/lib/connwaer/trends.db
log_level: debug

capabilities:
  time_sync:
    enabled: true
    schedule: "@every 2m"
    params:
      ntp_server: "ntp-server"
    thresholds:
      max_offset_ms: 200

  capacity_monitor:
    enabled: true
    schedule: "@every 3m"
    thresholds:
      disk_usage_max_pct: 85
      memory_usage_max_pct: 85

  session_timeout:
    enabled: true
    schedule: "@every 10m"
    thresholds:
      max_idle_seconds: 600

  snmp_collector:
    enabled: true
    schedule: "@every 5m"
    params:
      targets:
        - host: "snmp-target"
          port: 161
          community: "public"
          oids:
            - "1.3.6.1.2.1.1.1.0"
