{{define "base"}}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{.Title}}</title>
    <link rel="icon" type="image/svg+xml" href="/static/img/icon.svg">
    <link rel="stylesheet" href="/static/css/site.css">
</head>
<body>
    <header class="site-header">
        <div class="site-header__inner">
            <a href="/" class="site-header__logo"><img src="/static/img/logo.svg" alt="Vigo" class="site-header__logo-img"></a>
            <nav class="site-nav">
                <a href="/overview" class="site-nav__link{{if eq .ActiveNav "overview"}} site-nav__link--active{{end}}">Overview</a>
                <a href="/differentiators" class="site-nav__link{{if eq .ActiveNav "differentiators"}} site-nav__link--active{{end}}">Why Vigo</a>
                <a href="/comparison" class="site-nav__link{{if eq .ActiveNav "comparison"}} site-nav__link--active{{end}}">Comparison</a>
                <a href="/docs/use-cases" class="site-nav__link{{if eq .ActiveNav "use-cases"}} site-nav__link--active{{end}}">Use Cases</a>
                <a href="/migration" class="site-nav__link{{if eq .ActiveNav "migration"}} site-nav__link--active{{end}}">Migration</a>
                <a href="/docs" class="site-nav__link{{if eq .ActiveNav "docs"}} site-nav__link--active{{end}}">Documentation</a>
                <a href="/pricing" class="site-nav__link{{if eq .ActiveNav "pricing"}} site-nav__link--active{{end}}">Pricing</a>
            </nav>
        </div>
    </header>
    <main class="site-main">
        {{template "content" .}}
    </main>
    <footer class="site-footer">
        <div class="site-footer__inner">
            <p>Alexander4, LLC &mdash; <a href="mailto:vigo.licensing@alexander4.org">vigo.licensing@alexander4.org</a></p>
        </div>
    </footer>
</body>
</html>
{{end}}
