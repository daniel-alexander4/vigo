# Development compose — builds from source. Used by `make up`.
# For production, see docker-compose.prod.yml.

services:
  vigo:
    container_name: vigo
    build:
      context: .
      dockerfile: Dockerfile.server
    # Host networking: server binds 1530/8443/1531 directly on the host stack —
    # no bridge, no per-port docker-proxy byte-pump. Mirrors docker-compose.prod.yml;
    # guacd is host-networked too so scrier reaches it at 127.0.0.1:4822.
    network_mode: host
    # One FD per agent connection; default 65536 caps the server near ~63k
    # concurrent agents. Lift it so memory (~220 KB/conn), not FDs, is the limit.
    ulimits:
      nofile:
        soft: 1048576
        hard: 1048576
    volumes:
      - /srv/vigo:/srv/vigo
      - /var/lib/vigo/swarm:/var/lib/vigo/swarm
      - /usr/local/bin:/host-bin
      - /etc/localtime:/etc/localtime:ro
    depends_on:
      postgres:
        condition: service_healthy
        required: false

  postgres:
    image: postgres:17-alpine
    container_name: vigo-postgres
    profiles: ["postgres"]
    environment:
      POSTGRES_DB: vigo
      POSTGRES_USER: vigo
      POSTGRES_PASSWORD: vigo
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vigo"]
      interval: 5s
      timeout: 5s
      retries: 10

  ollama:
    image: ollama/ollama:latest
    container_name: vigo-ollama
    restart: unless-stopped
    profiles: ["ollama"]
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 10
    environment:
      - OLLAMA_KEEP_ALIVE=-1
      - OLLAMA_NUM_PARALLEL=1
      - OLLAMA_MAX_LOADED_MODELS=1
      - OLLAMA_NUM_THREADS=16
      - OLLAMA_FLASH_ATTENTION=1
    # GPU passthrough (optional — remove for CPU-only)
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  guacd:
    image: guacamole/guacd:1.5.5
    container_name: vigo-guacd
    restart: unless-stopped
    command: ["-b", "0.0.0.0", "-L", "debug", "-f"]
    # Host-networked so the host-networked vigo server reaches it at 127.0.0.1:4822
    # (no bridge DNS). Mirrors docker-compose.prod.yml.
    network_mode: host
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 4822 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  ollama-data:
  postgres-data:
