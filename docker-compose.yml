services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: isogov
      POSTGRES_USER: isogov
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U isogov"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    ports:
      - "9090:9090"
      - "8080:8080"
    volumes:
      - ./config:/config:ro
      - ./certs:/certs:ro
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy

  # Agent is NOT run in compose -- it is installed on each managed node separately

volumes:
  pgdata:
