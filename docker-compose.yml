services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: hobnob
      POSTGRES_USER: hobnob
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hobnob"]
      interval: 5s
      timeout: 5s
      retries: 5

  hobnob:
    container_name: hobnob
    build:
      context: .
      dockerfile: Dockerfile.server
    ports:
      - "1530:1530"
      - "8085:8080"
    volumes:
      - /etc/hobnob/node-configs:/node-configs:ro
      - /etc/hobnob/server-configs:/server-configs:ro
      - /etc/hobnob/server-configs/certs:/certs:ro
    env_file:
      - /etc/hobnob/server-configs/.env
    depends_on:
      postgres:
        condition: service_healthy

  # Agent is NOT run in compose -- it is installed on each managed node separately

volumes:
  pgdata:
