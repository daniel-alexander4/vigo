# Development compose — builds from source. Used by `make up`.
# For production, see docker-compose.prod.yml.

services:
  vigo:
    container_name: vigo
    build:
      context: .
      dockerfile: Dockerfile.server
    # Host networking: server binds 1530/8443/1531 directly on the host stack —
    # no bridge, no per-port docker-proxy byte-pump. Mirrors docker-compose.prod.yml;
    # guacd is host-networked too so scrier reaches it at 127.0.0.1:4822.
    network_mode: host
    # One FD per agent connection; default 65536 caps the server near ~63k
    # concurrent agents. Lift it so memory (~220 KB/conn), not FDs, is the limit.
    ulimits:
      nofile:
        soft: 1048576
        hard: 1048576
    volumes:
      - /srv/vigo:/srv/vigo
      - /var/lib/vigo/swarm:/var/lib/vigo/swarm
      - /usr/local/bin:/host-bin
      - /etc/localtime:/etc/localtime:ro
    # Readiness: GET /healthz answers 200 once the server is up and 503 while it
    # starts or stops. --no-check-certificate because the cert is the
    # self-signed Vigo CA; the probe stays on loopback.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "--no-check-certificate", "https://127.0.0.1:8443/healthz"]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 3
    depends_on:
      postgres:
        condition: service_healthy
        required: false

  postgres:
    image: postgres:17-alpine
    container_name: vigo-postgres
    profiles: ["postgres"]
    # Host-networked and listening on loopback only: vigo is host-networked, so
    # it reaches Postgres at 127.0.0.1:5432 and nothing off-host can. The
    # password comes from VIGO_POSTGRES_PASSWORD in /srv/vigo/.env; with it unset
    # the Postgres image refuses to initialise rather than start with a default.
    network_mode: host
    command: ["postgres", "-c", "listen_addresses=127.0.0.1"]
    environment:
      POSTGRES_DB: vigo
      POSTGRES_USER: vigo
      POSTGRES_PASSWORD: ${VIGO_POSTGRES_PASSWORD:-}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vigo"]
      interval: 5s
      timeout: 5s
      retries: 10

  ollama:
    image: ollama/ollama:latest
    container_name: vigo-ollama
    restart: unless-stopped
    profiles: ["ollama"]
    # Host-networked and bound to loopback: the host-networked vigo server
    # reaches it at http://127.0.0.1:11434, and the unauthenticated Ollama API
    # is not exposed off-host. (The image's default OLLAMA_HOST is 0.0.0.0.)
    network_mode: host
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 10
    environment:
      - OLLAMA_HOST=127.0.0.1:11434
      - OLLAMA_KEEP_ALIVE=-1
      - OLLAMA_NUM_PARALLEL=1
      - OLLAMA_MAX_LOADED_MODELS=1
      - OLLAMA_NUM_THREADS=16
      - OLLAMA_FLASH_ATTENTION=1
    # GPU passthrough (optional — remove for CPU-only)
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  guacd:
    image: guacamole/guacd:1.5.5
    container_name: vigo-guacd
    restart: unless-stopped
    # Loopback only: guacd has no authentication, and on 0.0.0.0 it would be an
    # open RDP/VNC/SSH relay. `-L debug` is dev-only verbosity (this file is the
    # source-build compose); docker-compose.prod.yml runs at the default level.
    command: ["-b", "127.0.0.1", "-L", "debug", "-f"]
    # Host-networked so the host-networked vigo server reaches it at 127.0.0.1:4822
    # (no bridge DNS). Mirrors docker-compose.prod.yml.
    network_mode: host
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 4822 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  ollama-data:
  postgres-data:
