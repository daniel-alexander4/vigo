// =============================================================================
// Peer replication service (primary↔peer, port 1530)
// =============================================================================

service VigoPeer {
  // SyncStream is a bidirectional stream between primary and peer.
  // Primary pushes file changes; peer acknowledges receipt.
  rpc SyncStream(stream PeerSyncMessage) returns (stream PeerSyncMessage);

  // Promote requests the target server to become primary.
  rpc Promote(PeerPromoteRequest) returns (PeerPromoteResponse);

  // Status returns the server's current peer role and sync state.
  rpc Status(PeerStatusRequest) returns (PeerStatusResponse);

  // Demote tells the target server to step down to peer role. Sent by a
  // newly-promoted primary to the superseded primary so it stops pushing
  // immediately rather than discovering it on the next rejected sync.
  rpc Demote(PeerDemoteRequest) returns (PeerDemoteResponse);
}

message PeerSyncMessage {
  oneof payload {
    PeerFileChange file_change = 1;
    PeerSyncAck ack = 2;
    PeerFullSync full_sync = 3;
  }
}

message PeerFileChange {
  string path = 1;           // relative to /srv/vigo (e.g., "stacks/modules/nginx.vgo")
  bytes content = 2;         // file contents (empty = deletion)
  int64 mtime_unix = 3;      // modification time (unix seconds)
  uint32 mode = 4;           // file permissions
}

message PeerSyncAck {
  string path = 1;
  bool success = 2;
  string error = 3;
}

message PeerFullSync {
  repeated PeerFileChange files = 1;
}

message PeerPromoteRequest {}

message PeerPromoteResponse {
  bool success = 1;
  string message = 2;
}

message PeerDemoteRequest {}

message PeerDemoteResponse {}

message PeerStatusRequest {}

message PeerStatusResponse {
  string role = 1;            // "primary" or "peer"
  string primary_addr = 2;    // address of current primary (empty if self is primary)
  int64 last_sync_unix = 3;   // unix timestamp of last successful sync
  int64 files_synced = 4;     // total files in sync
  uint64 config_version = 5;  // current config version (for split-brain resolution)
}

// =============================================================================
// Scrier — Remote access tunnel messages
// =============================================================================

// TunnelClientMessage is sent by the agent to the server on the TunnelStream.
// First message must be TunnelHandshake to identify the envoy.
message TunnelClientMessage {
  oneof msg {
    TunnelHandshake handshake = 1;
    TunnelData data = 2;
    TunnelClose close = 3;
    TunnelOpenResult open_result = 4;
  }
}

// TunnelServerMessage is sent by the server to the agent on the TunnelStream.
message TunnelServerMessage {
  oneof msg {
    TunnelOpen open = 1;
    TunnelData data = 2;
    TunnelClose close = 3;
  }
}

// TunnelHandshake is the first message the agent sends to identify itself.
message TunnelHandshake {
  string envoy_id = 1;
  bytes signature = 2;         // signs envoy_id+timestamp with agent private key
  string timestamp = 3;        // Unix seconds string used in signature
}

// TunnelOpen instructs the agent to connect to a localhost port.
message TunnelOpen {
  string tunnel_id = 1;       // UUID assigned by server
  string target_host = 2;     // always "127.0.0.1" — agent enforces this
  uint32 target_port = 3;     // SSH=22, RDP=3389, VNC=5900 (hint — agent may override for VNC)
  string protocol = 4;        // "ssh", "rdp", "vnc"
  string ssh_verify_pubkey = 5;    // web user's SSH pubkey — agent scans every regular user's authorized_keys for it
  string ssh_ephemeral_pubkey = 6; // per-session pubkey — agent installs temporarily into the matching user's authorized_keys
  string consent_mode = 7;         // VNC shadow: "always" (prompt user) or "never" (unattended)
}

// TunnelOpenResult is the agent's response to TunnelOpen.
message TunnelOpenResult {
  string tunnel_id = 1;
  bool success = 2;
  string error_message = 3;   // set when success=false (e.g., "connection refused", "user denied consent")
  string ssh_username = 4;    // Unix user whose authorized_keys matched the verify pubkey
  uint32 vnc_port = 5;        // actual port VNC server is listening on (x11vnc auto-assigns)
  string vnc_password = 6;    // per-session VNC password (Windows TightVNC — passed to guacd)
}

// TunnelData carries raw bytes between the agent's localhost connection and guacd.
message TunnelData {
  string tunnel_id = 1;
  bytes payload = 2;
}

// TunnelClose signals that one side is closing the tunnel.
message TunnelClose {
  string tunnel_id = 1;
  string reason = 2;          // "user_disconnect", "target_closed", "timeout", etc.
}

// Wake RPC — agent calls this instead of sleeping between check-in cycles.
// Server holds the response until urgent work arrives or the interval expires.

message WakeRequest {
  string envoy_id = 1;
  bytes signature = 2;        // ED25519 signature of envoy_id + timestamp
  string timestamp = 3;       // Unix seconds string used in signature
}

message WakeResponse {
  string reason = 1;          // why the server woke the agent ("tunnel_requested", "task_dispatch", etc.) — empty for timeout
}

message ResolveSecretsRequest {
  string envoy_id = 1;
  bytes signature = 2;        // ED25519 signature over envoy_id + timestamp + sorted(refs).
  string timestamp = 3;       // Unix seconds string used in signature.
  repeated string refs = 4;   // Secret paths to resolve (e.g. "vigo/db/dsn"). Every ref must appear in the calling envoy's matched pattern's referenced-secrets set; un-entitled refs make the whole call fail PermissionDenied + emit secret.entitlement_denied audit.
}

message ResolveSecretsResponse {
  // Resolved values keyed by the same paths sent in the request.
  // Resolution is all-or-nothing — partial results aren't returned.
  map<string, string> values = 1;
  int64 secrets_epoch = 2;    // Echo of the current server-side epoch at resolution time; agent uses it to invalidate the local cache when the next CheckIn carries a higher value.
}
