// =============================================================================
// Convergence messages
// =============================================================================

message GetConvergenceSummaryRequest {}

message GetConvergenceSummaryResponse {
  reserved 3;
  reserved "relapsed";  // dropped in the convergence axis split
  int32 total = 1;
  // Failure axis (mutually exclusive; sums to total).
  int32 converged = 2;
  int32 degraded = 10;
  int32 failed = 4;
  int32 no_data = 6;
  // Drift axis (orthogonal to failure; diverged is a subset of changed).
  int32 changed = 11;
  int32 diverged = 8;
  // Reachability.
  int32 offline = 5;
  float convergence_pct = 7;
  // snapshot_age_seconds is the age, in seconds, of the oldest peer
  // fleet-snapshot that contributed to this aggregate (spanner Slice
  // 2-ii-a). Zero when the answer is purely local (standalone, or the
  // hub-fan-out / fanout paths which query peers live). Operators read
  // it to gauge how stale a gossip-aggregated answer is.
  int64 snapshot_age_seconds = 9;
}

message GetSecuritySummaryRequest {}

// CveSeverity is one deduped CVE on a bolt — the CVE ID plus the highest
// severity any host on that bolt reported it at. The federated viewer
// unions these by ID across bolts (taking the max severity) so the
// fleet unique-CVE count is correct and not double-counted.
message CveSeverity {
  string id = 1;
  string severity = 2; // critical | high | medium | low | info
}

message GetSecuritySummaryResponse {
  // Deduped unique CVEs on this bolt (union across bolts at the viewer).
  repeated CveSeverity unique_cves = 1;
  // Additive per-host counts (a host belongs to one bolt → summable).
  int32 certs_expiring_soon = 2;
  int32 certs_expired = 3;
  int32 certs_expiring_in7 = 4;
  int32 certs_expiring_in30 = 5;
  int32 cert_hosts_affected = 6;
  int32 rootkit_warnings = 7;
  int32 running_cves_total = 8;
  int32 running_cves_critical = 9;
  int32 running_cves_high = 10;
  int32 running_cves_medium = 11;
  int32 running_cves_low = 12;
  int32 running_cve_hosts_affected = 13;
}

message GetRiskSummaryRequest {}

message GetRiskSummaryResponse {
  // score_sum / scored_count let the viewer re-mean across bolts
  // (avg = score_sum / scored_count); the buckets are additive counts.
  int64 score_sum = 1;
  int32 scored_count = 2;
  int32 critical = 3;
  int32 high = 4;
  int32 medium = 5;
  int32 low = 6;
}

message GetComplianceSummaryRequest {}

message GetComplianceSummaryResponse {
  // Additive control-bucket counts summed over this bolt's enabled
  // frameworks (per-framework buckets are disjoint, so they never
  // double-count; across bolts they sum as partition-scoped instances).
  int32 satisfied = 1;
  int32 waived = 2;
  int32 partial = 3;
  int32 not_satisfied = 4;
  int32 total = 5;
  // pct_sum / pct_count carry the un-divided numerator and denominator of
  // the unweighted per-framework-percent mean (one count per framework
  // that has controls), so the viewer re-means over the bolt union:
  // Pct = pct_sum / pct_count.
  double pct_sum = 6;
  int32 pct_count = 7;
}

message GetScopedPageDataRequest {
  string page_id = 1; // "security", "risk", "agent-health", "compliance", "envoys", "runs"
}

message GetScopedPageDataResponse {
  bytes json = 1; // json.Marshal of the page's ui.<Page>Data (data fields only; viewer supplies chrome)
}

message GetEnvoyConvergenceRequest {
  string id = 1;
}

message GetEnvoyConvergenceResponse {
  string status = 1;
  Run last_run = 2;
  repeated ConvergenceSnapshot history = 3;
}

message ConvergenceSnapshot {
  string date = 1;
  int32 total = 2;
  // Failure axis (mutually exclusive; sums to total).
  int32 converged = 3;
  int32 degraded = 9;
  int32 failed = 5;
  int32 no_data = 7;
  // Drift axis (overlapping; diverged ⊆ changed).
  int32 changed = 10;
  int32 diverged = 8;
  // Reachability axis.
  int32 offline = 6;
  reserved 4;            // formerly "relapsed"; dropped in the axis split.
  reserved "relapsed";
}

