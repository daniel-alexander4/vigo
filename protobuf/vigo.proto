  string id = 1;
  string envoy_id = 2;
  google.protobuf.Timestamp started_at = 3;
  google.protobuf.Timestamp finished_at = 4;
  string status = 5;          // running, success, failure, partial
  int32 resource_count = 6;
  int32 changed_count = 7;
  int32 failed_count = 8;
  int32 skipped_count = 9;
}

message GetRunRequest {
  string id = 1;
}

message GetRunResponse {
  Run run = 1;
  repeated ResourceRunResult results = 2;
}

message GenerateTokenRequest {}

message GenerateTokenResponse {
  string token = 1;
}

