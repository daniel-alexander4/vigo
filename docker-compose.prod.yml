# Production compose — pulls pre-built image from registry.
#
# Quick start:
#   mkdir -p /srv/vigo
#   docker run --rm -v /srv/vigo:/srv/vigo us-west1-docker.pkg.dev/project-69f2499e-5082-48f0-b19/vigo/vigo:latest --seed-only
#   cd /srv/vigo && docker compose up -d
#
# Optional services — set VIGO_SERVICES in .env:
#   VIGO_SERVICES=ollama              # local AI assistant
#   VIGO_SERVICES=postgres            # Postgres instead of SQLite
#   VIGO_SERVICES=ollama,postgres     # both

services:
  vigo:
    image: us-west1-docker.pkg.dev/project-69f2499e-5082-48f0-b19/vigo/vigo:latest
    container_name: vigo
    restart: unless-stopped
    # Host networking: the server binds 1530 (gRPC), 8443 (REST/UI), and 1531
    # (swarm blobs) directly on the host stack — no bridge, no per-port
    # docker-proxy userland byte-pump between agents and the server. This is the
    # production-representative path: agents reach the server over the wire, and
    # at fleet scale docker-proxy is a single-process bottleneck. guacd is also
    # host-networked (below) so scrier reaches it at 127.0.0.1:4822.
    network_mode: host
    env_file:
      - /srv/vigo/.env
    volumes:
      - /srv/vigo:/srv/vigo
      - /var/lib/vigo/swarm:/var/lib/vigo/swarm
      - /usr/local/bin:/host-bin
      - /etc/localtime:/etc/localtime:ro
    depends_on:
      postgres:
        condition: service_healthy
        required: false

  postgres:
    image: postgres:17-alpine
    container_name: vigo-postgres
    restart: unless-stopped
    profiles: ["postgres"]
    environment:
      POSTGRES_DB: vigo
      POSTGRES_USER: vigo
      POSTGRES_PASSWORD: vigo
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vigo"]
      interval: 5s
      timeout: 5s
      retries: 10

  ollama:
    image: ollama/ollama:latest
    container_name: vigo-ollama
    restart: unless-stopped
    profiles: ["ollama"]
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 10
    environment:
      - OLLAMA_KEEP_ALIVE=-1
      - OLLAMA_NUM_PARALLEL=1
      - OLLAMA_MAX_LOADED_MODELS=1
      - OLLAMA_NUM_THREADS=8
      - OLLAMA_FLASH_ATTENTION=1
    # GPU passthrough (uncomment for GPU-accelerated AI)
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  guacd:
    image: guacamole/guacd:1.5.5
    container_name: vigo-guacd
    restart: unless-stopped
    # Host-networked so the host-networked vigo server can reach it at
    # 127.0.0.1:4822 (container-name DNS is unavailable without the bridge).
    # guacd binds 0.0.0.0:4822; only the local vigo server connects to it.
    network_mode: host
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 4822 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  ollama-data:
  postgres-data:
