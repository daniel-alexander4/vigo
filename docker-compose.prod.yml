# Production compose — pulls pre-built image from registry.
#
# Quick start:
#   mkdir -p /srv/vigo
#   docker run --rm -v /srv/vigo:/srv/vigo ghcr.io/daniel-alexander4/vigo:latest --seed-only
#   cd /srv/vigo && docker compose up -d
#
# Optional services — set VIGO_SERVICES in .env:
#   VIGO_SERVICES=ollama              # local AI assistant
#   VIGO_SERVICES=postgres            # Postgres instead of SQLite
#   VIGO_SERVICES=ollama,postgres     # both

services:
  vigo:
    image: ghcr.io/daniel-alexander4/vigo:latest
    container_name: vigo
    restart: unless-stopped
    ports:
      - "1530:1530"   # gRPC (agent check-in)
      - "8443:8443"   # REST API + Web UI (HTTPS)
    env_file:
      - /srv/vigo/.env
    volumes:
      - /srv/vigo:/srv/vigo
      - /usr/local/bin:/host-bin
    depends_on:
      postgres:
        condition: service_healthy
        required: false

  postgres:
    image: postgres:17-alpine
    container_name: vigo-postgres
    restart: unless-stopped
    profiles: ["postgres"]
    environment:
      POSTGRES_DB: vigo
      POSTGRES_USER: vigo
      POSTGRES_PASSWORD: vigo
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vigo"]
      interval: 5s
      timeout: 5s
      retries: 10

  ollama:
    image: ollama/ollama:latest
    container_name: vigo-ollama
    restart: unless-stopped
    profiles: ["ollama"]
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 10
    environment:
      - OLLAMA_KEEP_ALIVE=-1
      - OLLAMA_NUM_PARALLEL=1
      - OLLAMA_MAX_LOADED_MODELS=1
      - OLLAMA_NUM_THREADS=8
      - OLLAMA_FLASH_ATTENTION=1
    # GPU passthrough (uncomment for GPU-accelerated AI)
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

volumes:
  ollama-data:
  postgres-data:
