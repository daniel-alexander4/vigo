# Production compose — runs the image tagged below.
#
# The registry is private (maintainer-only); images are not published for
# anonymous pull. Build the image locally first (`sudo scripts/upgrade.sh
# full --norun`, which tags it with this name), then seed and start — see
# README.md "Quickstart":
#   sudo mkdir -p /srv/vigo
#   docker run --rm -v /srv/vigo:/srv/vigo us-west1-docker.pkg.dev/project-69f2499e-5082-48f0-b19/vigo/vigo:latest --seed-only
#   cd /srv/vigo && docker compose up -d
#
# Optional services — set COMPOSE_PROFILES in .env:
#   COMPOSE_PROFILES=ollama              # local AI assistant
#   COMPOSE_PROFILES=postgres            # Postgres instead of SQLite (also set VIGO_POSTGRES_PASSWORD)
#   COMPOSE_PROFILES=ollama,postgres     # both

services:
  vigo:
    image: us-west1-docker.pkg.dev/project-69f2499e-5082-48f0-b19/vigo/vigo:latest
    container_name: vigo
    restart: unless-stopped
    # Host networking: the server binds 1530 (gRPC), 8443 (REST/UI), and 1531
    # (swarm blobs) directly on the host stack — no bridge, no per-port
    # docker-proxy userland byte-pump between agents and the server. This is the
    # production-representative path: agents reach the server over the wire, and
    # at fleet scale docker-proxy is a single-process bottleneck. guacd is also
    # host-networked (below) so scrier reaches it at 127.0.0.1:4822.
    network_mode: host
    # One file descriptor per agent connection (plus DB/listener/pipe FDs). The
    # default 65536 caps the server near ~63k concurrent agents; lift it so the
    # binding limit is host memory (~220 KB RSS/conn), not FDs. Matches the host.
    ulimits:
      nofile:
        soft: 1048576
        hard: 1048576
    env_file:
      - /srv/vigo/.env
    volumes:
      - /srv/vigo:/srv/vigo
      - /var/lib/vigo/swarm:/var/lib/vigo/swarm
      - /usr/local/bin:/host-bin
      - /etc/localtime:/etc/localtime:ro
    # Readiness: GET /healthz answers 200 once the server is up and 503 while it
    # starts or stops. --no-check-certificate because the cert is the
    # self-signed Vigo CA; the probe stays on loopback.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "--no-check-certificate", "https://127.0.0.1:8443/healthz"]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 3
    depends_on:
      postgres:
        condition: service_healthy
        required: false

  postgres:
    image: postgres:17-alpine
    container_name: vigo-postgres
    restart: unless-stopped
    profiles: ["postgres"]
    # Host-networked and listening on loopback only: vigo is host-networked, so
    # it reaches Postgres at 127.0.0.1:5432 and nothing off-host can. The
    # password comes from VIGO_POSTGRES_PASSWORD in /srv/vigo/.env; with it unset
    # the Postgres image refuses to initialise rather than start with a default.
    network_mode: host
    command: ["postgres", "-c", "listen_addresses=127.0.0.1"]
    environment:
      POSTGRES_DB: vigo
      POSTGRES_USER: vigo
      POSTGRES_PASSWORD: ${VIGO_POSTGRES_PASSWORD:-}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vigo"]
      interval: 5s
      timeout: 5s
      retries: 10

  ollama:
    image: ollama/ollama:latest
    container_name: vigo-ollama
    restart: unless-stopped
    profiles: ["ollama"]
    # Host-networked and bound to loopback: the host-networked vigo server
    # reaches it at http://127.0.0.1:11434, and the unauthenticated Ollama API
    # is not exposed off-host. (The image's default OLLAMA_HOST is 0.0.0.0.)
    network_mode: host
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 10
    environment:
      - OLLAMA_HOST=127.0.0.1:11434
      - OLLAMA_KEEP_ALIVE=-1
      - OLLAMA_NUM_PARALLEL=1
      - OLLAMA_MAX_LOADED_MODELS=1
      - OLLAMA_NUM_THREADS=8
      - OLLAMA_FLASH_ATTENTION=1
    # GPU passthrough (uncomment for GPU-accelerated AI)
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  guacd:
    image: guacamole/guacd:1.5.5
    container_name: vigo-guacd
    restart: unless-stopped
    # Host-networked so the host-networked vigo server can reach it at
    # 127.0.0.1:4822 (container-name DNS is unavailable without the bridge).
    # guacd has no authentication, so it binds loopback only: bound to 0.0.0.0
    # it would be an open RDP/VNC/SSH relay for anyone who can reach the host.
    command: ["/opt/guacamole/sbin/guacd", "-b", "127.0.0.1", "-f"]
    network_mode: host
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 4822 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  ollama-data:
  postgres-data:
