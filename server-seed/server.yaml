# ╚═══════════════════════════════════════════════════════════════════════════╝


# ── Server ────────────────────────────────────────────────────────────────

server:
  grpc_listen: ":1530"
  api_listen: ":8443"
  # hostname: danlap  # server's envoy hostname — used for server compliance display
  tls:
    cert_file: "tls/cert"
    key_file: "tls/key"
    ca_file: "tls/ca"
    ca_key_file: "tls/ca_key"


# ── Database ──────────────────────────────────────────────────────────────
# To use Postgres: set driver: postgres, and in .env set
#   VIGO_SERVICES=postgres

database:
  dsn: "secret:vigo/db/dsn"
  # driver: postgres
  # retention: "90d"


# ── Secrets ───────────────────────────────────────────────────────────────

secrets:
  backend: local


# ── Check-in ──────────────────────────────────────────────────────────────

checkin:
  interval: "5m"
  jitter_percent: 20


# ── Bootstrap ─────────────────────────────────────────────────────────────
# Tighten trusted_enrollment patterns and CIDRs for production.

bootstrap:
  cert_validity: "8760h"
  trusted_enrollment:
    # The CIDR check runs against the real TCP source address, so an envoy that
    # enrolls over IPv6 is matched on its v6 address and the v4 ranges below
    # never see it — it is refused with no obvious reason. These are the v6
    # analogues of the private v4 ranges: fc00::/7 is the ULA space (RFC 4193),
    # fe80::/10 link-local, ::1/128 loopback.
    # A globally-routable v6 prefix is site-specific; add yours here if envoys
    # enroll over one, or give those envoys a token instead.
    - pattern: "*"
      cidrs:
        - "192.168.0.0/16"
        - "127.0.0.0/8"
        - "172.16.0.0/12"
        - "10.0.0.0/8"
        - "fc00::/7"
        - "fe80::/10"
        - "::1/128"


# ── Webhooks ──────────────────────────────────────────────────────────────

webhooks:
  timeout: "10s"
  max_retries: 3


# ── Secret Rotation Watcher ──────────────────────────────────────────────

watcher:
  enabled: true
  poll_interval: "5m"


# ── Authentication ────────────────────────────────────────────────────────
# auth:
#   method: none                               # none | oidc | isowebauth

# ── SMTP Notifications ───────────────────────────────────────────────────
# Requires an SMTP relay. Store password with:
#   vigocli secrets set vigo/smtp/password "your-password"
#
# smtp:
#   host: "smtp.example.com"
#   port: 587
#   from: "vigo@example.com"
#   username: "vigo"
#   password: "secret:vigo/smtp/password"
#   tls: true
#   recipients:
#     - "admin@example.com"

# ── Spanner ────────────────────────────────────────────────────────────
# See server.yaml.example for peer-equal setup.
#
# spanner:
#   mode: standalone                           # standalone | spanner

# ── AI Assistant ──────────────────────────────────────────────────────────
# Also set VIGO_SERVICES=ollama in .env to start the Ollama container.
# For Claude or OpenAI, store the API key with:
#   vigocli secrets set vigo/ai/api_key "sk-..."
#
# ai:
#   enabled: true
#   provider: "ollama"                         # ollama | claude | openai | openai-compat
#   model: "qwen2.5:7b"
#   max_tokens: 4096
#   base_url: "http://vigo-ollama:11434"     # Docker: use container name. Bare-metal: http://localhost:11434
#   # api_key: "secret:vigo/ai/api_key"     # for paid providers

# ── Backup (Litestream — SQLite only) ────────────────────────────────────
# Requires S3-compatible storage. Store credentials with:
#   vigocli secrets set vigo/backup/aws_access_key "AKIA..."
#   vigocli secrets set vigo/backup/aws_secret_key "..."
#
# backup:
#   url: "s3://my-bucket/vigo"
#   access_key_id: "secret:vigo/backup/aws_access_key"
#   secret_access_key: "secret:vigo/backup/aws_secret_key"

# ── Compliance Export ─────────────────────────────────────────────────────
# export:
#   siem: false
#   cmdb: false
#   oscal: false

# ── Rate Limiting ─────────────────────────────────────────────────────────
# rate_limit:
#   enabled: false
#   checkin_per_envoy: 6
#   checkin_global: 500

# ── Maintenance ───────────────────────────────────────────────────────────
# maintenance:
#   freeze_until: ""                           # RFC3339 timestamp

# ── Stream Edit ──────────────────────────────────────────────────────────
# Guardrails for stream_edit pipelines in file resources.
# Scripts must reside under allowed_paths, be root-owned, and not world-writable.
#
# stream_edit:
#   enabled: true                          # false = strip all stream_edit globally
#   allowed_paths:                         # directories where scripts must reside
#     - "/srv/vigo/scripts"
#   default_timeout: "10s"                 # per-script timeout

# ── Tuning ────────────────────────────────────────────────────────────────
# tuning:
#   signature_window: "5m"
#   metrics_interval: "30s"
#
# See server.yaml.example for all tuning options.
