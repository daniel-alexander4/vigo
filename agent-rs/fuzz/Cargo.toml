[package]
name = "vigo-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[[bin]]
name = "when_parse"
path = "fuzz_targets/when_parse.rs"
doc = false

[[bin]]
name = "when_eval"
path = "fuzz_targets/when_eval.rs"
doc = false

[dependencies]
libfuzzer-sys = "0.4"
vigo = { path = ".." }
serde_json = "1"
