services:
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./site/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    env_file:
      - site.env
    restart: unless-stopped
    depends_on:
      - site

  site:
    build:
      context: .
      dockerfile: site/Dockerfile
    expose:
      - "8080"
    volumes:
      - site-data:/data
    env_file:
      - site.env
    restart: unless-stopped

volumes:
  caddy-data:
  caddy-config:
  site-data:
