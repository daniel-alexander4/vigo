[package]
name = "connwaer"
version = "0.1.2"
edition = "2021"
description = "Connwaer — active compliance verification agent"
license = "LicenseRef-Proprietary"
publish = false

[dependencies]
# Async runtime
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time", "process", "fs", "net", "sync"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

# Crypto (license verification, checksums)
ed25519-dalek = { version = "2", features = ["pkcs8", "pem"] }
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
rand = "0.8"

# SQLite (trend history)
rusqlite = { version = "0.32", features = ["bundled"] }

# HTTP (webhooks)
ureq = { version = "3", features = ["rustls", "json"] }

# SNMP
snmp = "0.2"

# PKCS#11 (HSM)
cryptoki = "0.7"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "ansi", "smallvec", "std", "env-filter"] }

# Error handling
anyhow = "1"
thiserror = "2"

# Misc
uuid = { version = "1", features = ["v4"] }
hostname = "0.4"
regex-lite = "0.1"
tempfile = "3"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", features = ["user", "fs", "signal", "process"] }
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-service = "0.7"
winreg = "0.55"

[dev-dependencies]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
overflow-checks = true
