version: v2
modules:
  - path: protobuf
    name: buf.build/vigo/vigo
deps:
  - buf.build/googleapis/googleapis
  - buf.build/grpc-ecosystem/grpc-gateway
lint:
  use:
    - STANDARD
  except:
    - PACKAGE_DIRECTORY_MATCH
    - SERVICE_SUFFIX
    # This API names request/response messages descriptively
    # (AgentStreamMessage, BoltStatusReport, PeerSyncMessage, …) instead
    # of the mechanical {Rpc}Request/{Rpc}Response convention, and its
    # bidi streams (AgentStream, TunnelStream, SyncStream) reuse one
    # envelope type for both directions. These three rules don't fit
    # that shape.
    - RPC_REQUEST_STANDARD_NAME
    - RPC_RESPONSE_STANDARD_NAME
    - RPC_REQUEST_RESPONSE_UNIQUE
breaking:
  use:
    - FILE
