# golangci-lint configuration.
#
# errcheck (in v2's standard set) is the check for fully-unchecked calls — a
# bare `os.Remove(p)` statement — across every package. The complementary
# TestNoBlankDiscardedErrors audit test (test/audit/audit_test.go) scans
# server/ and cli/ non-test code for unannotated `_ =` discards of dangerous
# functions, which errcheck does not flag (check-blank is off).
#
# Exclusions mirror that discipline: the std-error-handling preset drops
# the universally-best-effort calls (Close, Flush, Fprint*/print*,
# os.Remove*), exclude-functions adds a few more in the same class, and
# test files are exempt — as TestNoBlankDiscardedErrors itself skips _test.go.
# Genuinely consequential unchecked calls are fixed in code, not here.
version: "2"

linters:
  settings:
    errcheck:
      exclude-functions:
        - io.WriteString
        - io.Copy
        - fmt.Sscanf
        - (*encoding/json.Encoder).Encode
        - (*github.com/spf13/cobra.Command).MarkFlagRequired
  exclusions:
    presets:
      - std-error-handling
    rules:
      # Test files are exempt from errcheck — consistent with
      # TestNoBlankDiscardedErrors, which skips _test.go by design.
      - path: _test\.go
        linters:
          - errcheck
      # Writes to an http.ResponseWriter are best-effort: a failed body
      # write means the client is already gone and the handler — past
      # the point of setting a status — cannot recover.
      - linters:
          - errcheck
        text: 'Error return value of `w\.Write` is not checked'
      # staticcheck QF* are opt-in "quickfix" style suggestions, not
      # correctness findings — staticcheck does not run them by default.
      - linters: [staticcheck]
        text: 'QF[0-9]{4}'
