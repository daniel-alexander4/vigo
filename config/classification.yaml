# Classification rules — auto-assign modules to clients by hostname pattern.
# First matching rule wins. Explicit client YAML (config/clients/*.yaml)
# always takes precedence over classification.
#
# Clients that match no rule and have no explicit config get an empty
# module list and run cleanly with no changes.

rules:
  # Web servers: nginx + hardened SSH
  - match: "web-*"
    environment: production
    modules:
      - name: webserver
        resources:
          - name: install-nginx
            type: package
            package: nginx
            state: present
          - name: nginx-conf
            type: file
            path: /etc/nginx/nginx.conf
            content: |
              user www-data;
              worker_processes auto;
              pid /run/nginx.pid;
              events { worker_connections 1024; }
              http {
                  sendfile on;
                  keepalive_timeout 65;
                  include /etc/nginx/mime.types;
                  include /etc/nginx/conf.d/*.conf;
              }
            owner: root
            group: root
            mode: "0644"
            depends_on: [install-nginx]
            notify: [nginx-running]
          - name: nginx-running
            type: service
            service: nginx
            enabled: true
            state: running
            depends_on: [nginx-conf]
            subscribes: [nginx-conf]

  # Database servers: PostgreSQL
  - match: "db-*"
    environment: production
    modules:
      - name: database
        resources:
          - name: install-postgres
            type: package
            package: postgresql-16
            state: present
          - name: pg-hba
            type: file
            path: /etc/postgresql/16/main/pg_hba.conf
            content: |
              local all postgres              peer
              local all all                   peer
              host  all all   127.0.0.1/32    scram-sha-256
              host  all all   10.0.0.0/8      scram-sha-256
            owner: postgres
            group: postgres
            mode: "0640"
            depends_on: [install-postgres]
            notify: [postgres-running]
          - name: postgres-running
            type: service
            service: postgresql
            enabled: true
            state: running
            depends_on: [pg-hba]
            subscribes: [pg-hba]

  # MySQL database servers
  - match: "mysql-*"
    environment: production
    modules:
      - name: mysql
        resources:
          - name: install-mysql
            type: package
            package: mysql-server
            state: present
          - name: mysql-running
            type: service
            service: mysql
            enabled: true
            state: running
            depends_on: [install-mysql]

  # Cache servers: Redis
  - match: "cache-*"
    environment: production
    modules:
      - name: redis
        resources:
          - name: install-redis
            type: package
            package: redis-server
            state: present
          - name: redis-conf
            type: file
            path: /etc/redis/redis.conf
            content: |
              bind 127.0.0.1
              port 6379
              daemonize no
              supervised systemd
              maxmemory 256mb
              maxmemory-policy allkeys-lru
              appendonly yes
              appendfsync everysec
            owner: redis
            group: redis
            mode: "0640"
            depends_on: [install-redis]
            notify: [redis-running]
          - name: redis-running
            type: service
            service: redis-server
            enabled: true
            state: running
            depends_on: [redis-conf]
            subscribes: [redis-conf]

  # Load balancers: HAProxy
  - match: "lb-*"
    environment: production
    modules:
      - name: haproxy
        resources:
          - name: install-haproxy
            type: package
            package: haproxy
            state: present
          - name: haproxy-running
            type: service
            service: haproxy
            enabled: true
            state: running
            depends_on: [install-haproxy]

  # Docker hosts
  - match: "docker-*"
    environment: production
    modules:
      - name: docker
        resources:
          - name: install-docker
            type: package
            package: docker-ce
            state: present
          - name: install-containerd
            type: package
            package: containerd.io
            state: present
          - name: docker-daemon-json
            type: file
            path: /etc/docker/daemon.json
            content: |
              {
                "storage-driver": "overlay2",
                "log-driver": "json-file",
                "log-opts": { "max-size": "100m", "max-file": "3" },
                "live-restore": true
              }
            owner: root
            group: root
            mode: "0644"
            depends_on: [install-docker]
            notify: [docker-running]
          - name: docker-running
            type: service
            service: docker
            enabled: true
            state: running
            depends_on: [docker-daemon-json]
            subscribes: [docker-daemon-json]

  # Monitoring servers: Prometheus + Grafana + node-exporter
  - match: "mon-*"
    environment: production
    modules:
      - name: prometheus
        resources:
          - name: prometheus-user
            type: user
            name: prometheus
            shell: /usr/sbin/nologin
          - name: install-prometheus
            type: package
            package: prometheus
            state: present
          - name: prometheus-running
            type: service
            service: prometheus
            enabled: true
            state: running
            depends_on: [install-prometheus]
      - name: node-exporter
        resources:
          - name: install-node-exporter
            type: package
            package: prometheus-node-exporter
            state: present
          - name: node-exporter-running
            type: service
            service: prometheus-node-exporter
            enabled: true
            state: running
            depends_on: [install-node-exporter]
      - name: grafana
        resources:
          - name: install-grafana
            type: package
            package: grafana
            state: present
          - name: grafana-running
            type: service
            service: grafana-server
            enabled: true
            state: running
            depends_on: [install-grafana]

  # Bastion / jump hosts: hardened SSH + fail2ban
  - match: "bastion-*"
    environment: production
    modules:
      - name: openssh
        resources:
          - name: install-openssh
            type: package
            package: openssh-server
            state: present
          - name: sshd-config
            type: file
            path: /etc/ssh/sshd_config
            content: |
              Port 22
              Protocol 2
              PermitRootLogin no
              PubkeyAuthentication yes
              PasswordAuthentication no
              MaxAuthTries 3
              X11Forwarding no
              AllowTcpForwarding no
              ClientAliveInterval 300
              ClientAliveCountMax 2
            owner: root
            group: root
            mode: "0600"
            depends_on: [install-openssh]
            notify: [sshd-running]
          - name: sshd-running
            type: service
            service: sshd
            enabled: true
            state: running
            depends_on: [sshd-config]
            subscribes: [sshd-config]
      - name: fail2ban
        resources:
          - name: install-fail2ban
            type: package
            package: fail2ban
            state: present
          - name: fail2ban-jail
            type: file
            path: /etc/fail2ban/jail.local
            content: |
              [sshd]
              enabled = true
              port = 22
              maxretry = 3
              bantime = 7200
            owner: root
            group: root
            mode: "0644"
            depends_on: [install-fail2ban]
            notify: [fail2ban-running]
          - name: fail2ban-running
            type: service
            service: fail2ban
            enabled: true
            state: running
            depends_on: [fail2ban-jail]
            subscribes: [fail2ban-jail]

  # Staging: anything under *.staging.example.com
  - match: "*.staging.example.com"
    environment: staging
    modules: []
