client: mon01.example.com
environment: production

vars:
  prometheus_retention: "30d"
  prometheus_scrape_interval: "15s"
  grafana_port: "3000"
  alertmanager_port: "9093"

modules:
  - name: prometheus
    resources:
      - name: prometheus-user
        type: user
        name: prometheus
        shell: /usr/sbin/nologin

      - name: install-prometheus
        type: package
        package: prometheus
        state: present

      - name: prometheus-conf
        type: file
        path: /etc/prometheus/prometheus.yml
        content: |
          global:
            scrape_interval: {{ .Vars.prometheus_scrape_interval }}
            evaluation_interval: 15s

          alerting:
            alertmanagers:
              - static_configs:
                  - targets:
                      - localhost:{{ .Vars.alertmanager_port }}

          rule_files:
            - /etc/prometheus/rules/*.yml

          scrape_configs:
            - job_name: prometheus
              static_configs:
                - targets: ['localhost:9090']

            - job_name: node
              static_configs:
                - targets: ['localhost:9100']
        owner: prometheus
        group: prometheus
        mode: "0644"
        depends_on: [install-prometheus, prometheus-user]
        notify: [prometheus-service]

      - name: prometheus-service
        type: service
        service: prometheus
        enabled: true
        state: running
        depends_on: [prometheus-conf]
        subscribes: [prometheus-conf]

  - name: node-exporter
    resources:
      - name: install-node-exporter
        type: package
        package: prometheus-node-exporter
        state: present

      - name: node-exporter-service
        type: service
        service: prometheus-node-exporter
        enabled: true
        state: running
        depends_on: [install-node-exporter]

  - name: grafana
    resources:
      - name: grafana-repo
        type: repository
        name: grafana
        key_url: https://apt.grafana.com/gpg.key
        repo: "deb [signed-by=/etc/apt/keyrings/grafana.gpg] https://apt.grafana.com stable main"
        state: present

      - name: install-grafana
        type: package
        package: grafana
        state: present
        depends_on: [grafana-repo]

      - name: grafana-ini
        type: file
        path: /etc/grafana/grafana.ini
        content: |
          [server]
          http_port = {{ .Vars.grafana_port }}

          [security]
          admin_password = secret:isogov/grafana/admin-password

          [auth.anonymous]
          enabled = false

          [log]
          mode = file
          level = info
        owner: root
        group: grafana
        mode: "0640"
        depends_on: [install-grafana]
        notify: [grafana-service]

      - name: grafana-service
        type: service
        service: grafana-server
        enabled: true
        state: running
        depends_on: [grafana-ini]
        subscribes: [grafana-ini]
