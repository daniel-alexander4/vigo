client: cache01.example.com
environment: production

vars:
  redis_bind: "127.0.0.1"
  redis_port: "6379"
  redis_maxmemory: "256mb"
  redis_maxmemory_policy: "allkeys-lru"
  redis_password: "secret:isogov/redis/password"

env_vars:
  production:
    redis_maxmemory: "4gb"
    redis_bind: "0.0.0.0"
  staging:
    redis_maxmemory: "256mb"
    redis_bind: "127.0.0.1"

modules:
  - name: redis
    resources:
      - name: install-redis
        type: package
        package: redis-server
        state: present

      - name: redis-conf
        type: file
        path: /etc/redis/redis.conf
        content: |
          bind {{ .Vars.redis_bind }}
          port {{ .Vars.redis_port }}
          daemonize no
          supervised systemd
          requirepass {{ .Vars.redis_password }}
          maxmemory {{ .Vars.redis_maxmemory }}
          maxmemory-policy {{ .Vars.redis_maxmemory_policy }}
          appendonly yes
          appendfsync everysec
          save 900 1
          save 300 10
          save 60 10000
          loglevel notice
          logfile /var/log/redis/redis-server.log
        owner: redis
        group: redis
        mode: "0640"
        depends_on: [install-redis]
        notify: [redis-service]

      - name: redis-service
        type: service
        service: redis-server
        enabled: true
        state: running
        depends_on: [redis-conf]
        subscribes: [redis-conf]
