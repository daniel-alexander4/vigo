client: web01.example.com
environment: production

vars:
  app_port: "8080"
  log_level: "info"

env_vars:
  production:
    app_port: "443"
    max_workers: "8"
  staging:
    app_port: "8443"
    max_workers: "2"

modules:
  - name: nginx-config
    resources:
      - name: install-nginx
        type: package
        package: nginx
        state: present

      - name: write-config
        type: file
        path: /etc/nginx/nginx.conf
        content: |
          worker_processes {{ .Vars.max_workers }};
          listen {{ .Vars.app_port }};
        owner: root
        group: root
        mode: "0644"
        depends_on: [install-nginx]
        notify: [start-nginx]

      - name: start-nginx
        type: service
        service: nginx
        enabled: true
        state: running
        depends_on: [write-config]
        subscribes: [write-config]
