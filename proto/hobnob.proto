syntax = "proto3";

package hobnob.v1;

option go_package = "github.com/hobnob/hobnob/gen/proto/hobnob";

import "google/protobuf/timestamp.proto";
import "google/api/annotations.proto";

// =============================================================================
// Agent-facing service (gRPC-only, port 1530)
// =============================================================================

service HobnobAgent {
  // Register enrolls a new agent with the server using hostname, IP, pubkey, and one-time token.
  rpc Register(RegisterRequest) returns (RegisterResponse);

  // CheckIn is the agent pull loop — returns modules to apply based on current state.
  rpc CheckIn(CheckInRequest) returns (CheckInResponse);

  // ReportResult submits per-module execution results after a run.
  rpc ReportResult(ReportResultRequest) returns (ReportResultResponse);

  // ReportTraits submits collected traits from the agent.
  rpc ReportTraits(ReportTraitsRequest) returns (ReportTraitsResponse);

  // DownloadCustomTrait retrieves a custom trait executable by name.
  rpc DownloadCustomTrait(DownloadCustomTraitRequest) returns (DownloadCustomTraitResponse);

  // AgentStream opens a persistent bidirectional stream between agent and server.
  // Replaces poll-based CheckIn with push-based policy delivery.
  // Agent sends: check-in requests, run results, trait updates.
  // Server sends: policy bundles (initial + on config change), force-push signals.
  rpc AgentStream(stream AgentStreamMessage) returns (stream ServerStreamMessage);
}

// =============================================================================
// Admin-facing service (gRPC + grpc-gateway REST, port 8181)
// =============================================================================

service HobnobAdmin {
  // AddApprovedPattern adds a hostname/IP wildcard pattern with a one-time token.
  rpc AddApprovedPattern(AddApprovedPatternRequest) returns (AddApprovedPatternResponse) {
    option (google.api.http) = {
      post: "/api/v1/approved"
      body: "*"
    };
  }

  // ListApprovedPatterns lists all approved enrollment patterns.
  rpc ListApprovedPatterns(ListApprovedPatternsRequest) returns (ListApprovedPatternsResponse) {
    option (google.api.http) = {
      get: "/api/v1/approved"
    };
  }

  // RevokeApprovedPattern removes an approved pattern.
  rpc RevokeApprovedPattern(RevokeApprovedPatternRequest) returns (RevokeApprovedPatternResponse) {
    option (google.api.http) = {
      delete: "/api/v1/approved/{id}"
    };
  }

  // ListThralls lists all enrolled thralls.
  rpc ListThralls(ListThrallsRequest) returns (ListThrallsResponse) {
    option (google.api.http) = {
      get: "/api/v1/thralls"
    };
  }

  // GetThrall returns details for a single thrall.
  rpc GetThrall(GetThrallRequest) returns (GetThrallResponse) {
    option (google.api.http) = {
      get: "/api/v1/thralls/{id}"
    };
  }

  // RevokeThrall revokes an enrolled thrall, blocking future check-ins.
  rpc RevokeThrall(RevokeThrallRequest) returns (RevokeThrallResponse) {
    option (google.api.http) = {
      post: "/api/v1/thralls/{id}/revoke"
      body: "*"
    };
  }

  // DeleteThrall permanently removes a thrall and all its history from the database.
  rpc DeleteThrall(DeleteThrallRequest) returns (DeleteThrallResponse) {
    option (google.api.http) = {
      delete: "/api/v1/thralls/{id}"
    };
  }

  // ForcePush triggers an immediate check-in for a thrall or all thralls.
  rpc ForcePush(ForcePushRequest) returns (ForcePushResponse) {
    option (google.api.http) = {
      post: "/api/v1/push"
      body: "*"
    };
  }

  // DryRun computes a plan without applying changes.
  rpc DryRun(DryRunRequest) returns (DryRunResponse) {
    option (google.api.http) = {
      post: "/api/v1/thralls/{thrall_id}/dry-run"
      body: "*"
    };
  }

  // ListRuns lists recent runs, optionally filtered by thrall.
  rpc ListRuns(ListRunsRequest) returns (ListRunsResponse) {
    option (google.api.http) = {
      get: "/api/v1/runs"
    };
  }

  // GetRun returns details for a single run including per-module results.
  rpc GetRun(GetRunRequest) returns (GetRunResponse) {
    option (google.api.http) = {
      get: "/api/v1/runs/{id}"
    };
  }

  // GenerateToken generates a cryptographically random one-time enrollment token.
  rpc GenerateToken(GenerateTokenRequest) returns (GenerateTokenResponse) {
    option (google.api.http) = {
      post: "/api/v1/tokens"
      body: "*"
    };
  }

  // AddWebhook registers a new webhook endpoint.
  rpc AddWebhook(AddWebhookRequest) returns (AddWebhookResponse) {
    option (google.api.http) = {
      post: "/api/v1/webhooks"
      body: "*"
    };
  }

  // ListWebhooks lists all registered webhooks.
  rpc ListWebhooks(ListWebhooksRequest) returns (ListWebhooksResponse) {
    option (google.api.http) = {
      get: "/api/v1/webhooks"
    };
  }

  // DeleteWebhook removes a webhook by ID.
  rpc DeleteWebhook(DeleteWebhookRequest) returns (DeleteWebhookResponse) {
    option (google.api.http) = {
      delete: "/api/v1/webhooks/{id}"
    };
  }

  // GetComplianceSummary returns aggregate compliance status across all thralls.
  rpc GetComplianceSummary(GetComplianceSummaryRequest) returns (GetComplianceSummaryResponse) {
    option (google.api.http) = {
      get: "/api/v1/compliance"
    };
  }

  // GetThrallCompliance returns compliance details for a single thrall.
  rpc GetThrallCompliance(GetThrallComplianceRequest) returns (GetThrallComplianceResponse) {
    option (google.api.http) = {
      get: "/api/v1/thralls/{id}/compliance"
    };
  }

  // Rollback reverts a thrall to a previous run's state.
  rpc Rollback(RollbackRequest) returns (RollbackResponse) {
    option (google.api.http) = {
      post: "/api/v1/thralls/{thrall_id}/rollback"
      body: "*"
    };
  }

  // ListPackages lists package audit records, optionally filtered by thrall.
  rpc ListPackages(ListPackagesRequest) returns (ListPackagesResponse) {
    option (google.api.http) = {
      get: "/api/v1/packages"
    };
  }

  // ListPackageDrift lists packages where installed version differs from desired.
  rpc ListPackageDrift(ListPackageDriftRequest) returns (ListPackageDriftResponse) {
    option (google.api.http) = {
      get: "/api/v1/packages/drift"
    };
  }

  // PromoteEnv promotes environment variables from one tier to another.
  rpc PromoteEnv(PromoteEnvRequest) returns (PromoteEnvResponse) {
    option (google.api.http) = {
      post: "/api/v1/env/promote"
      body: "*"
    };
  }

  // EnrollThrall creates a thrall record directly (hub→spoke internal RPC).
  // Used during enrollment routing: the hub validates the token, then calls
  // this on the target spoke to create the thrall without token re-validation.
  rpc EnrollThrall(EnrollThrallRequest) returns (EnrollThrallResponse);

  // SetReassignment marks a thrall for reassignment to a different spoke.
  // Called hub→spoke to set reassign_addr/reassign_id on the thrall.
  rpc SetReassignment(SetReassignmentRequest) returns (SetReassignmentResponse);
}

// =============================================================================
// Agent service messages
// =============================================================================

message RegisterRequest {
  string hostname = 1;
  string ip_address = 2;
  string pubkey_pem = 3;
  string token = 4;
}

message RegisterResponse {
  bool success = 1;
  string thrall_id = 2;       // UUID assigned by the server
  string message = 3;
  string spoke_addr = 4;    // if set, agent should connect to this spoke for check-ins
  string server_pubkey_pem = 5; // server's ED25519 public key for bundle signature verification
}

message CheckInRequest {
  string thrall_id = 1;
  string state_fingerprint = 2;
  bytes signature = 3;
  google.protobuf.Timestamp timestamp = 4;
  bytes traits_json = 5;           // inline traits (avoids separate ReportTraits RPC)
  uint64 policy_version = 6;     // agent's cached policy version (0 = no cache, send full bundle)
  bool policy_mode = 7;          // true = agent supports policy bundles
  map<string, string> cached_module_hashes = 8;  // module name → content hash for delta transfer
  StreamCapabilities capabilities = 9;  // agent protocol capabilities (delta streaming)
}

message CheckInResponse {
  repeated Module modules = 1;
  string interval = 2;   // e.g. "5m"
  int32 jitter_percent = 3;
  repeated CustomTraitEntry custom_traits = 4;
  bool no_change = 5;                    // true = fingerprint matched, skip execution
  string response_fingerprint = 6;       // hash of this response for next check-in
  PolicyBundle policy_bundle = 7;        // raw policy for agent-side evaluation
  uint64 policy_version = 8;            // current config version, always set
  string reassign_addr = 9;             // non-empty = agent should reconnect here
  string reassign_id = 10;              // new UUID on target spoke
  bool stream_requested = 11;           // server wants agent to open AgentStream
  repeated string warnings = 12;        // config errors, missing modules, etc.
  repeated ProxiedDevice proxied_devices = 13;  // network devices this gateway manages
}

// ProxiedDevice describes a network device managed through a gateway thrall.
// The gateway agent receives these alongside its own policy and converges
// each device over SSH during its convergence cycle.
message ProxiedDevice {
  string thrall_id   = 1;   // server-assigned UUID for this virtual thrall
  string hostname    = 2;   // device hostname (from nodes.hnb match pattern)
  string device_type = 3;   // cisco_ios, cisco_nxos, juniper_junos
  string credential  = 4;   // resolved secret value (SSH key or password)
  string username    = 5;   // SSH username
  uint32 port        = 6;   // SSH port (default 22)
  string ip_address  = 7;   // management IP
  PolicyBundle policy = 8;  // the device's resolved config
}

// CustomTraitEntry describes a custom trait executable in the server's traits directory.
message CustomTraitEntry {
  string name = 1;            // trait name derived from filename (without extension)
  string sha256 = 2;          // hex-encoded SHA256 checksum of the executable
}

// DownloadCustomTraitRequest asks the server for a custom trait executable's bytes.
message DownloadCustomTraitRequest {
  string name = 1;            // trait name (matches CustomTraitEntry.name)
}

// DownloadCustomTraitResponse returns the raw executable bytes.
message DownloadCustomTraitResponse {
  bytes data = 1;
}

message Module {
  string name = 1;
  string resource_type = 2;   // file, package, service, user
  repeated Resource resources = 3;
  repeated string depends_on = 4;
  repeated string notify = 5;
  repeated string subscribes = 6;
}

message Resource {
  string name = 1;
  string type = 2;            // file, package, service, user
  map<string, string> params = 3;
  string when = 4;            // when expression for agent-side eval (builtins)
}

// PolicyBundle contains the raw policy for agent-side evaluation. Secrets are
// already resolved, vars are merged, but templates are NOT rendered and
// conditionals are NOT evaluated — the agent does that locally with its traits.
message PolicyBundle {
  uint64 policy_version = 1;
  repeated PolicyModule modules = 2;
  bytes vars_json = 3;                 // JSON-encoded merged vars map[string]any
  repeated string var_order = 4;       // deterministic rendering order
  repeated ConditionalVarDef conditional_vars = 5;
  repeated CustomTraitEntry custom_traits = 6;

  // Trace fields for dry-run resolution visibility.
  string matched_pattern = 7;          // thrall entry match pattern from thralls.hnb
  string environment = 8;             // resolved environment
  repeated string roles = 9;          // role names that were expanded

  // Bundle signing (compiled promises).
  bytes signature = 10;               // ED25519 signature over fields 1-9
  string server_pubkey_id = 11;       // fingerprint of signing key (for key rotation)
  uint32 max_age_seconds = 12;        // how long this bundle remains valid (0 = forever)
}

// PolicyModule is a module definition with raw templates and conditionals.
// For delta transfer: if stub=true, only name + content_hash are set —
// the agent fills in resources from its local cache.
message PolicyModule {
  string name = 1;
  repeated PolicyResource resources = 2;
  repeated string depends_on = 3;
  string when = 4;                     // module-level when expression (unevaluated)
  string content_hash = 5;            // SHA256 of canonical module content
  bool stub = 6;                      // true = content omitted, use cached version
}

// PolicyResource is a resource with raw template strings in attributes.
message PolicyResource {
  string name = 1;
  string type = 2;
  map<string, string> attributes = 3;  // raw template strings (secrets resolved)
  string when = 4;                     // when expression (unevaluated)
  repeated string notify = 5;
  repeated string subscribes = 6;
  repeated string watch_secret = 7; // secret paths that trigger this resource on rotation
}

// ConditionalVarDef defines a trait-based conditional variable.
message ConditionalVarDef {
  string name = 1;
  string trait = 2;                    // dot-path: "os.distro"
  string operator = 3;                 // in, not_in, gt, lt, gte, lte, regex
  string operand_json = 4;            // JSON-encoded operand
}

message ReportResultRequest {
  string run_id = 1;
  string thrall_id = 2;
  repeated ModuleResult results = 3;
  bytes signature = 4;
  google.protobuf.Timestamp timestamp = 5;
}

message ModuleResult {
  string module_name = 1;
  string resource_type = 2;
  string resource_name = 3;
  string action_taken = 4;     // none, created, updated, deleted
  bool changed = 5;
  string error_message = 6;
  int32 duration_ms = 7;
  bytes previous_content = 8;  // file executor: content before overwrite (for snapshots)
  string content_hash = 9;     // file executor: SHA-256 of the new content
  string file_path = 10;       // file executor: absolute path of the managed file
}

message ReportResultResponse {
  bool acknowledged = 1;
}

message ReportTraitsRequest {
  string thrall_id = 1;
  bytes traits_json = 2;       // JSON-encoded traits map
  bytes signature = 3;
  google.protobuf.Timestamp timestamp = 4;
}

message ReportTraitsResponse {
  bool acknowledged = 1;
}

// =============================================================================
// Persistent stream messages (Step 4: eliminates TLS handshake overhead)
// =============================================================================

// AgentStreamMessage is sent by the agent on a persistent bidirectional stream.
message AgentStreamMessage {
  oneof msg {
    CheckInRequest check_in = 1;
    ReportResultRequest report_result = 2;
    ReportTraitsRequest report_traits = 3;
    TaskResult task_result = 4;
    TaskAck task_ack = 5;
    QueryResponse query_response = 6;
    DeltaEvent delta = 7;
  }
}

// ServerStreamMessage is sent by the server on a persistent bidirectional stream.
message ServerStreamMessage {
  oneof msg {
    CheckInResponse check_in_response = 1;
    ReportResultResponse report_result_ack = 2;
    ReportTraitsResponse report_traits_ack = 3;
    StreamPolicyPush policy_push = 4;
    StreamForcePush force_push = 5;
    TaskDispatch task_dispatch = 6;
    QueryRequest query_request = 7;
    DeltaAck delta_ack = 8;
    StreamRelease stream_release = 9;
  }
}

// StreamRelease tells the agent it may close the promoted stream.
message StreamRelease {
  string reason = 1;  // optional human-readable reason
}

// StreamPolicyPush is sent server→agent when config changes while the stream
// is open. The agent should evaluate the new bundle immediately.
message StreamPolicyPush {
  PolicyBundle policy_bundle = 1;
  uint64 policy_version = 2;
}

// StreamForcePush signals the agent to run a convergence cycle immediately.
message StreamForcePush {}

// =============================================================================
// Delta streaming protocol (Phase 22)
// =============================================================================

// DeltaEvent is sent by the agent on the bidi stream to report state changes
// as lightweight deltas instead of full ReportResult messages.
message DeltaEvent {
  int64 sequence = 1;
  oneof event {
    RunCompleted run = 2;
    TraitsDelta traits = 3;     // reserved for future use
    HeartbeatDelta heartbeat = 4;
  }
}

// RunCompleted reports the outcome of a convergence run with only changed/failed
// resources (no-ops omitted). Replaces ReportResult on the delta path.
message RunCompleted {
  string run_id = 1;
  string status = 2;           // success, failure
  int32 total_count = 3;
  int32 changed_count = 4;
  int32 failed_count = 5;
  int32 skipped_count = 6;
  repeated ModuleResult results = 7;  // only changed/failed (no-ops omitted)
  uint64 bundle_version = 8;         // policy bundle version used for this run
}

// TraitsDelta reports changed/removed traits (reserved for future use).
message TraitsDelta {
  map<string, string> changed = 1;
  repeated string removed = 2;
}

// HeartbeatDelta is a no-op keepalive sent when there's nothing to report.
message HeartbeatDelta {}

// DeltaAck acknowledges receipt of a DeltaEvent by sequence number.
message DeltaAck {
  int64 acked_sequence = 1;
}

// StreamCapabilities advertises agent protocol support during handshake.
message StreamCapabilities {
  bool supports_delta = 1;
  int64 last_acked_sequence = 2;
}

// =============================================================================
// Orchestration messages (task dispatch, query, results)
// =============================================================================

// TaskDispatch is sent server→agent to execute a command on the thrall.
message TaskDispatch {
  string task_id = 1;           // unique ID for this task execution
  string command = 2;           // shell command to execute
  int32 timeout_seconds = 3;   // max execution time (0 = use default 60s)
  map<string, string> env = 4; // additional environment variables
}

// TaskAck is sent agent→server to acknowledge receipt of a task dispatch.
message TaskAck {
  string task_id = 1;
  bool accepted = 2;           // false if agent cannot accept (e.g., shutting down)
  string reject_reason = 3;   // set when accepted=false
}

// TaskResult is sent agent→server with the outcome of a task execution.
message TaskResult {
  string task_id = 1;
  int32 exit_code = 2;
  bytes stdout = 3;
  bytes stderr = 4;
  string status = 5;           // completed, failed, timeout, killed
  int32 duration_ms = 6;
  string error_message = 7;   // set on internal errors (not command stderr)
}

// QueryRequest is sent server→agent to retrieve trait values.
message QueryRequest {
  string query_id = 1;         // unique ID for this query
  string trait_path = 2;       // dot-separated trait path (e.g., "os.distro")
}

// QueryResponse is sent agent→server with the trait value.
message QueryResponse {
  string query_id = 1;
  string trait_path = 2;
  string value = 3;            // JSON-encoded trait value
  bool found = 4;              // false if trait path does not exist
}

// =============================================================================
// Admin service messages
// =============================================================================

message AddApprovedPatternRequest {
  string pattern = 1;
  string token = 2;           // plaintext token; server will bcrypt hash it
}

message AddApprovedPatternResponse {
  string id = 1;
  string pattern = 2;
  google.protobuf.Timestamp created_at = 3;
}

message ListApprovedPatternsRequest {}

message ListApprovedPatternsResponse {
  repeated ApprovedPattern patterns = 1;
}

message ApprovedPattern {
  string id = 1;
  string pattern = 2;
  google.protobuf.Timestamp created_at = 3;
  bool used = 4;
  string used_by = 5;          // thrall UUID if used
}

message RevokeApprovedPatternRequest {
  string id = 1;
}

message RevokeApprovedPatternResponse {}

message ListThrallsRequest {}

message ListThrallsResponse {
  repeated Thrall thralls = 1;
}

message Thrall {
  string id = 1;
  string hostname = 2;
  string ip_address = 3;
  google.protobuf.Timestamp enrolled_at = 4;
  google.protobuf.Timestamp last_seen = 5;
  bool revoked = 6;
  google.protobuf.Timestamp revoked_at = 7;
  repeated string pending_rotated_secrets = 8;
}

message GetThrallRequest {
  string id = 1;
}

message GetThrallResponse {
  Thrall thrall = 1;
}

message RevokeThrallRequest {
  string id = 1;
}

message RevokeThrallResponse {}

message DeleteThrallRequest {
  string id = 1;
}

message DeleteThrallResponse {}

message ForcePushRequest {
  string thrall_id = 1;         // empty = all thralls
}

message ForcePushResponse {
  int32 thralls_notified = 1;
}

message DryRunRequest {
  string thrall_id = 1;
}

message DryRunResponse {
  repeated PlannedAction actions = 1;
}

message PlannedAction {
  string module_name = 1;
  string resource_type = 2;
  string resource_name = 3;
  string planned_action = 4;   // create, update, delete, none
}

message ListRunsRequest {
  string thrall_id = 1;         // optional filter
  int32 limit = 2;            // default 20
}

message ListRunsResponse {
  repeated Run runs = 1;
}

message Run {
  string id = 1;
  string thrall_id = 2;
  google.protobuf.Timestamp started_at = 3;
  google.protobuf.Timestamp finished_at = 4;
  string status = 5;          // running, success, failure, partial
  int32 module_count = 6;
  int32 changed_count = 7;
  int32 failed_count = 8;
  int32 skipped_count = 9;
}

message GetRunRequest {
  string id = 1;
}

message GetRunResponse {
  Run run = 1;
  repeated ModuleResult results = 2;
}

message GenerateTokenRequest {}

message GenerateTokenResponse {
  string token = 1;
}

// =============================================================================
// Webhook messages
// =============================================================================

message AddWebhookRequest {
  string url = 1;
  string secret = 2;
  repeated string events = 3;
}

message AddWebhookResponse {
  WebhookInfo webhook = 1;
}

message ListWebhooksRequest {}

message ListWebhooksResponse {
  repeated WebhookInfo webhooks = 1;
}

message DeleteWebhookRequest {
  string id = 1;
}

message DeleteWebhookResponse {}

message WebhookInfo {
  string id = 1;
  string url = 2;
  repeated string events = 3;
  google.protobuf.Timestamp created_at = 4;
  bool active = 5;
}

// =============================================================================
// Compliance messages
// =============================================================================

message GetComplianceSummaryRequest {}

message GetComplianceSummaryResponse {
  int32 total = 1;
  int32 compliant = 2;
  int32 drifted = 3;
  int32 failing = 4;
  int32 stale = 5;
  int32 unknown = 6;
  float compliance_pct = 7;
}

message GetThrallComplianceRequest {
  string id = 1;
}

message GetThrallComplianceResponse {
  string status = 1;
  Run last_run = 2;
  repeated ComplianceSnapshot history = 3;
}

message ComplianceSnapshot {
  string date = 1;
  int32 total = 2;
  int32 compliant = 3;
  int32 drifted = 4;
  int32 failing = 5;
  int32 stale = 6;
  int32 unknown = 7;
}

// =============================================================================
// Rollback messages
// =============================================================================

message RollbackRequest {
  string thrall_id = 1;
  string run_id = 2;            // optional: rollback to specific run
  string file_path = 3;         // optional: rollback a single file
}

message RollbackResponse {
  bool success = 1;
  string message = 2;
}

// =============================================================================
// Package audit messages
// =============================================================================

message ListPackagesRequest {
  string thrall_id = 1;           // optional filter
}

message ListPackagesResponse {
  repeated PackageInfo packages = 1;
}

message ListPackageDriftRequest {}

message ListPackageDriftResponse {
  repeated PackageDrift drifts = 1;
}

message PackageInfo {
  string thrall_id = 1;
  string hostname = 2;
  string package_name = 3;
  string installed_version = 4;
  string desired_version = 5;
}

message PackageDrift {
  string thrall_id = 1;
  string hostname = 2;
  string package_name = 3;
  string installed_version = 4;
  string desired_version = 5;
  google.protobuf.Timestamp detected_at = 6;
}

// =============================================================================
// Env promote messages
// =============================================================================

message PromoteEnvRequest {
  string module_name = 1;
  string from_env = 2;
  string to_env = 3;
}

message PromoteEnvResponse {
  string promotion_id = 1;
  map<string, string> diff = 2;
}

// =============================================================================
// Enrollment routing messages (hub→spoke internal)
// =============================================================================

message EnrollThrallRequest {
  string hostname = 1;
  string ip_address = 2;
  string pubkey_pem = 3;
}

message EnrollThrallResponse {
  string thrall_id = 1;
}

// =============================================================================
// Reassignment messages (hub→spoke)
// =============================================================================

message SetReassignmentRequest {
  string thrall_id = 1;
  string target_addr = 2;
  string new_thrall_id = 3;
}

message SetReassignmentResponse {}

message ReassignThrallRequest {
  string thrall_id = 1;
  string from_spoke_id = 2;
  string to_spoke_id = 3;
}

message ReassignThrallResponse {
  string new_thrall_id = 1;
  string target_addr = 2;
}

message DrainSpokeRequest {
  string spoke_id = 1;
  string target_spoke_id = 2;  // optional: specific target. Empty = auto-route by patterns
}

message DrainSpokeResponse {
  int32 moved = 1;
  int32 failed = 2;
  repeated string errors = 3;
}
