syntax = "proto3";

package hobnob.v1;

option go_package = "github.com/hobnob/hobnob/gen/proto/hobnob";

import "google/protobuf/timestamp.proto";
import "google/api/annotations.proto";

// =============================================================================
// Agent-facing service (gRPC-only, port 9090)
// =============================================================================

service HobnobAgent {
  // Register enrolls a new agent with the server using hostname, IP, pubkey, and one-time token.
  rpc Register(RegisterRequest) returns (RegisterResponse);

  // CheckIn is the agent pull loop — returns modules to apply based on current state.
  rpc CheckIn(CheckInRequest) returns (CheckInResponse);

  // ReportResult submits per-module execution results after a run.
  rpc ReportResult(ReportResultRequest) returns (ReportResultResponse);

  // ReportNails submits collected nails from the agent.
  rpc ReportNails(ReportNailsRequest) returns (ReportNailsResponse);

  // DownloadCustomTrait retrieves a custom trait executable by name.
  rpc DownloadCustomTrait(DownloadCustomTraitRequest) returns (DownloadCustomTraitResponse);
}

// =============================================================================
// Admin-facing service (gRPC + grpc-gateway REST, port 8080)
// =============================================================================

service HobnobAdmin {
  // AddApprovedPattern adds a hostname/IP wildcard pattern with a one-time token.
  rpc AddApprovedPattern(AddApprovedPatternRequest) returns (AddApprovedPatternResponse) {
    option (google.api.http) = {
      post: "/api/v1/approved"
      body: "*"
    };
  }

  // ListApprovedPatterns lists all approved enrollment patterns.
  rpc ListApprovedPatterns(ListApprovedPatternsRequest) returns (ListApprovedPatternsResponse) {
    option (google.api.http) = {
      get: "/api/v1/approved"
    };
  }

  // RevokeApprovedPattern removes an approved pattern.
  rpc RevokeApprovedPattern(RevokeApprovedPatternRequest) returns (RevokeApprovedPatternResponse) {
    option (google.api.http) = {
      delete: "/api/v1/approved/{id}"
    };
  }

  // ListClients lists all enrolled clients.
  rpc ListClients(ListClientsRequest) returns (ListClientsResponse) {
    option (google.api.http) = {
      get: "/api/v1/clients"
    };
  }

  // GetClient returns details for a single client.
  rpc GetClient(GetClientRequest) returns (GetClientResponse) {
    option (google.api.http) = {
      get: "/api/v1/clients/{id}"
    };
  }

  // RevokeClient revokes an enrolled client, blocking future check-ins.
  rpc RevokeClient(RevokeClientRequest) returns (RevokeClientResponse) {
    option (google.api.http) = {
      post: "/api/v1/clients/{id}/revoke"
      body: "*"
    };
  }

  // ForcePush triggers an immediate check-in for a client or all clients.
  rpc ForcePush(ForcePushRequest) returns (ForcePushResponse) {
    option (google.api.http) = {
      post: "/api/v1/push"
      body: "*"
    };
  }

  // DryRun computes a plan without applying changes.
  rpc DryRun(DryRunRequest) returns (DryRunResponse) {
    option (google.api.http) = {
      post: "/api/v1/clients/{client_id}/dry-run"
      body: "*"
    };
  }

  // ListRuns lists recent runs, optionally filtered by client.
  rpc ListRuns(ListRunsRequest) returns (ListRunsResponse) {
    option (google.api.http) = {
      get: "/api/v1/runs"
    };
  }

  // GetRun returns details for a single run including per-module results.
  rpc GetRun(GetRunRequest) returns (GetRunResponse) {
    option (google.api.http) = {
      get: "/api/v1/runs/{id}"
    };
  }

  // GenerateToken generates a cryptographically random one-time enrollment token.
  rpc GenerateToken(GenerateTokenRequest) returns (GenerateTokenResponse) {
    option (google.api.http) = {
      post: "/api/v1/tokens"
      body: "*"
    };
  }

  // ListAllRuns lists recent runs across all clients.
  rpc ListAllRuns(ListAllRunsRequest) returns (ListRunsResponse) {
    option (google.api.http) = {
      get: "/api/v1/runs/all"
    };
  }

  // AddWebhook registers a new webhook endpoint.
  rpc AddWebhook(AddWebhookRequest) returns (AddWebhookResponse) {
    option (google.api.http) = {
      post: "/api/v1/webhooks"
      body: "*"
    };
  }

  // ListWebhooks lists all registered webhooks.
  rpc ListWebhooks(ListWebhooksRequest) returns (ListWebhooksResponse) {
    option (google.api.http) = {
      get: "/api/v1/webhooks"
    };
  }

  // DeleteWebhook removes a webhook by ID.
  rpc DeleteWebhook(DeleteWebhookRequest) returns (DeleteWebhookResponse) {
    option (google.api.http) = {
      delete: "/api/v1/webhooks/{id}"
    };
  }

  // GetComplianceSummary returns aggregate compliance status across all clients.
  rpc GetComplianceSummary(GetComplianceSummaryRequest) returns (GetComplianceSummaryResponse) {
    option (google.api.http) = {
      get: "/api/v1/compliance"
    };
  }

  // GetClientCompliance returns compliance details for a single client.
  rpc GetClientCompliance(GetClientComplianceRequest) returns (GetClientComplianceResponse) {
    option (google.api.http) = {
      get: "/api/v1/clients/{id}/compliance"
    };
  }

  // Rollback reverts a client to a previous run's state.
  rpc Rollback(RollbackRequest) returns (RollbackResponse) {
    option (google.api.http) = {
      post: "/api/v1/clients/{client_id}/rollback"
      body: "*"
    };
  }

  // ListPackages lists package audit records, optionally filtered by client.
  rpc ListPackages(ListPackagesRequest) returns (ListPackagesResponse) {
    option (google.api.http) = {
      get: "/api/v1/packages"
    };
  }

  // ListPackageDrift lists packages where installed version differs from desired.
  rpc ListPackageDrift(ListPackageDriftRequest) returns (ListPackageDriftResponse) {
    option (google.api.http) = {
      get: "/api/v1/packages/drift"
    };
  }

  // PromoteEnv promotes environment variables from one tier to another.
  rpc PromoteEnv(PromoteEnvRequest) returns (PromoteEnvResponse) {
    option (google.api.http) = {
      post: "/api/v1/env/promote"
      body: "*"
    };
  }
}

// =============================================================================
// Agent service messages
// =============================================================================

message RegisterRequest {
  string hostname = 1;
  string ip_address = 2;
  string pubkey_pem = 3;
  string token = 4;
}

message RegisterResponse {
  bool success = 1;
  string client_id = 2;     // UUID assigned by the server
  string message = 3;
}

message CheckInRequest {
  string client_id = 1;
  string state_fingerprint = 2;
  bytes signature = 3;
  google.protobuf.Timestamp timestamp = 4;
}

message CheckInResponse {
  repeated Module modules = 1;
  string base_interval = 2;   // e.g. "30m"
  int32 jitter_percent = 3;
  repeated CustomTraitEntry custom_traits = 4;
}

// CustomTraitEntry describes a custom trait executable in the server's traits directory.
message CustomTraitEntry {
  string name = 1;            // trait name derived from filename (without extension)
  string sha256 = 2;          // hex-encoded SHA256 checksum of the executable
}

// DownloadCustomTraitRequest asks the server for a custom trait executable's bytes.
message DownloadCustomTraitRequest {
  string name = 1;            // trait name (matches CustomTraitEntry.name)
}

// DownloadCustomTraitResponse returns the raw executable bytes.
message DownloadCustomTraitResponse {
  bytes data = 1;
}

message Module {
  string name = 1;
  string resource_type = 2;   // file, package, service, user
  repeated Resource resources = 3;
  repeated string depends_on = 4;
  repeated string notify = 5;
  repeated string subscribes = 6;
  reserved 7;                 // was: string when (now evaluated server-side)
}

message Resource {
  string name = 1;
  string type = 2;            // file, package, service, user
  map<string, string> params = 3;
  string when = 4;            // when expression for agent-side eval (builtins)
}

message ReportResultRequest {
  string run_id = 1;
  string client_id = 2;
  repeated ModuleResult results = 3;
  bytes signature = 4;
  google.protobuf.Timestamp timestamp = 5;
}

message ModuleResult {
  string module_name = 1;
  string resource_type = 2;
  string resource_name = 3;
  string action_taken = 4;     // none, created, updated, deleted
  bool changed = 5;
  string error_message = 6;
  int32 duration_ms = 7;
}

message ReportResultResponse {
  bool acknowledged = 1;
}

message ReportNailsRequest {
  string client_id = 1;
  bytes nails_json = 2;       // JSON-encoded nails map
  bytes signature = 3;
  google.protobuf.Timestamp timestamp = 4;
}

message ReportNailsResponse {
  bool acknowledged = 1;
}

// =============================================================================
// Admin service messages
// =============================================================================

message AddApprovedPatternRequest {
  string pattern = 1;
  string token = 2;           // plaintext token; server will bcrypt hash it
}

message AddApprovedPatternResponse {
  string id = 1;
  string pattern = 2;
  google.protobuf.Timestamp created_at = 3;
}

message ListApprovedPatternsRequest {}

message ListApprovedPatternsResponse {
  repeated ApprovedPattern patterns = 1;
}

message ApprovedPattern {
  string id = 1;
  string pattern = 2;
  google.protobuf.Timestamp created_at = 3;
  bool used = 4;
  string used_by = 5;          // client UUID if used
}

message RevokeApprovedPatternRequest {
  string id = 1;
}

message RevokeApprovedPatternResponse {}

message ListClientsRequest {}

message ListClientsResponse {
  repeated Client clients = 1;
}

message Client {
  string id = 1;
  string hostname = 2;
  string ip_address = 3;
  google.protobuf.Timestamp enrolled_at = 4;
  google.protobuf.Timestamp last_seen = 5;
  bool revoked = 6;
  google.protobuf.Timestamp revoked_at = 7;
}

message GetClientRequest {
  string id = 1;
}

message GetClientResponse {
  Client client = 1;
}

message RevokeClientRequest {
  string id = 1;
}

message RevokeClientResponse {}

message ForcePushRequest {
  string client_id = 1;       // empty = all clients
}

message ForcePushResponse {
  int32 clients_notified = 1;
}

message DryRunRequest {
  string client_id = 1;
}

message DryRunResponse {
  repeated PlannedAction actions = 1;
}

message PlannedAction {
  string module_name = 1;
  string resource_type = 2;
  string resource_name = 3;
  string planned_action = 4;   // create, update, delete, none
}

message ListRunsRequest {
  string client_id = 1;       // optional filter
  int32 limit = 2;            // default 20
}

message ListRunsResponse {
  repeated Run runs = 1;
}

message Run {
  string id = 1;
  string client_id = 2;
  google.protobuf.Timestamp started_at = 3;
  google.protobuf.Timestamp finished_at = 4;
  string status = 5;          // running, success, failure, partial
  int32 module_count = 6;
  int32 changed_count = 7;
  int32 failed_count = 8;
  int32 skipped_count = 9;
}

message GetRunRequest {
  string id = 1;
}

message GetRunResponse {
  Run run = 1;
  repeated ModuleResult results = 2;
}

message GenerateTokenRequest {}

message GenerateTokenResponse {
  string token = 1;
}

// =============================================================================
// Phase 3: ListAllRuns messages
// =============================================================================

message ListAllRunsRequest {
  int32 limit = 1;              // default 20
}

// =============================================================================
// Phase 3: Webhook messages
// =============================================================================

message AddWebhookRequest {
  string url = 1;
  string secret = 2;
  repeated string events = 3;
}

message AddWebhookResponse {
  WebhookInfo webhook = 1;
}

message ListWebhooksRequest {}

message ListWebhooksResponse {
  repeated WebhookInfo webhooks = 1;
}

message DeleteWebhookRequest {
  string id = 1;
}

message DeleteWebhookResponse {}

message WebhookInfo {
  string id = 1;
  string url = 2;
  repeated string events = 3;
  google.protobuf.Timestamp created_at = 4;
  bool active = 5;
}

// =============================================================================
// Phase 3: Compliance messages
// =============================================================================

message GetComplianceSummaryRequest {}

message GetComplianceSummaryResponse {
  int32 total = 1;
  int32 compliant = 2;
  int32 drifted = 3;
  int32 failing = 4;
  int32 stale = 5;
  int32 unknown = 6;
  float compliance_pct = 7;
}

message GetClientComplianceRequest {
  string id = 1;
}

message GetClientComplianceResponse {
  string status = 1;
  Run last_run = 2;
  repeated ComplianceSnapshot history = 3;
}

message ComplianceSnapshot {
  string date = 1;
  int32 total = 2;
  int32 compliant = 3;
  int32 drifted = 4;
  int32 failing = 5;
  int32 stale = 6;
  int32 unknown = 7;
}

// =============================================================================
// Phase 3: Rollback messages
// =============================================================================

message RollbackRequest {
  string client_id = 1;
  string run_id = 2;            // optional: rollback to specific run
  string file_path = 3;         // optional: rollback a single file
}

message RollbackResponse {
  bool success = 1;
  string message = 2;
}

// =============================================================================
// Phase 3: Package audit messages
// =============================================================================

message ListPackagesRequest {
  string client_id = 1;         // optional filter
}

message ListPackagesResponse {
  repeated PackageInfo packages = 1;
}

message ListPackageDriftRequest {}

message ListPackageDriftResponse {
  repeated PackageDrift drifts = 1;
}

message PackageInfo {
  string client_id = 1;
  string hostname = 2;
  string package_name = 3;
  string installed_version = 4;
  string desired_version = 5;
}

message PackageDrift {
  string client_id = 1;
  string hostname = 2;
  string package_name = 3;
  string installed_version = 4;
  string desired_version = 5;
  google.protobuf.Timestamp detected_at = 6;
}

// =============================================================================
// Phase 3: Env promote messages
// =============================================================================

message PromoteEnvRequest {
  string module_name = 1;
  string from_env = 2;
  string to_env = 3;
}

message PromoteEnvResponse {
  string promotion_id = 1;
  map<string, string> diff = 2;
}
