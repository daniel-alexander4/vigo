[build]
# Build artifacts go to `agent/.build/` instead of the default
# `agent/target/`. Rationale: a prior session left `agent/target/`
# owned by root, and `/tmp` is a tmpfs on this box (size = half of
# RAM by default on systemd) which fills up on any non-trivial
# build. `.build` is an in-repo sibling that's dan-owned,
# gitignored, and backed by the same disk as the source — no tmpfs
# exhaustion, no ownership games. Relative target-dir paths are
# resolved relative to the parent directory of this config file
# (`agent/`), so `.build` resolves to `agent/.build/`.
target-dir = ".build"

[target.x86_64-unknown-linux-musl]
# musl-tools provides musl-gcc on Debian/Ubuntu.
# ring/aws-lc-sys need a C compiler for the musl target.

[target.aarch64-unknown-linux-musl]
linker = "aarch64-linux-gnu-gcc"
rustflags = ["-C", "target-feature=+crt-static"]

[env]
# Set CC for musl targets when cross-compiling from glibc hosts.
# Override per-target via CC_x86_64_unknown_linux_musl env var if needed.
