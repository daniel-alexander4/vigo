[package]
name = "vigo"
version = "0.73.0"
edition = "2021"
description = "Vigo Distributed State Enforcement Agent"
license = "LicenseRef-Proprietary"

[dependencies]
# gRPC + Proto
tonic = { version = "0.12", features = ["tls"] }
prost = "0.13"
prost-types = "0.13"
# prost-reflect 0.15.x is the latest line that supports prost 0.13.
# Used by `agent/src/checkin/verify.rs` to read the `(vigo.signed)`
# field option from `vigo_options.proto` so neither the server nor the
# agent has to hand-maintain a "which PolicyBundle fields are signed"
# list — the annotation in the .proto is the single source of truth.
prost-reflect = "0.15"

# TLS + Crypto
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std"] }
rustls-pki-types = "1"
rustls-pemfile = "2"
rcgen = "0.13"
x509-parser = "0.16"
ed25519-dalek = { version = "2", features = ["pkcs8", "pem", "rand_core"] }
hostname = "0.4"
p256 = { version = "0.13", features = ["pkcs8", "pem"] }
sha2 = "0.10"
sha-crypt = "0.5"
hkdf = "0.12"
hex = "0.4"
base64 = "0.22"
age = { version = "0.11", default-features = false }
seahash = "4"
rand = "0.8"
pkcs8 = { version = "0.10", features = ["pem", "std"] }
spki = { version = "0.7", features = ["pem", "std"] }

# Async
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time", "process", "fs", "net"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

# HTTP (bootstrap + self-update only — blocking, no async runtime overhead)
ureq = { version = "3", features = ["rustls", "json"] }

# HTTP server (swarm peer serving on :1531)
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio", "http1", "server-auto"] }
http-body-util = "0.1"
tokio-rustls = "0.26"

# Persistent state (LMDB)
heed = "0.20"

# SSH transport (gateway proxy for network devices)
russh = "0.46"
russh-keys = "0.46"

# UDP multicast (swarm peer discovery)
socket2 = { version = "0.5", features = ["all"] }

# OCI archive parsing (curator registry shim — ADR-024 slice 7)
tar = { version = "0.4", default-features = false }

# Misc
regex-lite = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "ansi", "smallvec", "std"] }
uuid = { version = "1", features = ["v4"] }
anyhow = "1"
async-trait = "0.1"
thiserror = "2"
tokio-stream = "0.1"
tokio-util = "0.7"
async-stream = "0.3"
argon2 = "0.5"
chacha20poly1305 = "0.10"
rpassword = "7"
zeroize = { version = "1", features = ["zeroize_derive"] }
notify = { version = "6", default-features = false, features = ["macos_kqueue"] }
tempfile = "3"
lru = "0.12"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", features = ["user", "fs", "signal", "process"] }
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-service = "0.7"
winreg = "0.55"

[dev-dependencies]
mockito = "1"
serial_test = "3"

[build-dependencies]
tonic-build = "0.12"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
overflow-checks = true

[lints.clippy]
# Structural-pedantry lints: the "fix" is pure boilerplate (a Default
# impl per type) or invasive signature churn, not a real improvement.
new_without_default = "allow"
too_many_arguments = "allow"
