name: nginx

vars:
  worker_processes: "auto"
  keepalive_timeout: "65"
  doc_root: "/var/www/html"

resources:
  - name: install-nginx
    type: package
    package: nginx
    state: present

  - name: nginx-conf
    type: file
    targetpath: /etc/nginx/nginx.conf
    source: templates/nginx.conf.tmpl
    owner: root
    group: root
    mode: "0644"
    depends_on: [install-nginx]
    notify: [nginx-service]

  - name: default-site
    type: file
    targetpath: /etc/nginx/conf.d/default.conf
    content: |
      server {
          listen 80;
          server_name {{ .Vars.server_name }};
          root {{ .Vars.doc_root }};

          location / {
              try_files $uri $uri/ =404;
          }
      }
    owner: root
    group: root
    mode: "0644"
    depends_on: [nginx-conf]
    notify: [nginx-service]

  - name: doc-root
    type: file
    targetpath: "{{ .Vars.doc_root }}"
    state: directory
    owner: www-data
    group: www-data
    mode: "0755"

  - name: nginx-service
    type: service
    service: nginx
    enabled: true
    state: running
    depends_on: [nginx-conf, default-site]
    subscribes: [nginx-conf, default-site]
