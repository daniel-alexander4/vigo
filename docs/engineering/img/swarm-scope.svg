<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 560" font-family="Inter, system-ui, -apple-system, sans-serif">
  <defs>
    <filter id="shadow" x="-6%" y="-6%" width="112%" height="112%">
      <feDropShadow dx="1" dy="2" stdDeviation="2.5" flood-opacity="0.16"/>
    </filter>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8f9fa"/><stop offset="100%" stop-color="#edf2f7"/>
    </linearGradient>
    <linearGradient id="swarmGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2d3748"/><stop offset="100%" stop-color="#1a202c"/>
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f6c948"/><stop offset="100%" stop-color="#e6a817"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4299e1"/><stop offset="100%" stop-color="#3182ce"/>
    </linearGradient>
    <linearGradient id="tealGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38b2ac"/><stop offset="100%" stop-color="#2c7a7b"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#48bb78"/><stop offset="100%" stop-color="#2f855a"/>
    </linearGradient>
  </defs>

  <rect width="740" height="560" fill="url(#bgGrad)"/>
  <text x="370" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#1a202c">Vigo scope hierarchy</text>

  <!-- ── FLEET (outermost) ─────────────────────────────────────────────── -->
  <g filter="url(#shadow)">
    <rect x="24" y="46" width="692" height="476" rx="11" fill="#f1f3f5" stroke="#cbd5e0" stroke-width="1.5"/>
  </g>
  <text x="44" y="69" font-size="14" font-weight="700" fill="#4a5568" letter-spacing="0.4">FLEET</text>
  <text x="100" y="69" font-size="12" fill="#718096">— every envoy enrolled with this server (broadest scope)</text>

  <!-- ── SWARM (inside the fleet) ──────────────────────────────────────── -->
  <g filter="url(#shadow)">
    <rect x="44" y="82" width="652" height="424" rx="10" fill="url(#swarmGrad)"/>
  </g>
  <text x="64" y="105" font-size="14" font-weight="700" fill="#fff" letter-spacing="0.4">SWARM</text>
  <text x="124" y="105" font-size="12" fill="#cbd5e0">— the envoy P2P substrate (there is exactly one; no "a user's swarm")</text>
  <text x="64" y="122" font-size="10.5" fill="#a0aec0">mTLS HTTPS :1531 · multicast discovery 224.0.0.42 · manifest CRDT gossip · content-addressed chunking</text>

  <!-- swarmcast + longdrawer (fleet-scoped subsystems, directly on the swarm) -->
  <g filter="url(#shadow)">
    <rect x="64" y="138" width="304" height="96" rx="9" fill="url(#orangeGrad)"/>
    <rect x="372" y="138" width="304" height="96" rx="9" fill="url(#blueGrad)"/>
  </g>
  <text x="216" y="162" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">swarmcast</text>
  <text x="216" y="182" text-anchor="middle" font-size="11" fill="#fffaf0">admin-pushed file fan-out</text>
  <text x="216" y="197" text-anchor="middle" font-size="11" fill="#fffaf0">scope: fleet-wide · operator-initiated</text>
  <text x="216" y="217" text-anchor="middle" font-size="10" fill="#fff8e1">`vigocli swarm swarmcast distribute`</text>
  <text x="524" y="162" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">longdrawer</text>
  <text x="524" y="182" text-anchor="middle" font-size="11" fill="#ebf8ff">per-user plaintext home-dir sync</text>
  <text x="524" y="197" text-anchor="middle" font-size="11" fill="#ebf8ff">scope: the LAN envoys holding ~/longdrawer/</text>
  <text x="524" y="217" text-anchor="middle" font-size="10" fill="#e0f2ff">(not puddle-bound)</text>

  <!-- ── PUDDLE (inside the swarm) ─────────────────────────────────────── -->
  <g filter="url(#shadow)">
    <rect x="64" y="250" width="612" height="240" rx="10" fill="#faf5ff" stroke="#805ad5" stroke-width="2" stroke-dasharray="7 4"/>
  </g>
  <text x="84" y="274" font-size="13.5" font-weight="700" fill="#6b46c1" letter-spacing="0.3">PUDDLE</text>
  <text x="148" y="274" font-size="11.5" fill="#6b46c1">— one user's envoys, treated as a single Ed25519 identity</text>
  <text x="84" y="290" font-size="10.5" fill="#805ad5">per user; never fleet-wide · the trust anchor that lockbox &amp; swarmgit consume</text>

  <!-- swarmgit + lockbox (puddle-scoped subsystems) -->
  <g filter="url(#shadow)">
    <rect x="84" y="304" width="288" height="166" rx="9" fill="url(#tealGrad)"/>
    <rect x="388" y="304" width="288" height="166" rx="9" fill="url(#greenGrad)"/>
  </g>
  <text x="228" y="330" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">swarmgit</text>
  <text x="228" y="352" text-anchor="middle" font-size="11" fill="#e6fffa">per-user source-control repo mirrors</text>
  <text x="228" y="367" text-anchor="middle" font-size="11" fill="#e6fffa">(personal disaster recovery)</text>
  <text x="228" y="389" text-anchor="middle" font-size="11" fill="#e6fffa">membership = the puddle</text>
  <text x="228" y="411" text-anchor="middle" font-size="10" fill="#d4f5f0">`vigo swarm swarmgit project …`</text>
  <text x="228" y="440" text-anchor="middle" font-size="10" fill="#d4f5f0">root-owned bare repos on peer envoys</text>
  <text x="532" y="330" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">lockbox</text>
  <text x="532" y="352" text-anchor="middle" font-size="11" fill="#f0fff4">per-user always-encrypted home-dir sync</text>
  <text x="532" y="367" text-anchor="middle" font-size="11" fill="#f0fff4">ciphertext at rest · password-gated decrypt</text>
  <text x="532" y="389" text-anchor="middle" font-size="11" fill="#f0fff4">membership = the puddle (ADR-020)</text>
  <text x="532" y="411" text-anchor="middle" font-size="10" fill="#dcfce7">files dropped in ~/lockbox/</text>
  <text x="532" y="440" text-anchor="middle" font-size="10" fill="#dcfce7">age-encrypted to every puddle envoy</text>

  <!-- ── containment caption ───────────────────────────────────────────── -->
  <text x="370" y="540" text-anchor="middle" font-size="12" fill="#4a5568">fleet ⊃ swarm ⊃ &#123; <tspan font-weight="700" fill="#b7791f">swarmcast</tspan>, <tspan font-weight="700" fill="#2b6cb0">longdrawer</tspan>, <tspan font-weight="700" fill="#6b46c1">puddle</tspan> ⊃ &#123; <tspan font-weight="700" fill="#2c7a7b">swarmgit</tspan>, <tspan font-weight="700" fill="#2f855a">lockbox</tspan> &#125; &#125;  ·  all four ride the swarm transport; this shows scope, not data path</text>
</svg>
