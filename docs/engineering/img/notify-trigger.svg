<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200" font-family="Inter, system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#48bb78"/>
      <stop offset="100%" stop-color="#38a169"/>
    </linearGradient>
    <linearGradient id="grayGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e0"/>
      <stop offset="100%" stop-color="#a0aec0"/>
    </linearGradient>
    <linearGradient id="orangeRes" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f6ad55"/>
      <stop offset="100%" stop-color="#e6a817"/>
    </linearGradient>
    <filter id="sh" x="-4%" y="-4%" width="108%" height="116%">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
    <marker id="aGreen" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#38a169"/>
    </marker>
    <marker id="aGray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#a0aec0"/>
    </marker>
  </defs>

  <rect width="600" height="200" fill="#f8f9fa" rx="4"/>

  <!-- Title -->
  <text x="300" y="24" text-anchor="middle" font-size="14" font-weight="600" fill="#2d3748">Notify Trigger Flow</text>

  <!-- Path A label -->
  <text x="20" y="68" font-size="11" font-weight="700" fill="#38a169">Path A</text>

  <!-- Path A: config changed -->
  <rect x="70" y="48" width="120" height="40" rx="8" fill="url(#orangeRes)" filter="url(#sh)"/>
  <text x="130" y="65" text-anchor="middle" font-size="10" font-weight="600" fill="#fff">nginx-config</text>
  <text x="130" y="78" text-anchor="middle" font-size="9" fill="#fff" opacity="0.9">CHANGED</text>

  <!-- Arrow -->
  <line x1="190" y1="68" x2="240" y2="68" stroke="#38a169" stroke-width="2" marker-end="url(#aGreen)"/>
  <text x="215" y="60" text-anchor="middle" font-size="8" fill="#38a169" font-weight="600">notify</text>

  <!-- Path A: service restart -->
  <rect x="244" y="48" width="130" height="40" rx="8" fill="url(#greenGrad)" filter="url(#sh)"/>
  <text x="309" y="65" text-anchor="middle" font-size="10" font-weight="600" fill="#fff">nginx-service</text>
  <text x="309" y="78" text-anchor="middle" font-size="9" fill="#fff" opacity="0.9">RESTART</text>

  <!-- Arrow -->
  <line x1="374" y1="68" x2="424" y2="68" stroke="#38a169" stroke-width="2" marker-end="url(#aGreen)"/>

  <!-- Path A: result -->
  <rect x="428" y="48" width="140" height="40" rx="8" fill="url(#greenGrad)" filter="url(#sh)"/>
  <text x="498" y="65" text-anchor="middle" font-size="10" font-weight="600" fill="#fff">Service Updated</text>
  <text x="498" y="78" text-anchor="middle" font-size="9" fill="#fff" opacity="0.9">status: changed</text>

  <!-- Path B label -->
  <text x="20" y="148" font-size="11" font-weight="700" fill="#a0aec0">Path B</text>

  <!-- Path B: config unchanged -->
  <rect x="70" y="128" width="120" height="40" rx="8" fill="url(#orangeRes)" filter="url(#sh)"/>
  <text x="130" y="145" text-anchor="middle" font-size="10" font-weight="600" fill="#fff">nginx-config</text>
  <text x="130" y="158" text-anchor="middle" font-size="9" fill="#fff" opacity="0.9">NO CHANGE</text>

  <!-- Gray arrow -->
  <line x1="190" y1="148" x2="240" y2="148" stroke="#a0aec0" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#aGray)"/>
  <text x="215" y="140" text-anchor="middle" font-size="8" fill="#a0aec0" font-weight="600">no notify</text>

  <!-- Path B: service skipped -->
  <rect x="244" y="128" width="130" height="40" rx="8" fill="url(#grayGrad)" filter="url(#sh)"/>
  <text x="309" y="145" text-anchor="middle" font-size="10" font-weight="600" fill="#fff">nginx-service</text>
  <text x="309" y="158" text-anchor="middle" font-size="9" fill="#fff" opacity="0.9">SKIPPED</text>

  <!-- Arrow -->
  <line x1="374" y1="148" x2="424" y2="148" stroke="#a0aec0" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#aGray)"/>

  <!-- Path B: result -->
  <rect x="428" y="128" width="140" height="40" rx="8" fill="url(#grayGrad)" filter="url(#sh)"/>
  <text x="498" y="145" text-anchor="middle" font-size="10" font-weight="600" fill="#fff">Not Triggered</text>
  <text x="498" y="158" text-anchor="middle" font-size="9" fill="#fff" opacity="0.9">status: skipped</text>
</svg>