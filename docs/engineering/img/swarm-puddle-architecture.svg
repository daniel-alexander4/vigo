<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 620" font-family="Inter, system-ui, -apple-system, sans-serif">
  <defs>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="1" dy="2" stdDeviation="2.5" flood-opacity="0.13"/>
    </filter>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8f9fa"/>
      <stop offset="100%" stop-color="#edf2f7"/>
    </linearGradient>
    <linearGradient id="swarmGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#718096"/>
      <stop offset="100%" stop-color="#4a5568"/>
    </linearGradient>
    <linearGradient id="puddleGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4299e1"/>
      <stop offset="100%" stop-color="#3182ce"/>
    </linearGradient>
    <linearGradient id="puddleBodyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ebf8ff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
    <linearGradient id="cryptGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#48bb78"/>
      <stop offset="100%" stop-color="#38a169"/>
    </linearGradient>
    <linearGradient id="cryptBodyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0fff4"/>
      <stop offset="100%" stop-color="#c6f6d5"/>
    </linearGradient>
    <linearGradient id="gitGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9f7aea"/>
      <stop offset="100%" stop-color="#805ad5"/>
    </linearGradient>
    <linearGradient id="gitBodyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#faf5ff"/>
      <stop offset="100%" stop-color="#e9d8fd"/>
    </linearGradient>
    <linearGradient id="otherGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a0aec0"/>
      <stop offset="100%" stop-color="#718096"/>
    </linearGradient>
    <linearGradient id="otherBodyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f7fafc"/>
      <stop offset="100%" stop-color="#edf2f7"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="620" rx="8" fill="url(#bgGrad)"/>

  <!-- Title -->
  <text x="400" y="28" text-anchor="middle" font-size="15" font-weight="700" fill="#2d3748">Swarm subsystem hierarchy (post-0.40.0)</text>
  <text x="400" y="48" text-anchor="middle" font-size="11" fill="#718096">Lifecycle lives at puddle; content-domain verbs live in subsystems</text>

  <!-- ===== OUTER: vigo swarm ===== -->
  <rect x="20" y="62" width="760" height="490" rx="12" fill="#fff" stroke="#4a5568" stroke-width="2" filter="url(#shadow)"/>
  <rect x="20" y="62" width="760" height="32" rx="12" fill="url(#swarmGrad)"/>
  <rect x="20" y="80" width="760" height="14" fill="url(#swarmGrad)"/>
  <text x="400" y="84" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">vigo swarm — peer-to-peer substrate</text>
  <text x="36" y="113" font-size="10" fill="#4a5568">mTLS on :1531  ·  multicast peer discovery on :1532 (longdrawer) and :1533 (lockbox)  ·  shared transport for all subsystems below</text>

  <!-- ===== PUDDLE (inside swarm) ===== -->
  <rect x="40" y="128" width="720" height="298" rx="10" fill="url(#puddleBodyGrad)" stroke="#3182ce" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="40" y="128" width="720" height="30" rx="10" fill="url(#puddleGrad)"/>
  <rect x="40" y="146" width="720" height="12" fill="url(#puddleGrad)"/>
  <text x="400" y="148" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">puddle — per-user trust anchor</text>

  <text x="56" y="175" font-size="10" fill="#2c5282">One Ed25519 keypair per user representing "this user's collection of envoys."  Wrapped under user passphrase.</text>
  <text x="56" y="189" font-size="10" fill="#2c5282">Single-envoy puddles are valid (encryption-at-rest, no fan-out — Mode 1).</text>

  <!-- Puddle lifecycle verbs banner -->
  <rect x="56" y="200" width="688" height="38" rx="6" fill="#fff" stroke="#90cdf4" stroke-width="1"/>
  <text x="62" y="214" font-size="9" font-weight="700" fill="#2b6cb0">LIFECYCLE — the only place lifecycle lives:</text>
  <text x="62" y="230" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#2c5282">init  pair  join  leave  unlock  lock  status  rotate-passphrase  rekey-pair  rekey  evict  members  pubkey</text>

  <!-- ----- LOCKBOX card (inside puddle, left) ----- -->
  <rect x="56" y="252" width="338" height="160" rx="8" fill="url(#cryptBodyGrad)" stroke="#38a169" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="56" y="252" width="338" height="28" rx="8" fill="url(#cryptGrad)"/>
  <rect x="56" y="270" width="338" height="10" fill="url(#cryptGrad)"/>
  <text x="225" y="270" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">lockbox — encrypted file sync</text>

  <text x="68" y="296" font-size="9.5" fill="#22543d">Mesh = puddle members.  Auto-enrolls on</text>
  <text x="68" y="308" font-size="9.5" fill="#22543d">puddle init / join.  No own lifecycle.</text>
  <text x="68" y="324" font-size="9.5" fill="#22543d" font-weight="600">Per-envoy age key, wrapped via puddle helper.</text>

  <text x="68" y="346" font-size="9" font-weight="700" fill="#22543d">CONTENT VERBS (only):</text>
  <text x="68" y="362" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#22543d">encrypt  decrypt  push  list</text>
  <text x="68" y="376" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#22543d">status  reencrypt  resurrect  purge</text>

  <text x="68" y="398" font-size="9" font-style="italic" fill="#2f855a">Lifecycle: managed by puddle.</text>

  <!-- ----- GITMIRROR card (inside puddle, right) ----- -->
  <rect x="406" y="252" width="338" height="160" rx="8" fill="url(#gitBodyGrad)" stroke="#805ad5" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="406" y="252" width="338" height="28" rx="8" fill="url(#gitGrad)"/>
  <rect x="406" y="270" width="338" height="10" fill="url(#gitGrad)"/>
  <text x="575" y="270" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">gitmirror project — distributed git</text>

  <text x="418" y="296" font-size="9.5" fill="#44337a">project_id = sha256(founder puddle pubkey).</text>
  <text x="418" y="308" font-size="9.5" fill="#44337a">Many projects per puddle.  Project membership</text>
  <text x="418" y="320" font-size="9.5" fill="#44337a">can span multiple puddles (cross-team collab).</text>

  <text x="418" y="342" font-size="9" font-weight="700" fill="#44337a">PER-PROJECT LIFECYCLE:</text>
  <text x="418" y="357" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#44337a">project init  join  leave</text>
  <text x="418" y="371" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#44337a">invite  revoke  list  status  reanchor</text>

  <text x="418" y="394" font-size="9" font-style="italic" fill="#553c9a">Content: standard git over vigo://&lt;project_id&gt;/...</text>

  <!-- ===== Other subsystems (orthogonal to puddle) ===== -->
  <rect x="40" y="446" width="720" height="92" rx="10" fill="url(#otherBodyGrad)" stroke="#718096" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="40" y="446" width="720" height="28" rx="10" fill="url(#otherGrad)"/>
  <rect x="40" y="464" width="720" height="10" fill="url(#otherGrad)"/>
  <text x="400" y="464" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">Other content subsystems — orthogonal, no puddle dependency</text>

  <rect x="56" y="486" width="338" height="44" rx="6" fill="#fff" stroke="#a0aec0" stroke-width="1"/>
  <text x="68" y="502" font-size="11" font-weight="700" fill="#2d3748">longdrawer</text>
  <text x="68" y="518" font-size="9.5" fill="#4a5568">LAN plaintext directory sync (multicast :1532).  No puddle required.</text>

  <rect x="406" y="486" width="338" height="44" rx="6" fill="#fff" stroke="#a0aec0" stroke-width="1"/>
  <text x="418" y="502" font-size="11" font-weight="700" fill="#2d3748">payload</text>
  <text x="418" y="518" font-size="9.5" fill="#4a5568">Admin-pushed fleet content via swarm tracker.  Operator-authenticated.</text>

  <!-- Footer / caption -->
  <text x="400" y="582" text-anchor="middle" font-size="10" fill="#4a5568">If in puddle, lockbox and gitmirror work.  If not in puddle, neither work.</text>
  <text x="400" y="600" text-anchor="middle" font-size="10" fill="#4a5568">Lockbox's mesh equals the puddle.  Gitmirror's projects are an orthogonal axis below puddle.</text>
</svg>
