<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 130" font-family="Inter, system-ui, sans-serif" font-size="13">
  <rect width="600" height="130" fill="#f8f9fa" rx="8"/>
  <text x="300" y="24" text-anchor="middle" font-size="15" font-weight="700" fill="#1a202c">Bundle TTL — Proactive Renewal</text>

  <!-- Timeline bar -->
  <rect x="50" y="50" width="340" height="35" rx="6" fill="#e8fce8" stroke="#38a169" stroke-width="1.5"/>
  <text x="220" y="72" text-anchor="middle" font-weight="600" fill="#276749" font-size="12">Normal check-in</text>

  <rect x="390" y="50" width="100" height="35" rx="6" fill="#fffbeb" stroke="#f6e05e" stroke-width="1.5"/>
  <text x="440" y="72" text-anchor="middle" font-weight="600" fill="#975a16" font-size="12">Renewal</text>

  <rect x="490" y="50" width="60" height="35" rx="6" fill="#fff5f5" stroke="#fc8181" stroke-width="1.5"/>
  <text x="520" y="72" text-anchor="middle" font-weight="600" fill="#c53030" font-size="11">Expired</text>

  <!-- Time markers -->
  <line x1="50" y1="92" x2="50" y2="100" stroke="#666" stroke-width="1.5"/>
  <text x="50" y="115" text-anchor="middle" font-size="11" fill="#666">0h</text>

  <line x1="390" y1="92" x2="390" y2="100" stroke="#666" stroke-width="1.5"/>
  <text x="390" y="115" text-anchor="middle" font-size="11" fill="#666">19.2h (80%)</text>

  <line x1="550" y1="92" x2="550" y2="100" stroke="#666" stroke-width="1.5"/>
  <text x="550" y="115" text-anchor="middle" font-size="11" fill="#666">24h (TTL)</text>
</svg>
