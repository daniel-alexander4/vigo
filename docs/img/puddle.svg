<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 480" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="13">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>

  <rect width="760" height="480" fill="#ffffff"/>

  <!-- Founder envoy -->
  <rect x="40" y="40" width="280" height="170" fill="#fef9c3" stroke="#a16207" stroke-width="1.5" rx="6"/>
  <text x="180" y="64" text-anchor="middle" font-weight="600">Founder envoy (A)</text>
  <text x="180" y="82" text-anchor="middle" font-size="11" fill="#475569">vigo swarm puddle init</text>

  <rect x="60" y="98" width="240" height="32" fill="#ffffff" stroke="#94a3b8" stroke-width="1" rx="3"/>
  <text x="180" y="118" text-anchor="middle" font-size="11">~/.vigo-puddle/identity.wrapped</text>
  <text x="180" y="148" text-anchor="middle" font-size="10" fill="#475569">Ed25519 priv key + Argon2id+XChaCha20 wrap</text>
  <text x="180" y="164" text-anchor="middle" font-size="10" fill="#475569">+ identity.salt · identity.pub</text>

  <rect x="60" y="172" width="240" height="32" fill="#dbeafe" stroke="#2563eb" stroke-width="1" rx="3"/>
  <text x="180" y="192" text-anchor="middle" font-size="11">vigo swarm puddle pair → 4827-9163</text>

  <!-- Pairing flow arrow -->
  <path d="M 320 200 Q 380 240 440 200" stroke="#475569" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
  <text x="380" y="235" text-anchor="middle" font-size="11" fill="#475569" font-weight="600">user dictates code (5-min TTL, single-use)</text>

  <!-- Joining envoy -->
  <rect x="440" y="40" width="280" height="170" fill="#fef9c3" stroke="#a16207" stroke-width="1.5" rx="6"/>
  <text x="580" y="64" text-anchor="middle" font-weight="600">New envoy (B)</text>
  <text x="580" y="82" text-anchor="middle" font-size="11" fill="#475569">no puddle yet</text>

  <rect x="460" y="98" width="240" height="32" fill="#dbeafe" stroke="#2563eb" stroke-width="1" rx="3"/>
  <text x="580" y="118" text-anchor="middle" font-size="11">sudo vigo swarm puddle join --from A</text>

  <text x="580" y="148" text-anchor="middle" font-size="11" fill="#475569">POST /swarm/puddle/pair-claim/&lt;user&gt;</text>
  <text x="580" y="164" text-anchor="middle" font-size="10" fill="#475569">over swarm mTLS · port 1531</text>

  <rect x="460" y="172" width="240" height="32" fill="#ffffff" stroke="#94a3b8" stroke-width="1" rx="3"/>
  <text x="580" y="192" text-anchor="middle" font-size="11">→ identical bytes for identity.wrapped</text>

  <!-- Unlock + session helper -->
  <path d="M 580 210 L 580 250" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="600" y="232" font-size="11" fill="#475569">unlock</text>

  <rect x="280" y="255" width="280" height="60" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5" rx="6"/>
  <text x="420" y="278" text-anchor="middle" font-weight="600">Session helper (per-user daemon)</text>
  <text x="420" y="298" text-anchor="middle" font-size="11" fill="#475569">Unwrapped key in RAM · SO_PEERCRED socket</text>

  <!-- Siblings consume -->
  <path d="M 320 315 L 200 360" stroke="#475569" stroke-width="1.2" marker-end="url(#arr)"/>
  <path d="M 420 315 L 420 360" stroke="#475569" stroke-width="1.2" marker-end="url(#arr)"/>
  <path d="M 520 315 L 640 360" stroke="#475569" stroke-width="1.2" marker-end="url(#arr)"/>

  <text x="420" y="345" text-anchor="middle" font-size="10" fill="#475569">SIGN socket → sibling subsystems</text>

  <rect x="100" y="365" width="200" height="50" fill="#fce7f3" stroke="#be185d" stroke-width="1" rx="3"/>
  <text x="200" y="385" text-anchor="middle" font-weight="600" font-size="12">Lockbox</text>
  <text x="200" y="403" text-anchor="middle" font-size="10" fill="#475569">wrap age identity for this envoy</text>

  <rect x="320" y="365" width="200" height="50" fill="#dcfce7" stroke="#16a34a" stroke-width="1" rx="3"/>
  <text x="420" y="385" text-anchor="middle" font-weight="600" font-size="12">Gitback</text>
  <text x="420" y="403" text-anchor="middle" font-size="10" fill="#475569">sign capability tokens + envelopes</text>

  <rect x="540" y="365" width="200" height="50" fill="#e0e7ff" stroke="#4338ca" stroke-width="1" rx="3"/>
  <text x="640" y="385" text-anchor="middle" font-weight="600" font-size="12">Curator</text>
  <text x="640" y="403" text-anchor="middle" font-size="10" fill="#475569">sign catalog entries</text>

  <text x="380" y="445" text-anchor="middle" font-size="11" fill="#475569" font-weight="600">project_id / artifact_id / lockbox-wrap all anchor to puddle_pubkey</text>
</svg>
