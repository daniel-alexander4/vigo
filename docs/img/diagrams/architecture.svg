<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" font-family="Inter, system-ui, sans-serif" fill="none">
  <!-- Catppuccin Mocha accents; currentColor strokes/text adapt to the docs theme -->
  <style>
    .box { stroke: currentColor; stroke-width: 1.5; rx: 8; }
    .lbl { fill: currentColor; font-size: 14px; font-weight: 600; }
    .sub { fill: currentColor; font-size: 11px; opacity: 0.75; }
    .flow { stroke: currentColor; stroke-width: 1.5; opacity: 0.85; }
    .ftxt { fill: currentColor; font-size: 11px; opacity: 0.9; }
    .srv { fill: #89b4fa22; }
    .agt { fill: #a6e3a122; }
    .ops { fill: #cba6f722; }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
  </defs>

  <!-- Server -->
  <rect class="box srv" x="40" y="120" width="200" height="80" rx="8"/>
  <text class="lbl" x="140" y="150" text-anchor="middle">vigosrv</text>
  <text class="sub" x="140" y="170" text-anchor="middle">resolve desired state</text>
  <text class="sub" x="140" y="185" text-anchor="middle">store results · SQLite</text>

  <!-- Agent / envoy -->
  <rect class="box agt" x="480" y="120" width="200" height="80" rx="8"/>
  <text class="lbl" x="580" y="150" text-anchor="middle">vigo agent (envoy)</text>
  <text class="sub" x="580" y="170" text-anchor="middle">apply idempotently</text>
  <text class="sub" x="580" y="185" text-anchor="middle">offline-capable · LMDB cache</text>

  <!-- Admin surfaces -->
  <rect class="box ops" x="40" y="20" width="200" height="56" rx="8"/>
  <text class="lbl" x="140" y="44" text-anchor="middle">vigocli · Web UI</text>
  <text class="sub" x="140" y="62" text-anchor="middle">admin REST · port 8443</text>

  <!-- admin → server -->
  <path class="flow" d="M140,76 L140,118" marker-end="url(#arr)"/>

  <!-- check-in (agent → server) -->
  <path class="flow" d="M478,140 L242,140" marker-end="url(#arr)"/>
  <text class="ftxt" x="360" y="133" text-anchor="middle">1 · CheckIn — fingerprint + traits (mTLS, ed25519-signed)</text>

  <!-- policy bundle (server → agent) -->
  <path class="flow" d="M242,165 L478,165" marker-end="url(#arr)"/>
  <text class="ftxt" x="360" y="160" text-anchor="middle">2 · PolicyBundle — ordered configcrates (secret markers)</text>

  <!-- report (agent → server, lower) -->
  <path class="flow" d="M478,190 L242,190" marker-end="url(#arr)"/>
  <text class="ftxt" x="360" y="205" text-anchor="middle">3 · ReportResult — per-resource outcomes</text>

  <!-- loop label -->
  <text class="sub" x="360" y="250" text-anchor="middle" font-style="italic">every check-in interval — pull-based, the agent always initiates</text>
</svg>
