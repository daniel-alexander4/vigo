<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 580" font-family="'JetBrains Mono','Fira Code','SF Mono',monospace">
  <defs>
    <linearGradient id="condbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e1e2e"/>
      <stop offset="100%" stop-color="#181825"/>
    </linearGradient>
    <linearGradient id="condhdr" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e3a2a"/>
      <stop offset="100%" stop-color="#1e3530"/>
    </linearGradient>
  </defs>

  <rect width="520" height="580" rx="10" fill="url(#condbg)"/>
  <rect width="520" height="36" rx="10" fill="url(#condhdr)"/>
  <rect y="26" width="520" height="10" fill="url(#condhdr)"/>
  <circle cx="16" cy="18" r="5" fill="#f38ba8"/>
  <circle cx="32" cy="18" r="5" fill="#f9e2af"/>
  <circle cx="48" cy="18" r="5" fill="#a6e3a1"/>
  <text x="66" y="22" fill="#cdd6f4" font-size="11" font-weight="700">Conditional Inheritance — danlap</text>

  <!-- Legend -->
  <rect x="24" y="48" width="472" height="22" rx="4" fill="#313244" opacity="0.5"/>
  <circle cx="40" cy="59" r="4" fill="#a6e3a1"/>
  <text x="50" y="63" fill="#9399b2" font-size="9">server-side eval</text>
  <circle cx="160" cy="59" r="4" fill="#fab387"/>
  <text x="170" y="63" fill="#9399b2" font-size="9">agent-side eval</text>
  <text x="300" y="63" fill="#6c7086" font-size="8" font-style="italic">resolved expression shown below original when vars are templated</text>

  <!-- Server-side: changed triggers -->
  <text x="24" y="92" fill="#cdd6f4" font-size="10" font-weight="700">Server-evaluated (4)</text>

  <text x="36" y="110" fill="#fab387" font-size="9">cis-ubuntu-access/restart-sshd</text>
  <text x="290" y="110" fill="#94e2d5" font-size="9">changed</text>
  <rect x="344" y="101" width="44" height="14" rx="3" fill="#a6e3a1" opacity="0.15"/>
  <text x="350" y="111" fill="#a6e3a1" font-size="9">server</text>

  <text x="36" y="126" fill="#fab387" font-size="9">cis-ubuntu-logging/reload-auditd</text>
  <text x="290" y="126" fill="#94e2d5" font-size="9">changed</text>
  <rect x="344" y="117" width="44" height="14" rx="3" fill="#a6e3a1" opacity="0.15"/>
  <text x="350" y="127" fill="#a6e3a1" font-size="9">server</text>

  <text x="36" y="142" fill="#fab387" font-size="9">cis-ubuntu-logging/restart-rsyslog</text>
  <text x="290" y="142" fill="#94e2d5" font-size="9">changed</text>
  <rect x="344" y="133" width="44" height="14" rx="3" fill="#a6e3a1" opacity="0.15"/>
  <text x="350" y="143" fill="#a6e3a1" font-size="9">server</text>

  <text x="36" y="158" fill="#fab387" font-size="9">cis-ubuntu-network/apply-sysctl</text>
  <text x="290" y="158" fill="#94e2d5" font-size="9">changed</text>
  <rect x="344" y="149" width="44" height="14" rx="3" fill="#a6e3a1" opacity="0.15"/>
  <text x="350" y="159" fill="#a6e3a1" font-size="9">server</text>

  <line x1="24" y1="172" x2="496" y2="172" stroke="#313244" stroke-width="1"/>

  <!-- Agent-side: OS conditionals -->
  <text x="24" y="192" fill="#cdd6f4" font-size="10" font-weight="700">Agent-evaluated &#x2014; OS family</text>

  <text x="36" y="210" fill="#fab387" font-size="9">diag-tools/install-netcat-debian</text>
  <text x="290" y="210" fill="#94e2d5" font-size="9">os_family('debian')</text>
  <rect x="436" y="201" width="40" height="14" rx="3" fill="#fab387" opacity="0.15"/>
  <text x="442" y="211" fill="#fab387" font-size="9">agent</text>

  <text x="36" y="226" fill="#fab387" font-size="9">diag-tools/install-netcat-rhel</text>
  <text x="290" y="226" fill="#94e2d5" font-size="9">!os_family('debian')</text>
  <rect x="436" y="217" width="40" height="14" rx="3" fill="#fab387" opacity="0.15"/>
  <text x="442" y="227" fill="#fab387" font-size="9">agent</text>

  <text x="36" y="242" fill="#fab387" font-size="9">security-scanning/trivy-repo-debian</text>
  <text x="290" y="242" fill="#94e2d5" font-size="9">os_family('debian')</text>
  <rect x="436" y="233" width="40" height="14" rx="3" fill="#fab387" opacity="0.15"/>
  <text x="442" y="243" fill="#fab387" font-size="9">agent</text>

  <text x="36" y="258" fill="#6c7086" font-size="8" font-style="italic">+ 6 more OS-conditional resources</text>

  <line x1="24" y1="272" x2="496" y2="272" stroke="#313244" stroke-width="1"/>

  <!-- Agent-side: time-window conditionals -->
  <text x="24" y="292" fill="#cdd6f4" font-size="10" font-weight="700">Agent-evaluated &#x2014; time windows</text>

  <text x="36" y="312" fill="#fab387" font-size="9">security-scanning/run-trivy</text>
  <text x="260" y="312" fill="#94e2d5" font-size="9">hour_range('6','22')</text>
  <rect x="436" y="303" width="40" height="14" rx="3" fill="#fab387" opacity="0.15"/>
  <text x="442" y="313" fill="#fab387" font-size="9">agent</text>
  <text x="260" y="326" fill="#6c7086" font-size="8">hour_range('{{ .Vars.scan_hour_start }}','{{ .Vars.scan_hour_end }}')</text>

  <text x="36" y="346" fill="#fab387" font-size="9">security-scanning/run-lynis</text>
  <text x="260" y="346" fill="#94e2d5" font-size="9">hour_range('6','22')</text>
  <rect x="436" y="337" width="40" height="14" rx="3" fill="#fab387" opacity="0.15"/>
  <text x="442" y="347" fill="#fab387" font-size="9">agent</text>

  <text x="36" y="362" fill="#fab387" font-size="9">security-scanning/run-clamscan</text>
  <text x="260" y="362" fill="#94e2d5" font-size="9">hour_range('6','22')</text>
  <rect x="436" y="353" width="40" height="14" rx="3" fill="#fab387" opacity="0.15"/>
  <text x="442" y="363" fill="#fab387" font-size="9">agent</text>

  <text x="36" y="378" fill="#6c7086" font-size="8" font-style="italic">+ 5 more time-windowed resources (aide, rkhunter, chkrootkit, freshclam, debsecan)</text>

  <!-- Summary -->
  <rect x="24" y="394" width="472" height="20" rx="4" fill="#313244" opacity="0.4"/>
  <text x="36" y="408" fill="#6c7086" font-size="9">4 server-side  &#x2022;  10 OS-conditional  &#x2022;  8 time-windowed  &#x2022;  vars resolved before agent dispatch</text>
</svg>
