<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 280" font-family="Inter, system-ui, sans-serif" font-size="13">
  <defs>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-opacity="0.12"/>
    </filter>
    <marker id="arrGreen" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#38a169"/>
    </marker>
    <marker id="arrBlue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#3182ce"/>
    </marker>
    <marker id="arrBlueBack" markerWidth="8" markerHeight="8" refX="1" refY="4" orient="auto">
      <path d="M 8 0 L 0 4 L 8 8 Z" fill="#3182ce"/>
    </marker>
    <linearGradient id="serverGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8f4fd"/>
      <stop offset="100%" stop-color="#d0e8f7"/>
    </linearGradient>
    <linearGradient id="thrallGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8fce8"/>
      <stop offset="100%" stop-color="#c8ecc8"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="280" fill="#f8f9fa" rx="8"/>

  <!-- Title -->
  <text x="300" y="26" text-anchor="middle" font-size="18" font-weight="700" fill="#1a202c">Delta Event Streaming</text>

  <!-- Actor headers -->
  <rect x="50" y="42" width="140" height="36" rx="8" fill="url(#thrallGrad)" stroke="#38a169" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="120" y="65" text-anchor="middle" font-weight="700" fill="#276749">Agent</text>

  <rect x="410" y="42" width="140" height="36" rx="8" fill="url(#serverGrad)" stroke="#3182ce" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="480" y="65" text-anchor="middle" font-weight="700" fill="#1a56a0">Server</text>

  <!-- Lifelines -->
  <line x1="120" y1="78" x2="120" y2="265" stroke="#38a169" stroke-width="2" stroke-dasharray="6,4"/>
  <line x1="480" y1="78" x2="480" y2="265" stroke="#3182ce" stroke-width="2" stroke-dasharray="6,4"/>

  <!-- Bidirectional stream indicator -->
  <rect x="170" y="85" width="260" height="20" rx="4" fill="#faf5ff" stroke="#805ad5" stroke-width="1"/>
  <text x="300" y="99" text-anchor="middle" font-size="10" fill="#553c9a" font-weight="600">Bidirectional AgentStream (gRPC mTLS)</text>

  <!-- Agent → Server: RunCompleted -->
  <line x1="125" y1="125" x2="475" y2="125" stroke="#38a169" stroke-width="2" marker-end="url(#arrGreen)"/>
  <rect x="195" y="112" width="170" height="18" rx="4" fill="#f0fff0" stroke="#9ae6b4" stroke-width="1"/>
  <text x="280" y="125" text-anchor="middle" font-size="11" fill="#276749" font-weight="600">RunCompleted</text>
  <text x="425" y="125" font-size="10" fill="#888">run results</text>

  <!-- Agent → Server: TraitsDelta -->
  <line x1="125" y1="155" x2="475" y2="155" stroke="#38a169" stroke-width="2" marker-end="url(#arrGreen)"/>
  <rect x="200" y="142" width="160" height="18" rx="4" fill="#f0fff0" stroke="#9ae6b4" stroke-width="1"/>
  <text x="280" y="155" text-anchor="middle" font-size="11" fill="#276749" font-weight="600">TraitsDelta</text>
  <text x="420" y="155" font-size="10" fill="#888">changed traits</text>

  <!-- Agent → Server: HeartbeatDelta -->
  <line x1="125" y1="185" x2="475" y2="185" stroke="#38a169" stroke-width="2" marker-end="url(#arrGreen)"/>
  <rect x="195" y="172" width="170" height="18" rx="4" fill="#f0fff0" stroke="#9ae6b4" stroke-width="1"/>
  <text x="280" y="185" text-anchor="middle" font-size="11" fill="#276749" font-weight="600">HeartbeatDelta</text>
  <text x="422" y="185" font-size="10" fill="#888">no changes</text>

  <!-- Server → Agent: DeltaAck -->
  <line x1="475" y1="215" x2="125" y2="215" stroke="#3182ce" stroke-width="2" marker-end="url(#arrBlueBack)"/>
  <rect x="220" y="202" width="120" height="18" rx="4" fill="#ebf5ff" stroke="#90cdf4" stroke-width="1"/>
  <text x="280" y="215" text-anchor="middle" font-size="11" fill="#1a56a0" font-weight="600">DeltaAck</text>
  <text x="165" y="215" font-size="10" fill="#888">confirms</text>

  <!-- Server → Agent: StreamRelease -->
  <line x1="475" y1="245" x2="125" y2="245" stroke="#3182ce" stroke-width="2" marker-end="url(#arrBlueBack)"/>
  <rect x="202" y="232" width="156" height="18" rx="4" fill="#ebf5ff" stroke="#90cdf4" stroke-width="1"/>
  <text x="280" y="245" text-anchor="middle" font-size="11" fill="#1a56a0" font-weight="600">StreamRelease</text>
  <text x="147" y="245" font-size="10" fill="#888">drop stream</text>

  <!-- Async badge -->
  <rect x="490" y="110" width="95" height="30" rx="5" fill="#fffbeb" stroke="#f6e05e" stroke-width="1"/>
  <text x="537" y="122" text-anchor="middle" font-size="10" fill="#975a16" font-weight="600">RunBatcher</text>
  <text x="537" y="134" text-anchor="middle" font-size="9" fill="#975a16">async DB writes</text>
</svg>
