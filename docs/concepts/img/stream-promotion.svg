<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 300" font-family="Inter, system-ui, sans-serif" font-size="13">
  <defs>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-opacity="0.12"/>
    </filter>
    <marker id="arrRight" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#805ad5"/>
    </marker>
    <marker id="arrBlue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#3182ce"/>
    </marker>
    <marker id="arrGreen" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#38a169"/>
    </marker>
    <linearGradient id="phaseGrad1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8fce8"/>
      <stop offset="100%" stop-color="#c8ecc8"/>
    </linearGradient>
    <linearGradient id="phaseGrad2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ebf5ff"/>
      <stop offset="100%" stop-color="#d0e8f7"/>
    </linearGradient>
    <linearGradient id="phaseGrad3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#faf5ff"/>
      <stop offset="100%" stop-color="#e9d8fd"/>
    </linearGradient>
    <linearGradient id="phaseGrad4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff3e0"/>
      <stop offset="100%" stop-color="#ffe0b2"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="750" height="300" fill="#f8f9fa" rx="8"/>

  <!-- Title -->
  <text x="375" y="28" text-anchor="middle" font-size="18" font-weight="700" fill="#1a202c">Adaptive Stream Promotion</text>

  <!-- Timeline axis -->
  <line x1="40" y1="165" x2="710" y2="165" stroke="#cbd5e0" stroke-width="2"/>

  <!-- Phase 1: Stateless Polling -->
  <rect x="40" y="60" width="145" height="85" rx="10" fill="url(#phaseGrad1)" stroke="#38a169" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="112" y="82" text-anchor="middle" font-weight="700" fill="#276749" font-size="12">Stateless Polling</text>
  <text x="112" y="100" text-anchor="middle" font-size="10" fill="#276749">Agent calls CheckIn()</text>
  <text x="112" y="114" text-anchor="middle" font-size="10" fill="#276749">periodically (unary RPC)</text>
  <text x="112" y="134" text-anchor="middle" font-size="10" fill="#888" font-style="italic">Default mode</text>

  <!-- Transition arrow 1→2 -->
  <line x1="190" y1="165" x2="220" y2="165" stroke="#805ad5" stroke-width="2" marker-end="url(#arrRight)"/>

  <!-- Phase 2: Stream Requested -->
  <rect x="225" y="60" width="145" height="85" rx="10" fill="url(#phaseGrad2)" stroke="#3182ce" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="297" y="82" text-anchor="middle" font-weight="700" fill="#1a56a0" font-size="12">Stream Requested</text>
  <text x="297" y="100" text-anchor="middle" font-size="10" fill="#1a56a0">Server has work to dispatch</text>
  <text x="297" y="114" text-anchor="middle" font-size="10" fill="#1a56a0">(task / query / workflow)</text>
  <text x="297" y="134" text-anchor="middle" font-size="10" fill="#888" font-style="italic">stream_requested=true</text>

  <!-- Transition arrow 2→3 -->
  <line x1="375" y1="165" x2="405" y2="165" stroke="#805ad5" stroke-width="2" marker-end="url(#arrRight)"/>

  <!-- Phase 3: Active Stream -->
  <rect x="410" y="60" width="145" height="85" rx="10" fill="url(#phaseGrad3)" stroke="#805ad5" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="482" y="82" text-anchor="middle" font-weight="700" fill="#553c9a" font-size="12">Active Stream</text>
  <text x="482" y="100" text-anchor="middle" font-size="10" fill="#553c9a">Bidirectional AgentStream</text>
  <text x="482" y="114" text-anchor="middle" font-size="10" fill="#553c9a">Server dispatches work,</text>
  <text x="482" y="128" text-anchor="middle" font-size="10" fill="#553c9a">results flow back</text>

  <!-- Transition arrow 3→4 -->
  <line x1="560" y1="165" x2="590" y2="165" stroke="#805ad5" stroke-width="2" marker-end="url(#arrRight)"/>

  <!-- Phase 4: Release -->
  <rect x="595" y="60" width="145" height="85" rx="10" fill="url(#phaseGrad4)" stroke="#e6a817" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="667" y="82" text-anchor="middle" font-weight="700" fill="#7b5e00" font-size="12">Stream Release</text>
  <text x="667" y="100" text-anchor="middle" font-size="10" fill="#7b5e00">Work queue empty</text>
  <text x="667" y="114" text-anchor="middle" font-size="10" fill="#7b5e00">Server sends StreamRelease</text>
  <text x="667" y="134" text-anchor="middle" font-size="10" fill="#888" font-style="italic">Back to polling</text>

  <!-- Return arrow from Phase 4 back to Phase 1 -->
  <path d="M 667 150 L 667 155 Q 667 165 657 165 L 195 165 Q 185 165 185 175 L 185 180" fill="none" stroke="#38a169" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="420" y="180" text-anchor="middle" font-size="10" fill="#38a169" font-weight="600">Returns to stateless polling</text>

  <!-- Detail boxes below timeline -->
  <rect x="40" y="200" width="200" height="42" rx="6" fill="#fff" stroke="#38a169" stroke-width="1"/>
  <text x="140" y="218" text-anchor="middle" font-size="11" fill="#276749" font-weight="600">Agent-side</text>
  <text x="140" y="234" text-anchor="middle" font-size="10" fill="#888">~0 overhead when idle</text>

  <rect x="275" y="200" width="200" height="42" rx="6" fill="#fff" stroke="#3182ce" stroke-width="1"/>
  <text x="375" y="218" text-anchor="middle" font-size="11" fill="#1a56a0" font-weight="600">Server-side</text>
  <text x="375" y="234" text-anchor="middle" font-size="10" fill="#888">Saves ~230 KiB/idle connection</text>

  <rect x="510" y="200" width="200" height="42" rx="6" fill="#fff" stroke="#805ad5" stroke-width="1"/>
  <text x="610" y="218" text-anchor="middle" font-size="11" fill="#553c9a" font-weight="600">Promotion timeout</text>
  <text x="610" y="234" text-anchor="middle" font-size="10" fill="#888">12 min (ephemeral, not persisted)</text>

  <!-- Legend -->
  <rect x="40" y="260" width="670" height="28" rx="5" fill="#fffbeb" stroke="#f6e05e" stroke-width="1"/>
  <text x="375" y="278" text-anchor="middle" font-size="11" fill="#975a16">Three-way target split: online (has stream) | promotable (recently active, no stream) | offline (stale)</text>
</svg>
