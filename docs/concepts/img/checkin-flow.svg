<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 520" font-family="Inter, system-ui, sans-serif" font-size="13">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#3182ce"/>
    </marker>
    <marker id="arrBack" markerWidth="8" markerHeight="8" refX="1" refY="4" orient="auto">
      <path d="M 8 0 L 0 4 L 8 8 Z" fill="#38a169"/>
    </marker>
  </defs>

  <rect width="700" height="520" fill="#f8f9fa" rx="8"/>
  <text x="350" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#1a202c">Check-in Flow</text>

  <!-- Agent column -->
  <rect x="60" y="50" width="160" height="40" rx="8" fill="#e8fce8" stroke="#38a169" stroke-width="1.5"/>
  <text x="140" y="75" text-anchor="middle" font-weight="700" fill="#276749">Agent (hobnob)</text>
  <line x1="140" y1="90" x2="140" y2="490" stroke="#38a169" stroke-width="2" stroke-dasharray="6,4"/>

  <!-- Server column -->
  <rect x="440" y="50" width="200" height="40" rx="8" fill="#e8f4fd" stroke="#3182ce" stroke-width="1.5"/>
  <text x="540" y="75" text-anchor="middle" font-weight="700" fill="#1a56a0">Server (hobd)</text>
  <line x1="540" y1="90" x2="540" y2="490" stroke="#3182ce" stroke-width="2" stroke-dasharray="6,4"/>

  <!-- Step 1: CheckIn -->
  <line x1="145" y1="120" x2="535" y2="120" stroke="#3182ce" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="230" y="103" width="210" height="22" rx="4" fill="#ebf5ff" stroke="#90cdf4" stroke-width="1"/>
  <text x="335" y="118" text-anchor="middle" font-size="12" fill="#1a56a0" font-weight="600">1. CheckIn(UUID, traits, fingerprint)</text>

  <!-- Steps 2-7: Server processing -->
  <rect x="555" y="135" width="130" height="160" rx="8" fill="#fff" stroke="#90cdf4" stroke-width="1"/>
  <text x="620" y="155" text-anchor="middle" font-size="11" fill="#1a56a0" font-weight="600">2. Match hostname</text>
  <text x="620" y="173" text-anchor="middle" font-size="11" fill="#1a56a0" font-weight="600">3. Resolve roles</text>
  <text x="620" y="191" text-anchor="middle" font-size="11" fill="#1a56a0" font-weight="600">4. Merge vars</text>
  <text x="620" y="209" text-anchor="middle" font-size="11" fill="#1a56a0" font-weight="600">5. Resolve secrets</text>
  <text x="620" y="227" text-anchor="middle" font-size="11" fill="#1a56a0" font-weight="600">6. Build DAG</text>
  <text x="620" y="245" text-anchor="middle" font-size="11" fill="#1a56a0" font-weight="600">7. Render templates</text>

  <text x="550" y="270" text-anchor="middle" font-size="10" fill="#888" font-style="italic">Zero DB queries</text>
  <text x="550" y="283" text-anchor="middle" font-size="10" fill="#888" font-style="italic">(FleetIndex)</text>

  <!-- Step 8: Return modules -->
  <line x1="535" y1="310" x2="145" y2="310" stroke="#38a169" stroke-width="2" marker-end="url(#arrBack)"/>
  <rect x="210" y="293" width="250" height="22" rx="4" fill="#f0fff0" stroke="#9ae6b4" stroke-width="1"/>
  <text x="335" y="308" text-anchor="middle" font-size="12" fill="#276749" font-weight="600">8. Return modules + desired state</text>

  <!-- Step 9: Apply resources -->
  <rect x="50" y="330" width="180" height="50" rx="8" fill="#fff" stroke="#38a169" stroke-width="1"/>
  <text x="140" y="352" text-anchor="middle" font-size="12" fill="#276749" font-weight="600">9. Apply resources</text>
  <text x="140" y="370" text-anchor="middle" font-size="11" fill="#888">check → act if drift</text>

  <!-- Step 10: Report -->
  <line x1="145" y1="405" x2="535" y2="405" stroke="#3182ce" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="225" y="388" width="220" height="22" rx="4" fill="#ebf5ff" stroke="#90cdf4" stroke-width="1"/>
  <text x="335" y="403" text-anchor="middle" font-size="12" fill="#1a56a0" font-weight="600">10. ReportResult(outcomes)</text>

  <!-- Step 11: Store -->
  <rect x="555" y="420" width="130" height="50" rx="8" fill="#fff" stroke="#90cdf4" stroke-width="1"/>
  <text x="620" y="442" text-anchor="middle" font-size="11" fill="#1a56a0" font-weight="600">11. Store run</text>
  <text x="620" y="458" text-anchor="middle" font-size="11" fill="#1a56a0" font-weight="600">Update compliance</text>

  <!-- Timing annotation -->
  <rect x="50" y="475" width="280" height="25" rx="5" fill="#fffbeb" stroke="#f6e05e" stroke-width="1"/>
  <text x="190" y="492" text-anchor="middle" font-size="11" fill="#975a16">Default interval: 5 min with 20% jitter</text>
</svg>
