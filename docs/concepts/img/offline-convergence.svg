<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 400" font-family="Inter, system-ui, sans-serif" font-size="13">
  <defs>
    <marker id="aG" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#38a169"/>
    </marker>
    <marker id="aR" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#e53e3e"/>
    </marker>
    <marker id="aB" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#3182ce"/>
    </marker>
  </defs>

  <rect width="650" height="400" fill="#f8f9fa" rx="8"/>
  <text x="325" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#1a202c">Offline Convergence</text>

  <!-- Agent column -->
  <rect x="50" y="50" width="140" height="36" rx="8" fill="#e8fce8" stroke="#38a169" stroke-width="1.5"/>
  <text x="120" y="73" text-anchor="middle" font-weight="700" fill="#276749">Agent</text>
  <line x1="120" y1="86" x2="120" y2="380" stroke="#38a169" stroke-width="2" stroke-dasharray="6,4"/>

  <!-- Server column -->
  <rect x="430" y="50" width="140" height="36" rx="8" fill="#e8f4fd" stroke="#3182ce" stroke-width="1.5"/>
  <text x="500" y="73" text-anchor="middle" font-weight="700" fill="#1a56a0">Server</text>
  <line x1="500" y1="86" x2="500" y2="380" stroke="#3182ce" stroke-width="2" stroke-dasharray="6,4"/>

  <!-- Step 1: Failed check-in -->
  <line x1="125" y1="115" x2="420" y2="115" stroke="#e53e3e" stroke-width="2" stroke-dasharray="8,4"/>
  <text x="380" y="110" font-size="20" fill="#e53e3e" font-weight="700">✕</text>
  <text x="300" y="108" text-anchor="middle" font-size="11" fill="#e53e3e" font-weight="600">CheckIn — server unreachable</text>

  <!-- Step 2: Use cached bundle -->
  <rect x="30" y="135" width="180" height="48" rx="8" fill="#fff" stroke="#38a169" stroke-width="1"/>
  <text x="120" y="155" text-anchor="middle" font-size="11" fill="#276749" font-weight="600">Use cached policy bundle</text>
  <text x="120" y="172" text-anchor="middle" font-size="10" fill="#888">ED25519-verified, from LMDB</text>

  <!-- Step 3: Apply locally -->
  <rect x="30" y="195" width="180" height="40" rx="8" fill="#f0fff0" stroke="#9ae6b4" stroke-width="1"/>
  <text x="120" y="215" text-anchor="middle" font-size="11" fill="#276749" font-weight="600">Apply resources locally</text>
  <text x="120" y="228" text-anchor="middle" font-size="10" fill="#888">check → act if drift</text>

  <!-- Step 4: Queue results -->
  <rect x="30" y="248" width="180" height="40" rx="8" fill="#fffbeb" stroke="#f6e05e" stroke-width="1"/>
  <text x="120" y="268" text-anchor="middle" font-size="11" fill="#975a16" font-weight="600">Queue results in LMDB</text>
  <text x="120" y="281" text-anchor="middle" font-size="10" fill="#888">pending results queue</text>

  <!-- Server down indicator -->
  <rect x="450" y="135" width="100" height="155" rx="8" fill="#fff5f5" stroke="#feb2b2" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="500" y="215" text-anchor="middle" font-size="12" fill="#c53030" font-weight="600">Server</text>
  <text x="500" y="232" text-anchor="middle" font-size="12" fill="#c53030" font-weight="600">offline</text>

  <!-- Separator -->
  <line x1="20" y1="310" x2="630" y2="310" stroke="#cbd5e0" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="325" y="327" text-anchor="middle" font-size="11" fill="#888" font-style="italic">... server comes back online ...</text>

  <!-- Step 5: Drain results -->
  <line x1="125" y1="350" x2="495" y2="350" stroke="#3182ce" stroke-width="2" marker-end="url(#aB)"/>
  <rect x="195" y="336" width="230" height="22" rx="4" fill="#ebf5ff" stroke="#90cdf4" stroke-width="1"/>
  <text x="310" y="351" text-anchor="middle" font-size="11" fill="#1a56a0" font-weight="600">Drain pending results → resume normal</text>

  <!-- Step 6: Normal -->
  <line x1="125" y1="375" x2="495" y2="375" stroke="#38a169" stroke-width="2" marker-end="url(#aG)"/>
  <text x="310" y="390" text-anchor="middle" font-size="10" fill="#276749">Normal check-in resumes</text>
</svg>
