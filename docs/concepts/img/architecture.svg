<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 620" font-family="Inter, system-ui, sans-serif" font-size="13">
  <defs>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-opacity="0.12"/>
    </filter>
    <linearGradient id="serverGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8f4fd"/>
      <stop offset="100%" stop-color="#d0e8f7"/>
    </linearGradient>
    <linearGradient id="thrallGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8fce8"/>
      <stop offset="100%" stop-color="#c8ecc8"/>
    </linearGradient>
    <linearGradient id="cliGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff3e0"/>
      <stop offset="100%" stop-color="#ffe0b2"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="620" fill="#f8f9fa" rx="8"/>

  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#1a202c">Hobnob Architecture</text>

  <!-- CLI Box -->
  <rect x="30" y="50" width="200" height="90" rx="10" fill="url(#cliGrad)" stroke="#e6a817" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="130" y="75" text-anchor="middle" font-weight="700" fill="#7b5e00" font-size="14">Admin Workstation</text>
  <rect x="55" y="88" width="150" height="36" rx="6" fill="#fff" stroke="#e6a817" stroke-width="1"/>
  <text x="130" y="110" text-anchor="middle" font-weight="600" fill="#7b5e00">hobnobcli</text>
  <text x="130" y="123" text-anchor="middle" font-size="10" fill="#999">Go CLI</text>

  <!-- Arrow: CLI → Server -->
  <line x1="230" y1="95" x2="298" y2="95" stroke="#e6a817" stroke-width="2" marker-end="url(#arrowOrange)"/>
  <text x="264" y="88" text-anchor="middle" font-size="10" fill="#7b5e00">REST</text>
  <text x="264" y="100" text-anchor="middle" font-size="10" fill="#7b5e00">:8181</text>

  <!-- Server Box -->
  <rect x="300" y="50" width="470" height="320" rx="12" fill="url(#serverGrad)" stroke="#3182ce" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="535" y="75" text-anchor="middle" font-weight="700" fill="#1a56a0" font-size="15">hobd — Server (Go)</text>

  <!-- Server internal: gRPC -->
  <rect x="320" y="90" width="130" height="55" rx="8" fill="#fff" stroke="#3182ce" stroke-width="1"/>
  <text x="385" y="112" text-anchor="middle" font-weight="600" fill="#1a56a0">gRPC</text>
  <text x="385" y="127" text-anchor="middle" font-size="11" fill="#666">:1530 (mTLS)</text>

  <!-- Server internal: REST API -->
  <rect x="465" y="90" width="130" height="55" rx="8" fill="#fff" stroke="#3182ce" stroke-width="1"/>
  <text x="530" y="112" text-anchor="middle" font-weight="600" fill="#1a56a0">REST API</text>
  <text x="530" y="127" text-anchor="middle" font-size="11" fill="#666">:8181</text>

  <!-- Server internal: Web UI -->
  <rect x="610" y="90" width="130" height="55" rx="8" fill="#fff" stroke="#3182ce" stroke-width="1"/>
  <text x="675" y="112" text-anchor="middle" font-weight="600" fill="#1a56a0">Web UI</text>
  <text x="675" y="127" text-anchor="middle" font-size="11" fill="#666">HTMX :8181</text>

  <!-- Server internal: middle tier -->
  <rect x="320" y="160" width="420" height="45" rx="8" fill="#ebf5ff" stroke="#90cdf4" stroke-width="1"/>
  <text x="385" y="186" text-anchor="middle" font-weight="600" fill="#2a69ac" font-size="12">FleetIndex</text>
  <line x1="460" y1="168" x2="460" y2="198" stroke="#90cdf4" stroke-width="1"/>
  <text x="530" y="186" text-anchor="middle" font-weight="600" fill="#2a69ac" font-size="12">ConfigStore</text>
  <line x1="600" y1="168" x2="600" y2="198" stroke="#90cdf4" stroke-width="1"/>
  <text x="665" y="186" text-anchor="middle" font-weight="600" fill="#2a69ac" font-size="12">RunStore</text>

  <!-- Server internal: bottom tier -->
  <rect x="320" y="220" width="130" height="50" rx="8" fill="#fff" stroke="#90cdf4" stroke-width="1"/>
  <text x="385" y="242" text-anchor="middle" font-weight="600" fill="#2a69ac" font-size="12">SQLite</text>
  <text x="385" y="258" text-anchor="middle" font-size="10" fill="#888">WAL mode</text>

  <rect x="465" y="220" width="130" height="50" rx="8" fill="#fff" stroke="#90cdf4" stroke-width="1"/>
  <text x="530" y="242" text-anchor="middle" font-weight="600" fill="#2a69ac" font-size="12">Secrets</text>
  <text x="530" y="258" text-anchor="middle" font-size="10" fill="#888">local / isopass</text>

  <rect x="610" y="220" width="130" height="50" rx="8" fill="#fff" stroke="#90cdf4" stroke-width="1"/>
  <text x="675" y="242" text-anchor="middle" font-weight="600" fill="#2a69ac" font-size="12">YAML Config</text>
  <text x="675" y="258" text-anchor="middle" font-size="10" fill="#888">fsnotify reload</text>

  <!-- Server internal: extras row -->
  <rect x="320" y="285" width="100" height="35" rx="6" fill="#f0f7ff" stroke="#90cdf4" stroke-width="1"/>
  <text x="370" y="307" text-anchor="middle" font-size="11" fill="#2a69ac">Prometheus</text>

  <rect x="430" y="285" width="100" height="35" rx="6" fill="#f0f7ff" stroke="#90cdf4" stroke-width="1"/>
  <text x="480" y="307" text-anchor="middle" font-size="11" fill="#2a69ac">Webhooks</text>

  <rect x="540" y="285" width="100" height="35" rx="6" fill="#f0f7ff" stroke="#90cdf4" stroke-width="1"/>
  <text x="590" y="307" text-anchor="middle" font-size="11" fill="#2a69ac">Federation</text>

  <rect x="650" y="285" width="100" height="35" rx="6" fill="#f0f7ff" stroke="#90cdf4" stroke-width="1"/>
  <text x="700" y="307" text-anchor="middle" font-size="11" fill="#2a69ac">AI Assistant</text>

  <!-- Thrall boxes -->
  <rect x="80" y="420" width="260" height="170" rx="10" fill="url(#thrallGrad)" stroke="#38a169" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="210" y="445" text-anchor="middle" font-weight="700" fill="#276749" font-size="14">Thrall (Managed Node)</text>

  <rect x="105" y="458" width="210" height="36" rx="6" fill="#fff" stroke="#38a169" stroke-width="1"/>
  <text x="210" y="478" text-anchor="middle" font-weight="600" fill="#276749">hobnob</text>
  <text x="210" y="490" text-anchor="middle" font-size="10" fill="#999">Rust agent, ~5 MB static</text>

  <rect x="105" y="502" width="100" height="30" rx="5" fill="#f0fff0" stroke="#9ae6b4" stroke-width="1"/>
  <text x="155" y="521" text-anchor="middle" font-size="11" fill="#276749">59 Executors</text>

  <rect x="215" y="502" width="100" height="30" rx="5" fill="#f0fff0" stroke="#9ae6b4" stroke-width="1"/>
  <text x="265" y="521" text-anchor="middle" font-size="11" fill="#276749">27 Traits</text>

  <rect x="105" y="540" width="210" height="30" rx="5" fill="#f0fff0" stroke="#9ae6b4" stroke-width="1"/>
  <text x="210" y="559" text-anchor="middle" font-size="11" fill="#276749">LMDB State Store (offline convergence)</text>

  <!-- Second thrall (abbreviated) -->
  <rect x="460" y="420" width="260" height="170" rx="10" fill="url(#thrallGrad)" stroke="#38a169" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="590" y="445" text-anchor="middle" font-weight="700" fill="#276749" font-size="14">Thrall (Managed Node)</text>

  <rect x="485" y="458" width="210" height="36" rx="6" fill="#fff" stroke="#38a169" stroke-width="1"/>
  <text x="590" y="478" text-anchor="middle" font-weight="600" fill="#276749">hobnob</text>
  <text x="590" y="490" text-anchor="middle" font-size="10" fill="#999">Rust agent, ~5 MB static</text>

  <rect x="485" y="502" width="100" height="30" rx="5" fill="#f0fff0" stroke="#9ae6b4" stroke-width="1"/>
  <text x="535" y="521" text-anchor="middle" font-size="11" fill="#276749">59 Executors</text>

  <rect x="595" y="502" width="100" height="30" rx="5" fill="#f0fff0" stroke="#9ae6b4" stroke-width="1"/>
  <text x="645" y="521" text-anchor="middle" font-size="11" fill="#276749">27 Traits</text>

  <rect x="485" y="540" width="210" height="30" rx="5" fill="#f0fff0" stroke="#9ae6b4" stroke-width="1"/>
  <text x="590" y="559" text-anchor="middle" font-size="11" fill="#276749">LMDB State Store (offline convergence)</text>

  <!-- Ellipsis between thralls -->
  <text x="400" y="510" text-anchor="middle" font-size="24" fill="#888">...</text>

  <!-- Arrows: Thralls → Server (gRPC) -->
  <path d="M 210 420 L 210 395 Q 210 380 225 380 L 370 380 L 370 370" fill="none" stroke="#38a169" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <path d="M 590 420 L 590 395 Q 590 380 575 380 L 400 380 L 400 370" fill="none" stroke="#38a169" stroke-width="2" marker-end="url(#arrowGreen)"/>

  <text x="285" y="393" text-anchor="middle" font-size="10" fill="#276749" font-weight="600">gRPC mTLS :1530</text>
  <text x="500" y="393" text-anchor="middle" font-size="10" fill="#276749" font-weight="600">gRPC mTLS :1530</text>

  <!-- Arrow markers -->
  <defs>
    <marker id="arrowGreen" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#38a169"/>
    </marker>
    <marker id="arrowOrange" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#e6a817"/>
    </marker>
  </defs>

  <!-- Platform badges -->
  <text x="400" y="610" text-anchor="middle" font-size="11" fill="#888">Linux | macOS | FreeBSD | OpenBSD | NetBSD | illumos | Windows</text>
</svg>
