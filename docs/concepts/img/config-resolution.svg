<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 320" font-family="Inter, system-ui, sans-serif" font-size="13">
  <defs>
    <marker id="arrBlue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#3182ce"/>
    </marker>
    <marker id="arrPurple" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#805ad5"/>
    </marker>
  </defs>

  <rect width="750" height="320" fill="#f8f9fa" rx="8"/>
  <text x="375" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#1a202c">Config Resolution</text>

  <!-- envoys.vgo -->
  <rect x="30" y="55" width="190" height="120" rx="10" fill="#fff3e0" stroke="#e6a817" stroke-width="1.5"/>
  <text x="125" y="78" text-anchor="middle" font-weight="700" fill="#7b5e00" font-size="13">envoys.vgo</text>
  <text x="45" y="100" font-size="11" fill="#555" font-family="monospace">match: "web*"</text>
  <text x="45" y="116" font-size="11" fill="#555" font-family="monospace">roles: [web]</text>
  <text x="45" y="132" font-size="11" fill="#555" font-family="monospace">vars:</text>
  <text x="45" y="148" font-size="11" fill="#805ad5" font-family="monospace">  port: 8080</text>
  <text x="125" y="168" text-anchor="middle" font-size="10" fill="#999">First match wins</text>

  <!-- Arrow → roles -->
  <line x1="220" y1="100" x2="278" y2="100" stroke="#3182ce" stroke-width="2" marker-end="url(#arrBlue)"/>
  <text x="249" y="93" text-anchor="middle" font-size="10" fill="#3182ce" font-weight="600">roles</text>

  <!-- roles/*.vgo -->
  <rect x="280" y="55" width="170" height="105" rx="10" fill="#ebf5ff" stroke="#3182ce" stroke-width="1.5"/>
  <text x="365" y="78" text-anchor="middle" font-weight="700" fill="#1a56a0" font-size="13">roles/*.vgo</text>
  <text x="295" y="100" font-size="11" fill="#555" font-family="monospace">name: web</text>
  <text x="295" y="116" font-size="11" fill="#555" font-family="monospace">modules:</text>
  <text x="295" y="132" font-size="11" fill="#555" font-family="monospace">  - nginx</text>
  <text x="295" y="148" font-size="11" fill="#555" font-family="monospace">  - logrotate</text>

  <!-- Arrow → modules -->
  <line x1="450" y1="100" x2="508" y2="100" stroke="#3182ce" stroke-width="2" marker-end="url(#arrBlue)"/>
  <text x="479" y="93" text-anchor="middle" font-size="10" fill="#3182ce" font-weight="600">modules</text>

  <!-- modules/*.vgo -->
  <rect x="510" y="55" width="210" height="120" rx="10" fill="#e8fce8" stroke="#38a169" stroke-width="1.5"/>
  <text x="615" y="78" text-anchor="middle" font-weight="700" fill="#276749" font-size="13">modules/*.vgo</text>
  <text x="525" y="100" font-size="11" fill="#555" font-family="monospace">name: nginx</text>
  <text x="525" y="116" font-size="11" fill="#555" font-family="monospace">vars:</text>
  <text x="525" y="132" font-size="11" fill="#805ad5" font-family="monospace">  port: 80</text>
  <text x="525" y="148" font-size="11" fill="#555" font-family="monospace">resources:</text>
  <text x="525" y="164" font-size="11" fill="#555" font-family="monospace">  - package, file, service</text>

  <!-- Variable override section -->
  <rect x="100" y="210" width="550" height="90" rx="10" fill="#faf5ff" stroke="#805ad5" stroke-width="1.5"/>
  <text x="375" y="235" text-anchor="middle" font-weight="700" fill="#553c9a" font-size="14">Variable Precedence (three levels only)</text>

  <!-- Three boxes inside -->
  <rect x="120" y="248" width="140" height="36" rx="6" fill="#e8fce8" stroke="#38a169" stroke-width="1"/>
  <text x="190" y="262" text-anchor="middle" font-size="11" fill="#276749" font-weight="600">Module default</text>
  <text x="190" y="278" text-anchor="middle" font-size="12" fill="#805ad5" font-family="monospace">port: 80</text>

  <text x="280" y="270" text-anchor="middle" font-size="16" fill="#805ad5" font-weight="700">→</text>

  <rect x="300" y="248" width="140" height="36" rx="6" fill="#ebf5ff" stroke="#3182ce" stroke-width="1"/>
  <text x="370" y="262" text-anchor="middle" font-size="11" fill="#1a56a0" font-weight="600">Role vars</text>
  <text x="370" y="278" text-anchor="middle" font-size="12" fill="#888" font-family="monospace">(if set)</text>

  <text x="460" y="270" text-anchor="middle" font-size="16" fill="#805ad5" font-weight="700">→</text>

  <rect x="480" y="248" width="150" height="36" rx="6" fill="#fff3e0" stroke="#e6a817" stroke-width="1.5"/>
  <text x="555" y="262" text-anchor="middle" font-size="11" fill="#7b5e00" font-weight="700">Node override</text>
  <text x="555" y="278" text-anchor="middle" font-size="12" fill="#805ad5" font-family="monospace" font-weight="700">port: 8080 ✓</text>
</svg>
