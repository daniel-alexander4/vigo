<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 550" font-family="Inter, system-ui, sans-serif" font-size="13">
  <defs>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-opacity="0.12"/>
    </filter>
    <marker id="arrBlue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#3182ce"/>
    </marker>
    <marker id="arrGreenBack" markerWidth="8" markerHeight="8" refX="1" refY="4" orient="auto">
      <path d="M 8 0 L 0 4 L 8 8 Z" fill="#38a169"/>
    </marker>
    <linearGradient id="serverGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8f4fd"/>
      <stop offset="100%" stop-color="#d0e8f7"/>
    </linearGradient>
    <linearGradient id="envoyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8fce8"/>
      <stop offset="100%" stop-color="#c8ecc8"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="750" height="550" fill="#f8f9fa" rx="8"/>

  <!-- Title -->
  <text x="375" y="28" text-anchor="middle" font-size="18" font-weight="700" fill="#1a202c">Check-in Lifecycle</text>

  <!-- Actor headers -->
  <rect x="55" y="48" width="160" height="36" rx="8" fill="url(#envoyGrad)" stroke="#38a169" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="135" y="71" text-anchor="middle" font-weight="700" fill="#276749">Agent (vigo)</text>

  <rect x="490" y="48" width="200" height="36" rx="8" fill="url(#serverGrad)" stroke="#3182ce" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="590" y="71" text-anchor="middle" font-weight="700" fill="#1a56a0">Server (vigosrv)</text>

  <!-- Lifelines -->
  <line x1="135" y1="84" x2="135" y2="520" stroke="#38a169" stroke-width="2" stroke-dasharray="6,4"/>
  <line x1="590" y1="84" x2="590" y2="520" stroke="#3182ce" stroke-width="2" stroke-dasharray="6,4"/>

  <!-- Step 1: Collect traits (agent local) -->
  <rect x="30" y="100" width="210" height="32" rx="6" fill="#fff" stroke="#38a169" stroke-width="1"/>
  <text x="135" y="121" text-anchor="middle" font-size="12" fill="#276749" font-weight="600">1. Collect traits (25+ collectors)</text>

  <!-- Step 2: CheckIn RPC -->
  <line x1="140" y1="155" x2="585" y2="155" stroke="#3182ce" stroke-width="2" marker-end="url(#arrBlue)"/>
  <rect x="215" y="138" width="250" height="22" rx="4" fill="#ebf5ff" stroke="#90cdf4" stroke-width="1"/>
  <text x="340" y="153" text-anchor="middle" font-size="12" fill="#1a56a0" font-weight="600">2. CheckIn(UUID, traits, fingerprint)</text>

  <!-- Steps 3-8: Server processing block -->
  <rect x="510" y="175" width="215" height="155" rx="8" fill="#fff" stroke="#90cdf4" stroke-width="1"/>
  <text x="617" y="195" text-anchor="middle" font-size="11" fill="#1a56a0" font-weight="600">3. FleetIndex lookup</text>
  <line x1="520" y1="202" x2="715" y2="202" stroke="#e8f4fd" stroke-width="1"/>
  <text x="617" y="217" text-anchor="middle" font-size="11" fill="#1a56a0" font-weight="600">4. Match hostname (first wins)</text>
  <line x1="520" y1="224" x2="715" y2="224" stroke="#e8f4fd" stroke-width="1"/>
  <text x="617" y="239" text-anchor="middle" font-size="11" fill="#1a56a0" font-weight="600">5. Resolve roles + modules</text>
  <line x1="520" y1="246" x2="715" y2="246" stroke="#e8f4fd" stroke-width="1"/>
  <text x="617" y="261" text-anchor="middle" font-size="11" fill="#1a56a0" font-weight="600">6. Merge vars, resolve secrets</text>
  <line x1="520" y1="268" x2="715" y2="268" stroke="#e8f4fd" stroke-width="1"/>
  <text x="617" y="283" text-anchor="middle" font-size="11" fill="#1a56a0" font-weight="600">7. Build module DAG</text>
  <line x1="520" y1="290" x2="715" y2="290" stroke="#e8f4fd" stroke-width="1"/>
  <text x="617" y="305" text-anchor="middle" font-size="11" fill="#1a56a0" font-weight="600">8. Render templates</text>

  <!-- Zero DB annotation -->
  <rect x="510" y="335" width="215" height="20" rx="4" fill="#fffbeb" stroke="#f6e05e" stroke-width="1"/>
  <text x="617" y="349" text-anchor="middle" font-size="10" fill="#975a16" font-weight="600">Zero DB queries (FleetIndex in-memory)</text>

  <!-- Step 9: Return modules -->
  <line x1="585" y1="375" x2="140" y2="375" stroke="#38a169" stroke-width="2" marker-end="url(#arrGreenBack)"/>
  <rect x="200" y="358" width="280" height="22" rx="4" fill="#f0fff0" stroke="#9ae6b4" stroke-width="1"/>
  <text x="340" y="373" text-anchor="middle" font-size="12" fill="#276749" font-weight="600">9. Modules + desired state (or no_change)</text>

  <!-- Step 10: Apply resources (agent local) -->
  <rect x="20" y="395" width="230" height="42" rx="8" fill="#fff" stroke="#38a169" stroke-width="1"/>
  <text x="135" y="413" text-anchor="middle" font-size="12" fill="#276749" font-weight="600">10. Apply resources idempotently</text>
  <text x="135" y="429" text-anchor="middle" font-size="10" fill="#888">check state, act if drift, notify/subscribes</text>

  <!-- Step 11: Report results -->
  <line x1="140" y1="458" x2="585" y2="458" stroke="#3182ce" stroke-width="2" marker-end="url(#arrBlue)"/>
  <rect x="225" y="441" width="230" height="22" rx="4" fill="#ebf5ff" stroke="#90cdf4" stroke-width="1"/>
  <text x="340" y="456" text-anchor="middle" font-size="12" fill="#1a56a0" font-weight="600">11. ReportResult(per-resource outcomes)</text>

  <!-- Step 12: Server stores + compliance -->
  <rect x="510" y="470" width="215" height="32" rx="6" fill="#fff" stroke="#90cdf4" stroke-width="1"/>
  <text x="617" y="490" text-anchor="middle" font-size="11" fill="#1a56a0" font-weight="600">12. Store run, update compliance</text>

  <!-- Sleep annotation -->
  <rect x="20" y="512" width="280" height="25" rx="5" fill="#fffbeb" stroke="#f6e05e" stroke-width="1"/>
  <text x="160" y="529" text-anchor="middle" font-size="11" fill="#975a16">Agent sleeps (default 5 min + 20% jitter), then repeats from step 1</text>
</svg>
