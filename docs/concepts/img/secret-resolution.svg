<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 250" font-family="Inter, system-ui, -apple-system, sans-serif">
  <defs>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-opacity="0.12"/>
    </filter>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8f9fa"/>
      <stop offset="100%" stop-color="#edf2f7"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9f7aea"/>
      <stop offset="100%" stop-color="#805ad5"/>
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f6c948"/>
      <stop offset="100%" stop-color="#e6a817"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#48bb78"/>
      <stop offset="100%" stop-color="#38a169"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4299e1"/>
      <stop offset="100%" stop-color="#3182ce"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#805ad5"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#38a169"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="700" height="250" rx="8" fill="url(#bgGrad)"/>

  <!-- Title -->
  <text x="350" y="24" text-anchor="middle" font-size="14" font-weight="700" fill="#2d3748">Secret Resolution Flow</text>

  <!-- Left: server.yaml config box -->
  <rect x="20" y="60" width="145" height="100" rx="10" fill="#fff" stroke="#e6a817" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="20" y="60" width="145" height="26" rx="10" fill="url(#orangeGrad)"/>
  <rect x="20" y="76" width="145" height="10" fill="url(#orangeGrad)"/>
  <text x="92" y="78" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">server.yaml</text>
  <text x="32" y="104" font-size="8.5" fill="#4a5568" font-family="monospace">dsn:</text>
  <text x="32" y="118" font-size="7.5" fill="#805ad5" font-family="monospace">"secret:hobnob/db/dsn"</text>
  <text x="32" y="140" font-size="8.5" fill="#4a5568" font-family="monospace">api_key:</text>
  <text x="32" y="154" font-size="7.5" fill="#805ad5" font-family="monospace">"secret:hobnob/api/key"</text>

  <!-- Arrow: config to provider -->
  <line x1="165" y1="110" x2="215" y2="110" stroke="#805ad5" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="190" y="103" text-anchor="middle" font-size="7" fill="#805ad5">resolve</text>

  <!-- Middle: Secrets Provider box with two backends -->
  <rect x="215" y="42" width="240" height="170" rx="10" fill="#fff" stroke="#805ad5" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="215" y="42" width="240" height="28" rx="10" fill="url(#purpleGrad)"/>
  <rect x="215" y="60" width="240" height="10" fill="url(#purpleGrad)"/>
  <text x="335" y="62" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">Secrets Provider</text>

  <!-- Backend 1: local -->
  <rect x="230" y="82" width="210" height="48" rx="7" fill="#f0e6ff" stroke="#805ad5" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="240" y="97" font-size="9" font-weight="600" fill="#553c9a">local (default)</text>
  <text x="240" y="112" font-size="7.5" fill="#4a5568" font-family="monospace">AES-256-GCM encrypted files</text>
  <text x="240" y="123" font-size="7" fill="#718096" font-family="monospace">/srv/hobnob/secrets/hobnob/db/dsn</text>

  <!-- Backend 2: isopass -->
  <rect x="230" y="140" width="210" height="48" rx="7" fill="#f0e6ff" stroke="#805ad5" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="240" y="155" font-size="9" font-weight="600" fill="#553c9a">isopass (prod)</text>
  <text x="240" y="170" font-size="7.5" fill="#4a5568" font-family="monospace">HTTP GET to external API</text>
  <text x="240" y="181" font-size="7" fill="#718096" font-family="monospace">isopass.example.com/v1/secrets/...</text>

  <!-- "or" label between backends -->
  <text x="335" y="137" text-anchor="middle" font-size="8" font-weight="600" fill="#805ad5">-- or --</text>

  <!-- Arrow: provider to resolved value -->
  <line x1="455" y1="110" x2="505" y2="110" stroke="#38a169" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
  <text x="480" y="103" text-anchor="middle" font-size="7" fill="#38a169">value</text>

  <!-- Right: Resolved value box -->
  <rect x="505" y="60" width="175" height="100" rx="10" fill="#fff" stroke="#38a169" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="505" y="60" width="175" height="26" rx="10" fill="url(#greenGrad)"/>
  <rect x="505" y="76" width="175" height="10" fill="url(#greenGrad)"/>
  <text x="592" y="78" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">Resolved Value</text>
  <text x="517" y="104" font-size="8.5" fill="#4a5568">Wrapped in</text>
  <text x="517" y="118" font-size="9" font-weight="600" fill="#38a169" font-family="monospace">SecretString</text>
  <text x="517" y="138" font-size="8.5" fill="#4a5568">Prints as:</text>
  <text x="517" y="152" font-size="9" font-weight="600" fill="#e53e3e" font-family="monospace">[REDACTED]</text>

  <!-- Bottom note -->
  <text x="350" y="236" text-anchor="middle" font-size="8" fill="#718096">If secrets provider is unreachable or misconfigured, the server fails fast -- never falls back to insecure defaults.</text>
</svg>
