<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 200" font-family="Inter, system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="yellowSeg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f6e05e"/>
      <stop offset="100%" stop-color="#ecc94b"/>
    </linearGradient>
    <linearGradient id="orangeSeg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f6ad55"/>
      <stop offset="100%" stop-color="#dd6b20"/>
    </linearGradient>
    <linearGradient id="redSeg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fc8181"/>
      <stop offset="100%" stop-color="#e53e3e"/>
    </linearGradient>
    <filter id="tsh" x="-2%" y="-4%" width="104%" height="116%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="700" height="200" fill="#f8f9fa" rx="4"/>

  <!-- Title -->
  <text x="350" y="24" text-anchor="middle" font-size="14" font-weight="600" fill="#2d3748">License Enforcement Timeline</text>

  <!-- Timeline base line -->
  <line x1="40" y1="90" x2="660" y2="90" stroke="#e2e8f0" stroke-width="3" stroke-linecap="round"/>

  <!-- Grace Period segment (Day 0 - Day 15) -->
  <rect x="40" y="60" width="280" height="60" rx="8" fill="url(#yellowSeg)" filter="url(#tsh)"/>
  <text x="180" y="82" text-anchor="middle" font-size="12" font-weight="700" fill="#744210">Grace Period</text>
  <text x="180" y="96" text-anchor="middle" font-size="9" fill="#744210" opacity="0.85">Days 0 - 15</text>
  <text x="180" y="110" text-anchor="middle" font-size="8" fill="#744210" opacity="0.75">Warnings on check-in</text>

  <!-- Enrollment Block segment (Day 15 - Day 30) -->
  <rect x="325" y="60" width="220" height="60" rx="8" fill="url(#orangeSeg)" filter="url(#tsh)"/>
  <text x="435" y="82" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">Enrollment Block</text>
  <text x="435" y="96" text-anchor="middle" font-size="9" fill="#fff" opacity="0.9">Days 15 - 30</text>
  <text x="435" y="110" text-anchor="middle" font-size="8" fill="#fff" opacity="0.8">New enrollments rejected</text>

  <!-- Service Stop marker (Day 30) -->
  <rect x="550" y="60" width="110" height="60" rx="8" fill="url(#redSeg)" filter="url(#tsh)"/>
  <text x="605" y="82" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">Service Stop</text>
  <text x="605" y="96" text-anchor="middle" font-size="9" fill="#fff" opacity="0.9">Day 30</text>
  <text x="605" y="110" text-anchor="middle" font-size="8" fill="#fff" opacity="0.8">Server shuts down</text>

  <!-- Day markers -->
  <text x="40" y="140" text-anchor="middle" font-size="10" font-weight="600" fill="#4a5568">Day 0</text>
  <line x1="40" y1="120" x2="40" y2="130" stroke="#4a5568" stroke-width="1.5"/>

  <text x="320" y="140" text-anchor="middle" font-size="10" font-weight="600" fill="#4a5568">Day 15</text>
  <line x1="320" y1="120" x2="320" y2="130" stroke="#4a5568" stroke-width="1.5"/>

  <text x="550" y="140" text-anchor="middle" font-size="10" font-weight="600" fill="#4a5568">Day 30</text>
  <line x1="550" y1="120" x2="550" y2="130" stroke="#4a5568" stroke-width="1.5"/>

  <!-- Annotations -->
  <text x="180" y="156" text-anchor="middle" font-size="8" fill="#38a169">New enrollments: OK</text>
  <text x="180" y="166" text-anchor="middle" font-size="8" fill="#38a169">Existing thralls: OK</text>

  <text x="435" y="156" text-anchor="middle" font-size="8" fill="#e53e3e">New enrollments: REJECTED</text>
  <text x="435" y="166" text-anchor="middle" font-size="8" fill="#38a169">Existing thralls: OK</text>

  <!-- Bottom note -->
  <rect x="140" y="180" width="420" height="16" rx="4" fill="#ebf8ff"/>
  <text x="350" y="192" text-anchor="middle" font-size="9" fill="#2b6cb0" font-weight="600">Grace clock resets immediately when returning to compliance</text>
</svg>