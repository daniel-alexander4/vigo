# Vigo Prometheus alerting rules.
#
# Loads as a Prometheus rules file — either drop into prometheus.yml's
# `rule_files:` list, or import via the Grafana Alertmanager → Alert rules UI.
#
# Sized to "what an operator actually pages on," not exhaustive. Every alert
# references a metric exported by the Vigo server's /metrics endpoint
# (vigo_*). Thresholds are starting points; tune to your fleet size and
# tolerance.
#
# All metrics referenced here are defined in server/metrics/registry.go.

groups:
  - name: vigo-convergence
    rules:
      - alert: VigoConvergenceFailing
        expr: vigo_convergence_failed > 0
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "{{ $value }} envoy(s) in failed convergence state"
          description: "Envoys reporting >=80% configcrate failures or blocked status for the past 10 minutes. Check /envoys and the per-envoy run history."

      - alert: VigoConvergenceDegraded
        expr: vigo_convergence_degraded > 0
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "{{ $value }} envoy(s) degraded (1-79% configcrate failures)"
          description: "Partial failures persisting >30 minutes. Open /envoys to identify which configcrates are intermittently failing."

      - alert: VigoConvergenceDiverged
        expr: vigo_convergence_diverged > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "{{ $value }} envoy(s) showing persistent drift"
          description: "Envoys whose last 5+ runs all made changes — configcrates are non-idempotent or external state is fighting Vigo. Check /envoys, look for env-specific or trait-dependent configcrate bugs."

      - alert: VigoEnvoysOffline
        expr: vigo_convergence_offline > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "{{ $value }} envoy(s) past the staleness threshold"
          description: "Envoys haven't checked in within 2.5× their configured/observed cadence. Either host is down, network is partitioned, or the agent crashed."

  - name: vigo-runs
    rules:
      - alert: VigoRunDurationP95High
        expr: histogram_quantile(0.95, sum by (le) (rate(vigo_run_duration_seconds_bucket[5m]))) > 120
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Fleet-wide run p95 duration > 120s for the past 10 minutes"
          description: "Agents are taking longer than expected to converge. Investigate slow configcrates (long-running exec resources, package operations, network-bound fetches)."

  - name: vigo-security
    rules:
      - alert: VigoSigVerifyFailures
        expr: increase(vigo_sig_verify_failed_total[5m]) > 0
        labels:
          severity: critical
        annotations:
          summary: "Signature verification failures: {{ $labels.reason }}"
          description: "An agent presented a request whose ed25519 signature did not verify against the stored pubkey. Investigate — this is either a corrupted client, a replay attempt, or a key-rotation gap."

      - alert: VigoSecurityCVECritical
        expr: vigo_security_cve_critical > 0
        for: 1h
        labels:
          severity: critical
        annotations:
          summary: "{{ $value }} critical CVE(s) across the fleet"
          description: "At least one envoy has a critical CVE outstanding for >1 hour. Open /security to identify affected hosts."

  - name: vigo-operability
    rules:
      - alert: VigoConfigReloadErrors
        expr: increase(vigo_config_reload_errors_total[15m]) > 0
        labels:
          severity: warning
        annotations:
          summary: "Config reload failed in the past 15 minutes"
          description: "Most recent `vigocli config publish` produced a load error. Check server logs for the schema/parse error; the last good stack is still live."

      - alert: VigoSecretResolutionErrors
        expr: increase(vigo_secret_resolution_errors_total[5m]) > 0
        labels:
          severity: critical
        annotations:
          summary: "Secret resolution failures in the past 5 minutes"
          description: "A configured secret reference failed to resolve. Either the secrets backend is unreachable or a path was removed. Check the secrets provider health."

      - alert: VigoConfigReloadDurationP99High
        expr: histogram_quantile(0.99, sum by (le) (rate(vigo_config_reload_duration_seconds_bucket[10m]))) > 2.5
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Config reload p99 > 2.5s"
          description: "Publish + reload is getting slow. Stockpile may have grown — check configcrate count and inheritance depth."

  - name: vigo-license
    rules:
      - alert: VigoLicenseEnforcementErrors
        expr: increase(vigo_license_enforcement_errors_total[5m]) > 0
        labels:
          severity: critical
        annotations:
          summary: "License enforcement is failing closed"
          description: "The enforcement gate could not count active envoys (fleet index missing, count unavailable). New enrollments are being rejected until this clears."

      - alert: VigoLicenseDaysRemainingLow
        expr: vigo_license_days_remaining < 14 and vigo_license_days_remaining >= 0
        labels:
          severity: warning
        annotations:
          summary: "License expires in {{ $value }} day(s)"
          description: "Renew before expiry to avoid grace → enrollment block → service stop progression."

      - alert: VigoLicenseStageNonCompliant
        expr: vigo_license_stage > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "License stage = {{ $value }} (0=compliant, 1=grace, 2=enrollment_block, 3=service_stop)"
          description: "Past the compliant stage. Resolve the license condition before service_stop is reached."

  - name: vigo-swarm
    rules:
      - alert: VigoSpannerBoltsRevokedHigh
        expr: vigo_spanner_bolts_revoked > vigo_spanner_bolts_active
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Revoked bolts ({{ $value }}) outnumber active bolts in spanner"
          description: "Roster gossip is carrying more tombstones than live bolts — either expected after a rotation, or someone evicted a peer that's still trying to gossip in."

  - name: vigo-bursts
    # Publish-burst alerts: every rule pairs with a panel on the
    # vigo-bursts.json Grafana dashboard. Thresholds are starting points
    # tuned for a small home-lab fleet — multiply for production fleets.
    rules:
      - alert: VigoBurstSustainedRPCRate
        expr: sum(rate(vigo_grpc_requests_total[1m])) > 2000
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Sustained gRPC rate {{ $value | printf \"%.0f\" }} req/s for >5m"
          description: "vigosrv is serving a high rate beyond a brief burst window. Confirm capacity headroom; if `vigo_grpc_checkin_in_flight` climbs alongside, you're approaching the cascading-overload regime."

      - alert: VigoBurstTLSHandshakeSpike
        expr: sum(rate(vigo_grpc_tls_handshakes_total[1m])) > 200
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "TLS handshake rate {{ $value | printf \"%.0f\" }} /s (>200) for >2m"
          description: "Sustained handshake churn after a publish burst points at subchannel reconnects under spike pressure — agents dialing simultaneously, or session-resume failing. Cross-check the burst dashboard's status split."

      - alert: VigoBurstSigVerifyFailures
        expr: rate(vigo_sig_verify_failed_total[1m]) > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Signature verification failing ({{ $value | printf \"%.2f\" }}/s)"
          description: "Any sustained sig-verify failure is suspicious — could be a misconfigured agent pubkey, a stale enrolment that needs revoking, or an attempted spoof. Inspect /audit for `auth.*` events around this time."

      - alert: VigoBurstInFlightCheckInHighWater
        expr: vigo_grpc_checkin_in_flight > 1000
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "{{ $value }} concurrent CheckIns in flight for >2m"
          description: "Queue depth past the high-water mark — leading edge of cascading overload. Investigate offered load vs server capacity; if a publish triggered this, the wave is still catching up."

      - alert: VigoBurstConvergeP95OverSLO
        expr: histogram_quantile(0.95, sum by (le) (rate(vigo_publish_convergence_seconds_bucket[10m]))) > 300
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Publish→converge p95 {{ $value | printf \"%.0f\" }}s (>5m SLO) for >10m"
          description: "95% of envoys are taking longer than the 5-minute SLO to apply a published config version. If this tracks your check-in interval, convergence latency is cadence-bound — shorten the interval or accept the floor. Otherwise look for a slow configcrate, a degraded subset, or capacity pressure on the wave. Threshold is a starting point — set it to your own publish-to-converge SLO."
