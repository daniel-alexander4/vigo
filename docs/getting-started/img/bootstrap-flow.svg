<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 450" font-family="Inter, system-ui, sans-serif" font-size="13">
  <defs>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-opacity="0.12"/>
    </filter>
    <marker id="arrOrange" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#e6a817"/>
    </marker>
    <marker id="arrBlue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#3182ce"/>
    </marker>
    <marker id="arrGreen" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#38a169"/>
    </marker>
    <marker id="arrBlueBack" markerWidth="8" markerHeight="8" refX="1" refY="4" orient="auto">
      <path d="M 8 0 L 0 4 L 8 8 Z" fill="#3182ce"/>
    </marker>
    <marker id="arrGreenBack" markerWidth="8" markerHeight="8" refX="1" refY="4" orient="auto">
      <path d="M 8 0 L 0 4 L 8 8 Z" fill="#38a169"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="750" height="450" fill="#f8f9fa" rx="8"/>

  <!-- Title -->
  <text x="375" y="28" text-anchor="middle" font-size="18" font-weight="700" fill="#1a202c">Bootstrap Enrollment Flow</text>

  <!-- Actor headers -->
  <rect x="40" y="48" width="130" height="36" rx="8" fill="#fff3e0" stroke="#e6a817" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="105" y="71" text-anchor="middle" font-weight="700" fill="#7b5e00">Admin</text>

  <rect x="290" y="48" width="170" height="36" rx="8" fill="#e8f4fd" stroke="#3182ce" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="375" y="71" text-anchor="middle" font-weight="700" fill="#1a56a0">Server (vigosrv)</text>

  <rect x="560" y="48" width="150" height="36" rx="8" fill="#e8fce8" stroke="#38a169" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="635" y="71" text-anchor="middle" font-weight="700" fill="#276749">New Envoy</text>

  <!-- Lifelines -->
  <line x1="105" y1="84" x2="105" y2="430" stroke="#e6a817" stroke-width="2" stroke-dasharray="6,4"/>
  <line x1="375" y1="84" x2="375" y2="430" stroke="#3182ce" stroke-width="2" stroke-dasharray="6,4"/>
  <line x1="635" y1="84" x2="635" y2="430" stroke="#38a169" stroke-width="2" stroke-dasharray="6,4"/>

  <!-- Step 1: Generate token -->
  <line x1="110" y1="115" x2="370" y2="115" stroke="#e6a817" stroke-width="2" marker-end="url(#arrOrange)"/>
  <rect x="140" y="98" width="200" height="22" rx="4" fill="#fff3e0" stroke="#e6a817" stroke-width="1"/>
  <text x="240" y="113" text-anchor="middle" font-size="11" fill="#7b5e00" font-weight="600">1. vigocli tokens generate</text>
  <text x="240" y="132" text-anchor="middle" font-size="10" fill="#999">--pattern "*.web.example.com"</text>

  <!-- Step 2: curl bootstrap -->
  <line x1="630" y1="160" x2="380" y2="160" stroke="#38a169" stroke-width="2" marker-end="url(#arrBlueBack)"/>
  <rect x="420" y="143" width="200" height="22" rx="4" fill="#f0fff0" stroke="#9ae6b4" stroke-width="1"/>
  <text x="520" y="158" text-anchor="middle" font-size="11" fill="#276749" font-weight="600">2. curl bootstrap script :8443</text>

  <!-- Step 3: Return script -->
  <line x1="380" y1="190" x2="630" y2="190" stroke="#3182ce" stroke-width="2" marker-end="url(#arrGreen)"/>
  <rect x="400" y="173" width="220" height="22" rx="4" fill="#ebf5ff" stroke="#90cdf4" stroke-width="1"/>
  <text x="510" y="188" text-anchor="middle" font-size="11" fill="#1a56a0" font-weight="600">3. Shell script + binary download URL</text>

  <!-- Step 4: Agent setup (local action on envoy) -->
  <rect x="555" y="210" width="160" height="52" rx="8" fill="#fff" stroke="#38a169" stroke-width="1"/>
  <text x="635" y="228" text-anchor="middle" font-size="11" fill="#276749" font-weight="600">4. Download agent binary</text>
  <text x="635" y="244" text-anchor="middle" font-size="11" fill="#276749" font-weight="600">Generate ED25519 keypair</text>
  <text x="635" y="256" text-anchor="middle" font-size="10" fill="#888">+ TLS CSR</text>

  <!-- Step 5: Register RPC -->
  <line x1="630" y1="285" x2="380" y2="285" stroke="#38a169" stroke-width="2" marker-end="url(#arrBlueBack)"/>
  <rect x="395" y="268" width="228" height="22" rx="4" fill="#f0fff0" stroke="#9ae6b4" stroke-width="1"/>
  <text x="509" y="283" text-anchor="middle" font-size="11" fill="#276749" font-weight="600">5. Register(hostname, IP, pubkey, token)</text>

  <!-- Step 6: Server validation + response -->
  <rect x="285" y="300" width="180" height="42" rx="8" fill="#fff" stroke="#3182ce" stroke-width="1"/>
  <text x="375" y="318" text-anchor="middle" font-size="11" fill="#1a56a0" font-weight="600">6. Validate token + pattern</text>
  <text x="375" y="333" text-anchor="middle" font-size="11" fill="#1a56a0" font-weight="600">Sign CSR, assign UUID</text>

  <line x1="380" y1="355" x2="630" y2="355" stroke="#3182ce" stroke-width="2" marker-end="url(#arrGreen)"/>
  <rect x="415" y="338" width="200" height="22" rx="4" fill="#ebf5ff" stroke="#90cdf4" stroke-width="1"/>
  <text x="515" y="353" text-anchor="middle" font-size="11" fill="#1a56a0" font-weight="600">UUID + signed TLS certificate</text>

  <!-- Step 7: Install service -->
  <rect x="555" y="370" width="160" height="42" rx="8" fill="#fff" stroke="#38a169" stroke-width="1"/>
  <text x="635" y="388" text-anchor="middle" font-size="11" fill="#276749" font-weight="600">7. Install system service</text>
  <text x="635" y="403" text-anchor="middle" font-size="10" fill="#888">Verify first check-in</text>

  <!-- mTLS badge -->
  <rect x="40" y="415" width="230" height="25" rx="5" fill="#fffbeb" stroke="#f6e05e" stroke-width="1"/>
  <text x="155" y="432" text-anchor="middle" font-size="11" fill="#975a16">All gRPC traffic uses mTLS from step 5 onward</text>
</svg>
