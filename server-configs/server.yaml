secrets:
  backend: static
  env_file: "server-configs/.env"

server:
  grpc_listen: ":9090"
  api_listen: ":8080"
  tls:
    cert_file: "secret:hobnob/tls/cert"
    key_file: "secret:hobnob/tls/key"
    ca_file: "secret:hobnob/tls/ca"

database:
  dsn: "secret:hobnob/db/dsn"

checkin:
  base_interval: "30m"
  jitter_percent: 20

webhooks:
  timeout: "10s"
  max_retries: 3

watcher:
  enabled: true
  poll_interval: "5m"
