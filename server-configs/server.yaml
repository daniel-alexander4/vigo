secrets:
  backend: static
  env_file: ".env"

server:
  grpc_listen: ":1530"
  api_listen: ":8181"
  tls:
    cert_file: "secret:hobnob/tls/cert"
    key_file: "secret:hobnob/tls/key"
    ca_file: "secret:hobnob/tls/ca"
    ca_key_file: "secret:hobnob/tls/ca_key"  # enables CSR signing for bootstrap

database:
  dsn: "secret:hobnob/db/dsn"

checkin:
  base_interval: "5m"
  jitter_percent: 20

webhooks:
  timeout: "10s"
  max_retries: 3

watcher:
  enabled: true
  poll_interval: "5m"

# Federation settings for hub-spoke scaling.
# Omit (or set role: standalone) for single-server deployments.
# federation:
#   role: standalone       # standalone (default), hub, spoke
#   spoke_id: ""           # required when role=spoke (e.g. "dc1")
#   hub_addr: ""           # hub gRPC address (for spoke→hub communication)
#   spokes:                # required when role=hub
#     - id: dc1
#       addr: spoke1.example.com:1530
#     - id: dc2
#       addr: spoke2.example.com:1530

# Bootstrap enrollment settings.
# trusted_enrollment patterns allow nodes to enroll without a token.
# CIDRs restrict which source IPs can use each pattern.
# SMTP email notifications.
# Disabled when host is empty. Events default to all if omitted.
# smtp:
#   host: smtp.example.com
#   port: 587
#   from: hobnob@example.com
#   username: hobnob
#   password: "secret:hobnob/smtp/password"
#   tls: true
#   recipients:
#     - admin@example.com
#   events:                     # omit to enable all
#     - thrall.enrolled         # new thrall registered
#     - run.success             # convergence run succeeded
#     - run.failure             # convergence run failed
#     - drift.detected          # config drift corrected
#     - secret.rotated          # secret version bumped, thralls re-queued
#     - config.reload.failure   # YAML config reload error
#     - thrall.stale            # thrall missed check-in window

bootstrap:
  cert_validity: "8760h"  # 1 year
  # Accept any hostname from RFC 1918 / loopback private IP space.
  # Tighten patterns and CIDRs for production.
  trusted_enrollment:
    - pattern: "*"
      cidrs: ["192.168.0.0/16", "127.0.0.0/8", "172.16.0.0/12", "10.0.0.0/8"]
