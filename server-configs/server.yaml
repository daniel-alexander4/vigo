# Secrets backend. Options: "static" (default) or "isopass".
# Static reads from a .env file. Isopass connects to an isopass API instance.
secrets:
  backend: static
  env_file: ".env"
# secrets:
#   backend: isopass
#   url: https://localhost:8443
#   token_env: HOBNOB_SECRETS_TOKEN   # env var containing bearer token
#   tls_skip_verify: true             # skip TLS cert verification (e.g. self-signed)

server:
  grpc_listen: ":1530"
  api_listen: ":8181"
  tls:
    cert_file: "secret:hobnob/tls/cert"
    key_file: "secret:hobnob/tls/key"
    ca_file: "secret:hobnob/tls/ca"
    ca_key_file: "secret:hobnob/tls/ca_key"  # enables CSR signing for bootstrap

database:
  dsn: "secret:hobnob/db/dsn"

checkin:
  base_interval: "5m"
  jitter_percent: 20

webhooks:
  timeout: "10s"
  max_retries: 3

watcher:
  enabled: true
  poll_interval: "5m"

# Federation settings for hub-spoke scaling.
# Omit (or set role: standalone) for single-server deployments.
# federation:
#   role: standalone       # standalone (default), hub, spoke
#   spoke_id: ""           # required when role=spoke (e.g. "dc1")
#   hub_addr: ""           # hub gRPC address (for spoke→hub communication)
#   spokes:                # required when role=hub
#     - id: dc1
#       addr: spoke1.example.com:1530
#     - id: dc2
#       addr: spoke2.example.com:1530

# Bootstrap enrollment settings.
# trusted_enrollment patterns allow nodes to enroll without a token.
# CIDRs restrict which source IPs can use each pattern.
# SMTP email notifications.
# Disabled when host is empty. Omit events to enable all with default recipients.
# Per-event recipient overrides and digest batching are optional.
# smtp:
#   host: smtp.example.com
#   port: 587
#   from: hobnob@example.com
#   username: hobnob
#   password: "secret:hobnob/smtp/password"
#   tls: true
#   recipients:                           # default recipients for all events
#     - admin@example.com
#   events:                               # omit to enable all with default recipients
#     thrall.enrolled: {}                 # new thrall registered
#     run.success: {}                     # convergence run succeeded
#     run.failure:                        # convergence run failed
#       recipients: [ops@example.com]     #   override recipients for this event
#     drift.detected: {}                  # config drift corrected
#     secret.rotated: {}                  # secret version bumped, thralls re-queued
#     config.reload.failure: {}           # YAML config reload error
#     thrall.stale: {}                    # thrall missed check-in window
#     compliance.threshold:               # compliance % dropped below threshold
#       threshold: 90
#   digest:                               # batch low-priority events into summaries
#     interval: "1h"                      # flush interval (e.g. "1h", "30m")
#     events:                             # events routed to digest instead of immediate
#       - run.success
#       - drift.detected

# AI assistant. Disabled by default. Uses Ollama (free, local) as the default
# LLM backend. Paid providers (claude, openai) require an API key.
# ai:
#   enabled: true
#   provider: ollama               # ollama | claude | openai | openai-compat
#   model: "qwen2.5:7b"           # provider-specific model name
#   max_tokens: 4096
#   base_url: ""                   # auto for ollama; required for openai-compat
#   api_key: ""                    # "secret:hobnob/ai/api_key" for paid providers
#   rate_limit: 30                 # requests/minute (0 = unlimited)
#   max_tool_rounds: 10            # max tool-use iterations per request
#   context_mode: auto             # tools | prefetch | auto

bootstrap:
  cert_validity: "8760h"  # 1 year
  # Accept any hostname from RFC 1918 / loopback private IP space.
  # Tighten patterns and CIDRs for production.
  trusted_enrollment:
    - pattern: "*"
      cidrs: ["192.168.0.0/16", "127.0.0.0/8", "172.16.0.0/12", "10.0.0.0/8"]
