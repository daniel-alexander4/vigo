# ╔═══════════════════════════════════════════════════════════════════════════╗
# ║  Hobnob Server Configuration                                           ║
# ║  See server.yaml.example for all options with descriptions.            ║
# ╚═══════════════════════════════════════════════════════════════════════════╝


# ── Server ────────────────────────────────────────────────────────────────

server:
  grpc_listen: ":1530"
  api_listen: ":8181"
  tls:
    cert_file: "tls/cert"
    key_file: "tls/key"
    ca_file: "tls/ca"
    ca_key_file: "tls/ca_key"


# ── Database ──────────────────────────────────────────────────────────────

database:
  dsn: "secret:hobnob/db/dsn"
  # driver: postgres
  # retention: "90d"


# ── Secrets ───────────────────────────────────────────────────────────────

secrets:
  backend: local


# ── Check-in ──────────────────────────────────────────────────────────────

checkin:
  interval: "5m"
  jitter_percent: 20


# ── Bootstrap ─────────────────────────────────────────────────────────────

bootstrap:
  cert_validity: "8760h"
  trusted_enrollment:
    - pattern: "*"
      cidrs: ["192.168.0.0/16", "127.0.0.0/8", "172.16.0.0/12", "10.0.0.0/8"]


# ── Webhooks ──────────────────────────────────────────────────────────────

webhooks:
  timeout: "10s"
  max_retries: 3


# ── Secret Rotation Watcher ──────────────────────────────────────────────

watcher:
  enabled: true
  poll_interval: "5m"


# ── Optional: uncomment to enable ────────────────────────────────────────
#
# See server.yaml.example for full documentation on each section:
#   auth, federation, smtp, ai, backup, export, tuning, rate_limit, maintenance
