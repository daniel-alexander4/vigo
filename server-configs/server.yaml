# ╔═══════════════════════════════════════════════════════════════════════════╗
# ║  Hobnob Server Configuration                                           ║
# ║  See server.yaml.example for all options with descriptions.            ║
# ╚═══════════════════════════════════════════════════════════════════════════╝


# ── Server ────────────────────────────────────────────────────────────────

server:
  grpc_listen: ":1530"
  api_listen: ":8181"
  tls:
    cert_file: "tls/cert"
    key_file: "tls/key"
    ca_file: "tls/ca"
    ca_key_file: "tls/ca_key"


# ── Database ──────────────────────────────────────────────────────────────
# To use Postgres: set driver: postgres, and in .env set
#   HOBNOB_SERVICES=postgres

database:
  dsn: "secret:hobnob/db/dsn"
  # driver: postgres
  # retention: "90d"


# ── Secrets ───────────────────────────────────────────────────────────────

secrets:
  backend: local


# ── Check-in ──────────────────────────────────────────────────────────────

checkin:
  interval: "5m"
  jitter_percent: 20


# ── Bootstrap ─────────────────────────────────────────────────────────────
# Tighten trusted_enrollment patterns and CIDRs for production.

bootstrap:
  cert_validity: "8760h"
  trusted_enrollment:
    - pattern: "*"
      cidrs: ["192.168.0.0/16", "127.0.0.0/8", "172.16.0.0/12", "10.0.0.0/8"]


# ── Webhooks ──────────────────────────────────────────────────────────────

webhooks:
  timeout: "10s"
  max_retries: 3


# ── Secret Rotation Watcher ──────────────────────────────────────────────

watcher:
  enabled: true
  poll_interval: "5m"


# ── Authentication ────────────────────────────────────────────────────────
# auth:
#   method: none                               # none | oidc | isowebauth

# ── SMTP Notifications ───────────────────────────────────────────────────
# Requires an SMTP relay. Store password with:
#   hobnobcli secrets set hobnob/smtp/password "your-password"
#
# smtp:
#   host: "smtp.example.com"
#   port: 587
#   from: "hobnob@example.com"
#   username: "hobnob"
#   password: "secret:hobnob/smtp/password"
#   tls: true
#   recipients:
#     - "admin@example.com"

# ── Federation ────────────────────────────────────────────────────────────
# Requires a paid license. See server.yaml.example for hub/spoke setup.
#
# federation:
#   role: standalone                           # standalone | hub | spoke

# ── AI Assistant ──────────────────────────────────────────────────────────
# Also set HOBNOB_SERVICES=ollama in .env to start the Ollama container.
# For Claude or OpenAI, store the API key with:
#   hobnobcli secrets set hobnob/ai/api_key "sk-..."
#
# ai:
#   enabled: true
#   provider: "ollama"                         # ollama | claude | openai | openai-compat
#   model: "qwen2.5:7b"
#   max_tokens: 4096
#   base_url: "http://hobnob-ollama:11434"     # Docker: use container name. Bare-metal: http://localhost:11434
#   # api_key: "secret:hobnob/ai/api_key"     # for paid providers

# ── Backup (Litestream — SQLite only) ────────────────────────────────────
# Requires S3-compatible storage. Store credentials with:
#   hobnobcli secrets set hobnob/backup/aws_access_key "AKIA..."
#   hobnobcli secrets set hobnob/backup/aws_secret_key "..."
#
# backup:
#   url: "s3://my-bucket/hobnob"
#   access_key_id: "secret:hobnob/backup/aws_access_key"
#   secret_access_key: "secret:hobnob/backup/aws_secret_key"

# ── Compliance Export ─────────────────────────────────────────────────────
# export:
#   siem: false
#   cmdb: false
#   oscal: false

# ── Rate Limiting ─────────────────────────────────────────────────────────
# rate_limit:
