name: set-password
description: Change a user's password via chpasswd. Password is resolved from the secrets backend.

vars:
  username: ""
  new_password: ""

resources:
  - name: change-password
    type: exec
    command: chpasswd
    stdin: "{{ .Vars.username }}:{{ .Vars.new_password }}"
    onlyif: "id {{ .Vars.username }}"
