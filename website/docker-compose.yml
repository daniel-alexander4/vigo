services:
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    env_file:
      - website.env
    restart: unless-stopped
    depends_on:
      - website

  website:
    build:
      context: ..
      dockerfile: website/Dockerfile
    expose:
      - "8080"
    volumes:
      - website-data:/data
    env_file:
      - website.env
    restart: unless-stopped

volumes:
  caddy-data:
  caddy-config:
  website-data:
