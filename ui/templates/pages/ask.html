{{define "page-content"}}
<div class="chat-container">
    <div class="chat-messages" id="chat-messages">
        <div class="chat-welcome">
            <h2>Ask Hobnob AI</h2>
            <p>Ask questions about your fleet — diagnostics, config authoring, compliance, impact analysis.</p>
            <div class="chat-suggestions">
                <button class="chat-suggestion" onclick="askSuggestion(this)">How many thralls do I have?</button>
                <button class="chat-suggestion" onclick="askSuggestion(this)">Which thralls are failing?</button>
                <button class="chat-suggestion" onclick="askSuggestion(this)">Show me the compliance summary</button>
            </div>
        </div>
    </div>
    <form class="chat-input-form" id="chat-form" onsubmit="return handleSubmit(event)">
        <div class="chat-input-wrapper">
            <textarea class="chat-input" id="chat-input" placeholder="Ask a question..." rows="1"
                onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();handleSubmit(event)}"></textarea>
            <button class="chat-send" type="submit" id="chat-send">Send</button>
        </div>
    </form>
</div>

<script>
(function() {
    const messages = document.getElementById('chat-messages');
    const input = document.getElementById('chat-input');
    const sendBtn = document.getElementById('chat-send');
    const history = [];
    let busy = false;

    window.askSuggestion = function(btn) {
        input.value = btn.textContent;
        handleSubmit(new Event('submit'));
    };

    window.handleSubmit = function(e) {
        e.preventDefault();
        const q = input.value.trim();
        if (!q || busy) return false;

        // Remove welcome on first message.
        const welcome = messages.querySelector('.chat-welcome');
        if (welcome) welcome.remove();

        addMessage('user', q);
        history.push({role: 'user', content: q});
        input.value = '';
        autoResize();
        busy = true;
        sendBtn.disabled = true;

        const assistantEl = addMessage('assistant', '');
        const contentEl = assistantEl.querySelector('.chat-msg-content');
        const statusEl = document.createElement('div');
        statusEl.className = 'chat-status';
        statusEl.textContent = 'Thinking...';
        contentEl.appendChild(statusEl);
        scrollToBottom();

        fetch('/ui/ask', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({question: q, history: history.slice(0, -1)})
        }).then(function(resp) {
            if (!resp.ok) throw new Error('Request failed: ' + resp.status);
            const reader = resp.body.getReader();
            const decoder = new TextDecoder();
            let buffer = '';

            function read() {
                return reader.read().then(function(result) {
                    if (result.done) { finish(''); return; }
                    buffer += decoder.decode(result.value, {stream: true});
                    const lines = buffer.split('\n');
                    buffer = lines.pop();
                    for (let i = 0; i < lines.length; i++) {
                        const line = lines[i];
                        if (line.startsWith('data: ')) {
                            try {
                                const ev = JSON.parse(line.slice(6));
                                handleEvent(ev, contentEl, statusEl);
                            } catch(e) {}
                        }
                    }
                    return read();
                });
            }
            return read();
        }).catch(function(err) {
            statusEl.remove();
            contentEl.innerHTML = '<p class="chat-error">Error: ' + err.message + '</p>';
            finish('');
        });

        return false;
    };

    function handleEvent(ev, contentEl, statusEl) {
        switch (ev.type) {
        case 'status':
            if (ev.tools && ev.tools.length) {
                statusEl.textContent = 'Querying: ' + ev.tools.join(', ') + '...';
            }
            break;
        case 'delta':
            statusEl.remove();
            contentEl.innerHTML = ev.html;
            scrollToBottom();
            break;
        case 'done':
            if (ev.raw_answer) {
                history.push({role: 'assistant', content: ev.raw_answer});
            }
            if (ev.tools_used && ev.tools_used.length) {
                const meta = document.createElement('div');
                meta.className = 'chat-meta';
                meta.textContent = ev.tools_used.length + ' tool' + (ev.tools_used.length > 1 ? 's' : '') +
                    ' used \u00b7 ' + (ev.tokens_used || 0) + ' tokens';
                contentEl.parentElement.appendChild(meta);
            }
            finish('');
            break;
        case 'error':
            statusEl.remove();
            contentEl.innerHTML = '<p class="chat-error">Error: ' + ev.text + '</p>';
            finish('');
            break;
        }
    }

    function finish() {
        busy = false;
        sendBtn.disabled = false;
        input.focus();
        scrollToBottom();
    }

    function addMessage(role, text) {
        const el = document.createElement('div');
        el.className = 'chat-msg chat-msg--' + role;
        const bubble = document.createElement('div');
        bubble.className = 'chat-bubble chat-bubble--' + role;
        if (role === 'user') {
            const label = document.createElement('div');
            label.className = 'chat-msg-label';
            label.textContent = 'You';
            bubble.appendChild(label);
        }
        const content = document.createElement('div');
        content.className = 'chat-msg-content';
        if (text) content.textContent = text;
        bubble.appendChild(content);
        el.appendChild(bubble);
        messages.appendChild(el);
        scrollToBottom();
        return el;
    }

    function scrollToBottom() {
        messages.scrollTop = messages.scrollHeight;
    }

    function autoResize() {
        input.style.height = 'auto';
        input.style.height = Math.min(input.scrollHeight, 120) + 'px';
    }
    input.addEventListener('input', autoResize);
})();
</script>
{{end}}
