{{define "page-content"}}
<div class="chat-container">
    <div class="chat-messages" id="chat-messages">
        <div class="chat-welcome">
            <h2>Ask Hobnob AI</h2>
            <p>Ask questions about your fleet — diagnostics, config authoring, compliance, impact analysis.</p>
            <div class="chat-suggestions">
                <button class="chat-suggestion" onclick="askSuggestion(this)">How many thralls do I have?</button>
                <button class="chat-suggestion" onclick="askSuggestion(this)">Which thralls are failing?</button>
                <button class="chat-suggestion" onclick="askSuggestion(this)">Show me the compliance summary</button>
            </div>
        </div>
    </div>
    <form class="chat-input-form" id="chat-form" onsubmit="return handleSubmit(event)">
        <div class="chat-input-wrapper">
            <textarea class="chat-input" id="chat-input" placeholder="Ask a question..." rows="1"
                onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();handleSubmit(event)}"></textarea>
            <button class="chat-send" type="submit" id="chat-send">Send</button>
        </div>
    </form>
</div>

<script src="/static/js/ask.js"></script>
{{end}}
