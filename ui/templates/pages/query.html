{{define "page-content"}}
<div class="page-header">
    <h1>Live Query</h1>
    <p>Query trait values from connected thralls in real time</p>
</div>

<form class="query-form mb-2" id="query-form" hx-boost="false" onsubmit="return submitQuery(event)">
    <div class="query-inputs">
        <div class="form-group">
            <label for="trait-path">Trait Path <span class="hint-trigger" tabindex="0">?<div class="hint-popup">
                <div class="hint-popup__title">Available Trait Paths</div>
                <div class="hint-popup__group">
                    <div class="hint-popup__heading">OS &amp; Identity</div>
                    <div class="hint-popup__item"><code>os.family</code> debian, redhat, suse, ...</div>
                    <div class="hint-popup__item"><code>os.distro</code> ubuntu, centos, fedora, ...</div>
                    <div class="hint-popup__item"><code>os.version</code> 22.04, 9, 40, ...</div>
                    <div class="hint-popup__item"><code>os.kernel</code> 6.8.0-101-generic</div>
                    <div class="hint-popup__item"><code>os.arch</code> x86_64, aarch64</div>
                    <div class="hint-popup__item"><code>identity.user</code> root, deploy, ...</div>
                    <div class="hint-popup__item"><code>identity.privileged</code> true / false</div>
                </div>
                <div class="hint-popup__group">
                    <div class="hint-popup__heading">Hardware &amp; Processors</div>
                    <div class="hint-popup__item"><code>hardware.cpu_count</code> logical CPU count</div>
                    <div class="hint-popup__item"><code>hardware.memory_mb</code> total RAM in MB</div>
                    <div class="hint-popup__item"><code>processors.model</code> CPU model string</div>
                    <div class="hint-popup__item"><code>processors.cores</code> physical core count</div>
                    <div class="hint-popup__item"><code>processors.vendor</code> GenuineIntel, ...</div>
                </div>
                <div class="hint-popup__group">
                    <div class="hint-popup__heading">Network</div>
                    <div class="hint-popup__item"><code>network.hostname</code> short hostname</div>
                    <div class="hint-popup__item"><code>network.fqdn</code> fully qualified name</div>
                    <div class="hint-popup__item"><code>network.ip_addresses</code> all IPs</div>
                    <div class="hint-popup__item"><code>network.mac_addresses</code> all MACs</div>
                </div>
                <div class="hint-popup__group">
                    <div class="hint-popup__heading">Memory &amp; Storage</div>
                    <div class="hint-popup__item"><code>memory.total</code> total bytes</div>
                    <div class="hint-popup__item"><code>memory.available</code> available bytes</div>
                    <div class="hint-popup__item"><code>memory.percent</code> usage percentage</div>
                    <div class="hint-popup__item"><code>swap.count</code> swap device count</div>
                    <div class="hint-popup__item"><code>mountpoints</code> per-mount details</div>
                </div>
                <div class="hint-popup__group">
                    <div class="hint-popup__heading">System</div>
                    <div class="hint-popup__item"><code>uptime.seconds</code> seconds since boot</div>
                    <div class="hint-popup__item"><code>loadavg.load1</code> 1-min load average</div>
                    <div class="hint-popup__item"><code>loadavg.load5</code> 5-min load average</div>
                    <div class="hint-popup__item"><code>timezone</code> system timezone</div>
                    <div class="hint-popup__item"><code>cloud.provider</code> aws, gcp, azure, ...</div>
                </div>
                <div class="hint-popup__group">
                    <div class="hint-popup__heading">Software</div>
                    <div class="hint-popup__item"><code>packages.installed</code> package versions</div>
                    <div class="hint-popup__item"><code>docker.installed</code> true / false</div>
                    <div class="hint-popup__item"><code>docker.version</code> Docker version</div>
                    <div class="hint-popup__item"><code>docker.running_count</code> container count</div>
                </div>
                <div class="hint-popup__group">
                    <div class="hint-popup__heading">Time</div>
                    <div class="hint-popup__item"><code>time.hour</code> current hour (0-23)</div>
                    <div class="hint-popup__item"><code>time.weekday</code> monday, tuesday, ...</div>
                    <div class="hint-popup__item"><code>time.date</code> YYYY-MM-DD</div>
                    <div class="hint-popup__item"><code>time.clock</code> HH:MM:SS</div>
                </div>
            </div></span></label>
            <input type="text" id="trait-path" class="form-input" placeholder="os.distro" required>
        </div>
        <div class="form-group">
            <label for="target-spec">Target <span class="hint-trigger" tabindex="0">?<div class="hint-popup">
                <div class="hint-popup__title">Target Formats</div>
                <div class="hint-popup__group">
                    <div class="hint-popup__heading">Hostname Glob</div>
                    <div class="hint-popup__item"><code>*</code> all thralls</div>
                    <div class="hint-popup__item"><code>*.web.*</code> web tier hosts</div>
                    <div class="hint-popup__item"><code>db-*</code> database hosts</div>
                    <div class="hint-popup__item"><code>web-0[1-3]</code> web-01 through web-03</div>
                    <div class="hint-popup__item"><code>prod-??.us-east</code> single-char wildcard</div>
                </div>
                <div class="hint-popup__group">
                    <div class="hint-popup__heading">Trait Filter</div>
                    <div class="hint-popup__item"><code>os.family=debian</code> Debian-family hosts</div>
                    <div class="hint-popup__item"><code>os.distro=ubuntu</code> Ubuntu hosts only</div>
                    <div class="hint-popup__item"><code>cloud.provider=aws</code> AWS instances</div>
                    <div class="hint-popup__item"><code>docker.installed=true</code> Docker hosts</div>
                </div>
                <div class="hint-popup__group">
                    <div class="hint-popup__heading">Exact Hostname</div>
                    <div class="hint-popup__item"><code>web01</code> single host by name</div>
                </div>
                <div class="hint-popup__group">
                    <div class="hint-popup__heading">UUID</div>
                    <div class="hint-popup__item"><code>550e8400-e29b-...</code> single host by ID</div>
                </div>
            </div></span></label>
            <input type="text" id="target-spec" class="form-input" placeholder="*.web.* or os.family=debian" required>
        </div>
        <div class="form-group">
            <label for="query-timeout">Timeout (s)</label>
            <input type="number" id="query-timeout" class="form-input" value="10" min="1" max="60">
        </div>
        <div class="form-group form-group--btn">
            <button type="submit" class="btn btn--primary" id="query-btn">Query</button>
        </div>
    </div>
</form>

<div id="query-results" style="display:none;">
    <div class="stat-cards mb-2" id="query-stats"></div>
    <div class="table-container" id="query-table"></div>
</div>

<script>
function submitQuery(e) {
    e.preventDefault();
    var btn = document.getElementById('query-btn');
    btn.disabled = true;
    btn.textContent = 'Querying...';

    var traitPath = document.getElementById('trait-path').value;
    var target = document.getElementById('target-spec').value;
    var timeout = parseInt(document.getElementById('query-timeout').value) || 10;

    fetch('/api/v1/query', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({traitPath: traitPath, target: target, timeout: timeout})
    })
    .then(function(r) { return r.json(); })
    .then(function(data) {
        btn.disabled = false;
        btn.textContent = 'Query';
        renderQueryResults(data, traitPath);
    })
    .catch(function(err) {
        btn.disabled = false;
        btn.textContent = 'Query';
        alert('Query failed: ' + err.message);
    });
    return false;
}

function renderQueryResults(data, traitPath) {
    var results = document.getElementById('query-results');
    results.style.display = '';

    var counts = data.counts || {};
    var stats = document.getElementById('query-stats');
    stats.innerHTML =
        '<div class="stat-card stat-card--success"><div class="stat-card__value">' + (counts.responded||0) + '</div><div class="stat-card__label">Responded</div></div>' +
        '<div class="stat-card stat-card--warning"><div class="stat-card__value">' + (counts.timedOut||0) + '</div><div class="stat-card__label">Timed Out</div></div>' +
        '<div class="stat-card stat-card--muted"><div class="stat-card__value">' + (counts.offline||0) + '</div><div class="stat-card__label">Offline</div></div>';

    var html = '<h3>Results for <code>' + escapeHtml(traitPath) + '</code></h3>';
    html += '<table class="table"><thead><tr><th>Hostname</th><th>Value</th><th>Status</th></tr></thead><tbody>';

    var responded = data.responded || [];
    for (var i = 0; i < responded.length; i++) {
        var r = responded[i];
        var val = r.found ? escapeHtml(String(r.value)) : '<span class="text-muted">(not found)</span>';
        html += '<tr><td>' + escapeHtml(r.hostname) + '</td><td class="mono">' + val + '</td><td><span class="badge badge--complete">responded</span></td></tr>';
    }

    var offline = data.offline || [];
    for (var i = 0; i < offline.length; i++) {
        var o = offline[i];
        var val = o.found ? escapeHtml(String(o.value)) : '<span class="text-muted">(not found)</span>';
        var cached = o.collectedAt ? ' (cached)' : '';
        html += '<tr><td>' + escapeHtml(o.hostname) + '</td><td class="mono">' + val + '</td><td><span class="badge badge--offline">offline' + cached + '</span></td></tr>';
    }

    var timedOut = data.timedOut || [];
    for (var i = 0; i < timedOut.length; i++) {
        html += '<tr><td>' + escapeHtml(timedOut[i].hostname) + '</td><td class="text-muted">-</td><td><span class="badge badge--timeout">timed_out</span></td></tr>';
    }

    if (responded.length === 0 && offline.length === 0 && timedOut.length === 0) {
        html += '<tr><td colspan="3" class="text-muted" style="text-align:center; padding:40px;">No thralls matched the target spec.</td></tr>';
    }

    html += '</tbody></table>';
    document.getElementById('query-table').innerHTML = html;
}

function escapeHtml(s) {
    var d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
}
</script>
{{end}}
