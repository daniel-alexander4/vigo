{{template "admin-base" .}}

{{define "admin-content"}}
<div class="page-header">
    <h1>Enrollment Patterns</h1>
</div>

<div class="card">
    <div class="card__header">
        <h2>Add Pattern</h2>
    </div>
    <div class="card__body">
        <form id="add-pattern-form" hx-boost="false" onsubmit="return addPattern(event)">
            <div class="form-row">
                <div class="form-group">
                    <label for="pattern">Pattern</label>
                    <input type="text" id="pattern" name="pattern" required class="form-input" placeholder="*.web.example.com">
                </div>
                <div class="form-group">
                    <label for="token">Token</label>
                    <input type="text" id="token" name="token" required class="form-input" placeholder="one-time enrollment token">
                </div>
            </div>
            <button type="submit" class="btn btn--primary">Add Pattern</button>
        </form>
    </div>
</div>

<div class="card mt-4">
    <div class="card__header">
        <h2>All Patterns</h2>
    </div>
    <div class="card__body">
        <table class="table" id="patterns-table">
            <thead>
                <tr>
                    <th>Pattern</th>
                    <th>Token Status</th>
                    <th>Used By</th>
                    <th>Created</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="patterns-body">
                <tr>
                    <td colspan="5" class="text-center text-muted">Loading...</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<script>
function formatDate(s) {
    if (!s) return '';
    var d = new Date(s);
    return d.toISOString().slice(0, 10);
}

function loadPatterns() {
    fetch('/api/v1/approved')
        .then(function(resp) { return resp.json(); })
        .then(function(data) {
            var patterns = data.patterns || [];
            var tbody = document.getElementById('patterns-body');
            if (patterns.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" class="text-center text-muted">No patterns yet.</td></tr>';
                return;
            }
            var html = '';
            for (var i = 0; i < patterns.length; i++) {
                var p = patterns[i];
                var statusClass = p.used ? 'failing' : 'compliant';
                var statusText = p.used ? 'used' : 'available';
                html += '<tr id="pattern-' + p.id + '">' +
                    '<td>' + escapeHtml(p.pattern) + '</td>' +
                    '<td><span class="badge badge--' + statusClass + '">' + statusText + '</span></td>' +
                    '<td>' + escapeHtml(p.usedBy || '') + '</td>' +
                    '<td>' + formatDate(p.createdAt) + '</td>' +
                    '<td><button class="btn btn--text btn--small btn--danger" data-pattern-id="' + p.id + '" onclick="revokePattern(this)">Revoke</button></td>' +
                    '</tr>';
            }
            tbody.innerHTML = html;
        })
        .catch(function(err) {
            document.getElementById('patterns-body').innerHTML =
                '<tr><td colspan="5" class="text-center text-muted">Failed to load patterns.</td></tr>';
        });
}

function escapeHtml(s) {
    var div = document.createElement('div');
    div.appendChild(document.createTextNode(s));
    return div.innerHTML;
}

async function addPattern(e) {
    e.preventDefault();
    var form = e.target;
    var resp = await fetch('/api/v1/approved', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
            pattern: form.pattern.value,
            token: form.token.value,
        }),
    });
    if (resp.ok) {
        form.reset();
        loadPatterns();
    } else {
        var data = await resp.json().catch(function() { return {}; });
        alert(data.error || data.message || 'Failed to add pattern');
    }
}

async function revokePattern(btn) {
    var id = btn.dataset.patternId;
    if (!confirm('Revoke this enrollment pattern?')) return;
    var resp = await fetch('/api/v1/approved/' + encodeURIComponent(id), { method: 'DELETE' });
    if (resp.ok) {
        document.getElementById('pattern-' + id).remove();
    } else {
        var data = await resp.json().catch(function() { return {}; });
        alert(data.error || data.message || 'Failed to revoke pattern');
    }
}

loadPatterns();
</script>
{{end}}
