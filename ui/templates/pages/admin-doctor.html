{{template "base" .}}

{{define "page-content"}}
<div class="page-header">
    <h1>System Health</h1>
    <div id="overall-status"></div>
</div>

<div class="card">
    <div class="card__header">
        <h2>Health Checks</h2>
        <button class="btn btn--primary" onclick="runChecks()">Run Checks</button>
    </div>
    <div class="card__body">
        <table class="table" id="checks-table">
            <thead>
                <tr>
                    <th>Check Name</th>
                    <th>Status</th>
                    <th>Message</th>
                </tr>
            </thead>
            <tbody id="checks-body">
                <tr>
                    <td colspan="3" class="text-center text-muted">Running checks...</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<script>
function escapeHtml(s) {
    var div = document.createElement('div');
    div.appendChild(document.createTextNode(s));
    return div.innerHTML;
}

function statusBadgeClass(status) {
    switch (status) {
        case 'pass': return 'compliant';
        case 'warn': return 'drifted';
        case 'fail': return 'failing';
        case 'skip': return 'unknown';
        default: return 'unknown';
    }
}

function overallBadgeClass(status) {
    switch (status) {
        case 'healthy': return 'compliant';
        case 'degraded': return 'drifted';
        case 'unhealthy': return 'failing';
        default: return 'unknown';
    }
}

async function runChecks() {
    var tbody = document.getElementById('checks-body');
    tbody.innerHTML = '<tr><td colspan="3" class="text-center text-muted">Running checks...</td></tr>';
    document.getElementById('overall-status').innerHTML = '';

    try {
        var resp = await fetch('/api/v1/doctor');
        var data = await resp.json();

        document.getElementById('overall-status').innerHTML =
            '<span class="badge badge--' + overallBadgeClass(data.status) + '">' + escapeHtml(data.status) + '</span>';

        var checks = data.checks || [];
        if (checks.length === 0) {
            tbody.innerHTML = '<tr><td colspan="3" class="text-center text-muted">No checks returned.</td></tr>';
            return;
        }

        var html = '';
        for (var i = 0; i < checks.length; i++) {
            var c = checks[i];
            html += '<tr>' +
                '<td>' + escapeHtml(c.name) + '</td>' +
                '<td><span class="badge badge--' + statusBadgeClass(c.status) + '">' + escapeHtml(c.status) + '</span></td>' +
                '<td>' + escapeHtml(c.message || '') + '</td>' +
                '</tr>';
        }
        tbody.innerHTML = html;
    } catch (err) {
        tbody.innerHTML = '<tr><td colspan="3" class="text-center text-muted">Failed to run health checks.</td></tr>';
        alert('Failed to run health checks');
    }
}

runChecks();
</script>
{{end}}
