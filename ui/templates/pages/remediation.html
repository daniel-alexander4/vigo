{{define "page-content"}}
<div class="page-header">
    <h1>Remediation</h1>
    <p>Fleet remediation status and run history</p>
</div>

<div class="card">
    <h2>Remediation Status</h2>
    <div hx-get="/ui/fragments/remediation-status" hx-trigger="load" hx-swap="outerHTML">
        <div class="loading">Loading...</div>
    </div>
</div>

<div class="card mt-3">
    <h2>Run History</h2>
    <div hx-get="/ui/fragments/remediation-runs" hx-trigger="load" hx-swap="outerHTML">
        <div class="loading">Loading...</div>
    </div>
</div>
{{end}}
