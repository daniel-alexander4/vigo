{{template "admin-base" .}}

{{define "admin-content"}}
<div class="page-header">
    <h1>Webhooks</h1>
</div>

<div class="card">
    <div class="card__header">
        <h2>Add Webhook</h2>
    </div>
    <div class="card__body">
        <form id="add-webhook-form" hx-boost="false" onsubmit="return addWebhook(event)">
            <div class="form-row">
                <div class="form-group">
                    <label for="webhook-url">URL</label>
                    <input type="text" id="webhook-url" name="url" required class="form-input" placeholder="https://example.com/webhook">
                </div>
                <div class="form-group">
                    <label for="webhook-secret">Secret</label>
                    <input type="password" id="webhook-secret" name="secret" class="form-input" placeholder="HMAC signing secret">
                </div>
                <div class="form-group">
                    <label for="webhook-events">Events</label>
                    <input type="text" id="webhook-events" name="events" required class="form-input" placeholder="run.failure,drift.detected">
                </div>
            </div>
            <button type="submit" class="btn btn--primary">Add Webhook</button>
        </form>
    </div>
</div>

<div class="card mt-4">
    <div class="card__header">
        <h2>Registered Webhooks</h2>
    </div>
    <div class="card__body">
        <table class="table" id="webhooks-table">
            <thead>
                <tr>
                    <th>URL</th>
                    <th>Events</th>
                    <th>Active</th>
                    <th>Created</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="webhooks-body">
                <tr>
                    <td colspan="5" class="text-center text-muted">Loading...</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<script>
function formatDate(s) {
    if (!s) return '';
    var d = new Date(s);
    return d.toISOString().slice(0, 10);
}

function escapeHtml(s) {
    var div = document.createElement('div');
    div.appendChild(document.createTextNode(s));
    return div.innerHTML;
}

function loadWebhooks() {
    fetch('/api/v1/webhooks')
        .then(function(resp) { return resp.json(); })
        .then(function(data) {
            var webhooks = data.webhooks || [];
            var tbody = document.getElementById('webhooks-body');
            if (webhooks.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" class="text-center text-muted">No webhooks configured.</td></tr>';
                return;
            }
            var html = '';
            for (var i = 0; i < webhooks.length; i++) {
                var wh = webhooks[i];
                var events = (wh.events || []).map(function(e) {
                    return '<span class="badge badge--unknown">' + escapeHtml(e) + '</span>';
                }).join(' ');
                var activeClass = wh.active ? 'compliant' : 'failing';
                var activeText = wh.active ? 'active' : 'inactive';
                html += '<tr id="webhook-' + wh.id + '">' +
                    '<td>' + escapeHtml(wh.url) + '</td>' +
                    '<td>' + events + '</td>' +
                    '<td><span class="badge badge--' + activeClass + '">' + activeText + '</span></td>' +
                    '<td>' + formatDate(wh.createdAt) + '</td>' +
                    '<td><button class="btn btn--text btn--small btn--danger" data-webhook-id="' + wh.id + '" onclick="deleteWebhook(this)">Delete</button></td>' +
                    '</tr>';
            }
            tbody.innerHTML = html;
        })
        .catch(function() {
            document.getElementById('webhooks-body').innerHTML =
                '<tr><td colspan="5" class="text-center text-muted">Failed to load webhooks.</td></tr>';
        });
}

async function addWebhook(e) {
    e.preventDefault();
    var form = e.target;
    var eventsRaw = form.events.value.split(',').map(function(s) { return s.trim(); }).filter(function(s) { return s; });
    var resp = await fetch('/api/v1/webhooks', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
            url: form.url.value,
            secret: form.secret.value,
            events: eventsRaw,
        }),
    });
    if (resp.ok) {
        form.reset();
        loadWebhooks();
    } else {
        var data = await resp.json().catch(function() { return {}; });
        alert(data.error || data.message || 'Failed to add webhook');
    }
}

async function deleteWebhook(btn) {
    var id = btn.dataset.webhookId;
    if (!confirm('Delete this webhook?')) return;
    var resp = await fetch('/api/v1/webhooks/' + encodeURIComponent(id), { method: 'DELETE' });
    if (resp.ok) {
        document.getElementById('webhook-' + id).remove();
    } else {
        var data = await resp.json().catch(function() { return {}; });
        alert(data.error || data.message || 'Failed to delete webhook');
    }
}

loadWebhooks();
</script>
{{end}}
