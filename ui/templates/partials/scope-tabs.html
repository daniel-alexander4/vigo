{{define "scope-tabs"}}
{{if $.ScopeTabs}}
<div class="topbar__scope">
    {{if le (len $.ScopeTabs) 4}}
    <nav class="scope-tabs" aria-label="{{T $.Locale "spanner.scope_aria"}}">
        {{range $.ScopeTabs}}
        <button type="button" data-set-scope="{{.Key}}" class="scope-tab{{if .Active}} scope-tab--active{{end}}"{{if .Active}} aria-current="true"{{end}}>
            {{if .IsFleet}}{{T $.Locale "spanner.tab_fleet"}}{{else}}{{.Label}}{{if .IsLocal}} <span class="scope-tab__self">{{T $.Locale "spanner.tab_this_bolt_suffix"}}</span>{{end}}{{end}}
        </button>
        {{end}}
    </nav>
    {{else}}
    <select data-change="set-scope" class="input input--sm scope-select" aria-label="{{T $.Locale "spanner.scope_aria"}}">
        {{range $.ScopeTabs}}
        <option value="{{.Key}}"{{if .Active}} selected{{end}}>{{if .IsFleet}}{{T $.Locale "spanner.tab_fleet"}}{{else}}{{.Label}}{{if .IsLocal}} {{T $.Locale "spanner.tab_this_bolt_suffix"}}{{end}}{{end}}</option>
        {{end}}
    </select>
    {{end}}
    {{if not $.ScopeAware}}
    <span class="scope-caption" title="{{T $.Locale "spanner.not_bolt_specific_title"}}">{{T $.Locale "spanner.not_bolt_specific"}}</span>
    {{end}}
</div>
{{end}}
{{end}}
