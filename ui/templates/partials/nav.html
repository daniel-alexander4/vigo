{{define "nav"}}
<aside class="sidebar" id="main-sidebar">
    <div class="sidebar__top">
        <div class="sidebar__brand">
            <a href="/" class="sidebar__logo-link">
                <img src="{{if .CustomLogo}}/branding/logo{{else}}/static/img/logo-dark.svg{{end}}" alt="{{if .OrgName}}{{.OrgName}}{{else}}Vigo{{end}}" class="sidebar__logo-img">
            </a>
            {{if .OrgName}}<div class="sidebar__org-name">{{.OrgName}}</div>{{end}}
        </div>
        <button class="sidebar__toggle" onclick="toggleSidebar()" title="Toggle sidebar">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" width="16" height="16">
                <rect x="3" y="3" width="18" height="18" rx="2"/><line x1="9" y1="3" x2="9" y2="21"/>
            </svg>
        </button>
    </div>
    <nav class="sidebar__nav">
        <a href="/" class="nav-link{{if eq .ActiveNav "dashboard"}} nav-link--active{{end}}">
            Dashboard
        </a>

        <div class="nav-group__label">Fleet</div>
        <a href="/fleet" class="nav-link{{if eq .ActiveNav "fleet"}} nav-link--active{{end}}">
            Fleet
        </a>
        <a href="/envoys" class="nav-link{{if eq .ActiveNav "envoys"}} nav-link--active{{end}}">
            Envoys
        </a>
        {{if .SpannerEnabled}}
        <a href="/spanner" class="nav-link{{if eq .ActiveNav "spanner"}} nav-link--active{{end}}">
            Spanner
        </a>
        {{end}}

        <div class="nav-group__label">Security &amp; Compliance</div>
        <a href="/ask" class="nav-link{{if eq .ActiveNav "ask"}} nav-link--active{{end}}">
            Security
        </a>
        <a href="/compliance" class="nav-link{{if eq .ActiveNav "compliance"}} nav-link--active{{end}}">
            Compliance
        </a>
        <a href="/audit" class="nav-link{{if eq .ActiveNav "audit"}} nav-link--active{{end}}">
            Audit
        </a>

        <div class="nav-group__divider"></div>
        {{if .DocsEnabled}}
        <a href="/docs" class="nav-link{{if eq .ActiveNav "docs"}} nav-link--active{{end}}">
            Documentation
        </a>
        {{end}}

        <div class="nav-group__label">Vigo</div>
        <a href="/license" class="nav-link{{if eq .ActiveNav "license"}} nav-link--active{{end}}">
            License
        </a>
    </nav>
</aside>
{{end}}
