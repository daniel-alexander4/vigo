{{define "nav"}}
<aside class="sidebar">
    <div class="sidebar__brand">
        <a href="/" class="sidebar__logo-link">
            <img src="/static/img/logo-dark.svg" alt="Hobnob" class="sidebar__logo-img">
        </a>
    </div>
    <nav class="sidebar__nav">
        <a href="/" class="nav-link{{if eq .ActiveNav "dashboard"}} nav-link--active{{end}}">
            Dashboard
        </a>
        <a href="/thralls" class="nav-link{{if eq .ActiveNav "thralls"}} nav-link--active{{end}}">
            Thralls
        </a>
        <a href="/runs" class="nav-link{{if eq .ActiveNav "runs"}} nav-link--active{{end}}">
            Runs
        </a>
        <a href="/compliance" class="nav-link{{if eq .ActiveNav "compliance"}} nav-link--active{{end}}">
            Compliance
        </a>
        <a href="/tasks" class="nav-link{{if eq .ActiveNav "tasks"}} nav-link--active{{end}}">
            Tasks
        </a>
        <a href="/workflows" class="nav-link{{if eq .ActiveNav "workflows"}} nav-link--active{{end}}">
            Workflows
        </a>
        <a href="/query" class="nav-link{{if eq .ActiveNav "query"}} nav-link--active{{end}}">
            Query
        </a>
        {{if .SpannerEnabled}}
        <a href="/spanner" class="nav-link{{if eq .ActiveNav "spanner"}} nav-link--active{{end}}">
            Spanner
        </a>
        {{end}}
        <a href="/audit" class="nav-link{{if eq .ActiveNav "audit"}} nav-link--active{{end}}">
            Audit
        </a>
        <a href="/docs" target="_blank" class="nav-link{{if eq .ActiveNav "docs"}} nav-link--active{{end}}">
            Documentation
        </a>
        {{if .AIEnabled}}
        <a href="/ask" class="nav-link{{if eq .ActiveNav "ask"}} nav-link--active{{end}}">
            Security
        </a>
        {{end}}
        <a href="/license" class="nav-link{{if eq .ActiveNav "license"}} nav-link--active{{end}}">
            License
        </a>
        {{if and .AuthEnabled .CurrentUser (.CurrentUser.IsAdmin)}}
        <a href="/admin" class="nav-link{{if eq .ActiveNav "admin"}} nav-link--active{{end}}">
            Admin
        </a>
        {{end}}
    </nav>
</aside>
{{end}}
