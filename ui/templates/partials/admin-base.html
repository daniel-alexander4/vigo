{{define "admin-base"}}<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Hobnob Admin - {{.Title}}</title>
    <link rel="stylesheet" href="/static/css/style.css?v={{.Version}}">
    <script src="/static/js/htmx.min.js?v={{.Version}}"></script>
</head>
<body>
    <div class="layout">
        {{template "admin-nav" .}}
        <main class="content">
            {{if .AuthEnabled}}{{if .CurrentUser}}
            <header class="topbar">
                <div class="topbar__right">
                    <div class="topbar__user">
                        <svg class="topbar__avatar" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                        <span class="topbar__username">{{if .CurrentUser.DisplayName}}{{.CurrentUser.DisplayName}}{{else}}{{.CurrentUser.Username}}{{end}}</span>
                        <span class="badge badge--{{.CurrentUser.Role}}">{{.CurrentUser.Role}}</span>
                    </div>
                    <form method="POST" action="/logout" hx-boost="false">
                        <button type="submit" class="topbar__logout">Sign out</button>
                    </form>
                </div>
            </header>
            {{end}}{{end}}
            {{block "admin-content" .}}{{end}}
        </main>
    </div>
</body>
</html>
{{end}}
