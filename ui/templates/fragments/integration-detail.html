{{define "integration-detail-fragment"}}
<div class="card u-mt-1rem">
    <h3>{{.Name}}</h3>
    <p>{{.Description}}</p>
    <p><strong>{{T $.Locale "integration_detail.supported_events"}}</strong> {{.Events}}</p>
    <h4>{{T $.Locale "integration_detail.example"}} server.yaml</h4>
    <pre class="u-blk1"><code>{{.ExampleYAML}}</code></pre>
</div>
{{end}}
