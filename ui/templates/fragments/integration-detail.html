{{define "integration-detail-fragment"}}
<div class="card" style="margin-top: 1rem;">
    <h3>{{.Name}}</h3>
    <p>{{.Description}}</p>
    <p><strong>Supported events:</strong> {{.Events}}</p>
    <h4>Example server.yaml</h4>
    <pre style="background: var(--color-muted-bg); color: var(--color-text); padding: 1rem; border-radius: 6px; overflow-x: auto; font-size: 0.85rem;"><code>{{.ExampleYAML}}</code></pre>
</div>
{{end}}
